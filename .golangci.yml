version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      colors: true
      print-linter-name: true
      print-issued-lines: true

linters:
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 40
    dupl:
      threshold: 150
    misspell:
      locale: US

  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - staticcheck
    - gosec
    - bodyclose
    - rowserrcheck
    - errorlint
    - copyloopvar
    - gocyclo
    - gocognit
    - funlen
    - dupl
    - misspell
    - unparam
    - nakedret
    - perfsprint
  disable:
    - gochecknoglobals
    - gochecknoinits
    - nilerr
    - wrapcheck
    - noctx
    - prealloc
    - fatcontext
    - nestif
