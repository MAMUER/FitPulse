version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

output:
  formats:
    text:
      colors: true
      print-linter-name: true
      print-issued-lines: true

linters:
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      # gRPC/HTTP handlers в cmd/*/main.go выполняют валидацию, вызов сервиса и
      # маппинг ответа в одном месте; самые длинные функции уже разделены на
      # помощники, оставшиеся укладываются в эти лимиты.
      lines: 100
      statements: 50
    dupl:
      threshold: 150
    misspell:
      locale: US

  exclusions:
    # Tests legitimately violate length/duplication/security heuristics:
    # table-driven tests are long and repetitive by design, and they use
    # throwaway fixtures (hardcoded secrets, servers bound to :0) that would
    # be findings in production code but are irrelevant here.
    rules:
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - gosec

  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - staticcheck
    - gosec
    - bodyclose
    - rowserrcheck
    - errorlint
    - copyloopvar
    - gocyclo
    - gocognit
    - funlen
    - dupl
    - misspell
    - unparam
    - nakedret
    - perfsprint
  disable:
    - gochecknoglobals
    - gochecknoinits
    - nilerr
    - wrapcheck
    - noctx
    - prealloc
    - fatcontext
    - nestif
