misconfiguration:
  trusted_registries:
    - docker.io
    - quay.io
    - gcr.io
    - registry.k8s.io
    - ghcr.io
    - public.ecr.aws
    - mcr.microsoft.com

ignore:
  - id: KSV-0121
    paths:
      - configs/monitoring/node-exporter/daemonset.yaml
    # Принятый риск: node-exporter требует HostPath /proc, /sys и / для сбора метрик хоста.
  - id: KSV-0010
    paths:
      - configs/monitoring/node-exporter/daemonset.yaml
    # Принятый риск: hostPID необходим node-exporter'у для доступа к /proc/[pid] процессов.
  - id: KSV-0009
    paths:
      - configs/k8s/base/ingress-nginx/deployment.yaml
    # Принятый риск: hostNetwork=true необходим ingress-nginx на bare-metal/VPS для приёма трафика на портам 80/443 без внешнего балансировщика.
  - id: KSV-0109
    paths:
      - configs/k8s/base/ingress-nginx/configmap.yaml
    # Ложноположительное: ключ `server-tokens: "false"` — это не секрет, а настройка скрытия версии nginx в заголовках ответа.
  - id: GHSA-qwww-vcr4-c8h2
    paths:
      - web/package-lock.json
    # Ложноположительное: уязвимость касается только unstable RSC API, которые не используются в проекте (нет директив `use server`/`use client` в web/src).
  - id: KSV-0125
    paths:
      - configs/monitoring/node-exporter/daemonset.yaml
      - configs/monitoring/grafana/deployment.yaml
      - configs/monitoring/fluent-bit/daemonset.yaml
      - configs/k8s/base/local-path-provisioner.yaml
      - configs/monitoring/alertmanager/deployment.yaml
      - configs/monitoring/prometheus/deployment.yaml
    # Ложноположительное: все образы — официальные images из docker.io (Prometheus, Grafana, Fluent Bit, Rancher), который указан в trusted_registries. Trivy не распознаёт префикс docker.io в коротких именах образов.
  - id: KSV-0023
    paths:
      - configs/monitoring/node-exporter/daemonset.yaml
      - configs/monitoring/fluent-bit/daemonset.yaml
    # Принятый риск: HostPath монтирования необходимы node-exporter'у (/proc, /sys, /) и fluent-bit (/var/log, /var/lib/docker/containers, /run/log) для сбора метрик и логов хоста. Без них мониторинг и логирование невозможны.
  - id: KSV-0012
    paths:
      - configs/monitoring/node-exporter/daemonset.yaml
      - configs/k8s/base/local-path-provisioner.yaml
    # Принятый риск: node-exporter требует root для доступа к /proc и /sys. local-path-provisioner требует root и DAC_OVERRIDE для управления правами на PV.
  - id: KSV-0022
    paths:
      - configs/k8s/base/local-path-provisioner.yaml
    # Принятый риск: DAC_OVERRIDE необходим local-path-provisioner для управления правами на директории хоста при создании PersistentVolumes.
  - id: KSV-0048
    paths:
      - configs/k8s/base/local-path-provisioner.yaml
    # Принятый риск: local-path-provisioner создает helper pods для настройки директорий на узлах. Это стандартный паттерн для storage provisioners без доступа к hostPath напрямую.
  - id: KSV-0049
    paths:
      - configs/k8s/base/local-path-provisioner.yaml
    # Исправлено: в ClusterRole `local-path-provisioner-role` удалены избыточные права `create`, `update`, `patch`, `delete` для configmaps. Provisioner только читает ConfigMap `local-path-config` через volume mount.
