        /* ── ROOT ── */
        :root {
            --bg: #050b08;
            --card: #0d1b14;
            --card-2: #15291f;
            --line: rgba(255,255,255,.1);
            --text: #f3fff7;
            --muted: #8da99a;
            --green: #6fae20;
            --green-light: #a5ed38;
            --blue: #19d8da;
            --orange: #ff9947;
            --red: #ff6375;
            --purple: #a78bfa;
            --yellow: #f5d45d;
            --gold: #f5c842;
            --gold-glow: #f5c84266;
            --radius: 20px;
            --transition: .25s ease;
            --shadow: 0 0 30px #0006;
            --font: 'Manrope', sans-serif;
            --font-display: 'Barlow Condensed', sans-serif;
            --neon-glow: 0 0 20px var(--blue), 0 0 60px var(--blue), 0 0 100px var(--green);
        }
        [data-theme="light"] {
            --bg: #f1f8f4;
            --card: #fff;
            --card-2: #e2f0e8;
            --line: rgba(20,70,45,.13);
            --text: #13251b;
            --muted: #607669;
            --neon-glow: 0 0 20px var(--blue), 0 0 60px var(--blue), 0 0 100px var(--green);
        }
        [data-highcontrast="on"] {
            --bg: #fff !important;
            --card: #fff !important;
            --card-2: #f2f2f2 !important;
            --line: #111 !important;
            --text: #000 !important;
            --muted: #333 !important;
            --green: #075f18 !important;
            --green-light: #075f18 !important;
            --blue: #0057a8 !important;
            --orange: #8a3b00 !important;
            --red: #9b0000 !important;
            --purple: #5b1aa8 !important;
            --yellow: #6b5700 !important;
            --gold: #705500 !important;
            --gold-glow: #70550044 !important;
            --shadow: 0 4px 20px rgba(0,0,0,.18) !important;
        }
        [data-highcontrast="on"] body,
        [data-highcontrast="on"] #app { background: #fff !important; color:#000 !important; }
        [data-highcontrast="on"] .splash { background:#fff !important; color:#000 !important; }
        [data-highcontrast="on"] .splash h1 { color:#000 !important; text-shadow:none !important; }
        [data-highcontrast="on"] .splash p { color:#222 !important; }
        [data-highcontrast="on"] a { color:#0057a8 !important; }
        [data-highcontrast="on"] button.primary { background:#000 !important; color:#fff !important; border-color:#000 !important; }
        [data-highcontrast="on"] .status.good { background: #075f18; color: #fff; }
        [data-highcontrast="on"] .status.low { background: #0057a8; color: #fff; }
        [data-highcontrast="on"] .status.high { background: #8a3b00; color: #fff; }
        [data-highcontrast="on"] .splash-logo {
            border-color: #fff !important;
            box-shadow: 0 0 30px #fff, 0 0 60px #fff !important;
        }
        [data-highcontrast="on"] .side-logo {
            text-shadow: 0 0 20px #fff !important;
        }
        [data-highcontrast="on"] .readiness {
            border-color: #fff !important;
        }
        [data-highcontrast="on"] .status.good { background: #00ff00; color: #000; }
        [data-highcontrast="on"] .status.low { background: #00ffff; color: #000; }
        [data-highcontrast="on"] .status.high { background: #ffaa00; color: #000; }
        [data-highcontrast="on"] .card,
        [data-highcontrast="on"] button,
        [data-highcontrast="on"] input,
        [data-highcontrast="on"] select,
        [data-highcontrast="on"] textarea { border-width: 2px !important; }
        [data-highcontrast="on"] .fp-calendar-date.active {
            border-color: #fff !important;
            box-shadow: 0 0 15px #fff !important;
        }
        [data-highcontrast="on"] .fp-online-card.online-gym { border-color: #00ff00 !important; }
        [data-highcontrast="on"] .fp-online-card.online-pool { border-color: #00ffff !important; }
        [data-highcontrast="on"] .fp-online-card.dnd { border-color: #ff4444 !important; }

        /* High contrast follows the selected theme. */
        [data-theme="light"][data-highcontrast="on"] { --bg:#fff !important; --card:#fff !important; --card-2:#f2f2f2 !important; --line:#111 !important; --text:#000 !important; --muted:#333 !important; --green:#075f18 !important; --green-light:#075f18 !important; --blue:#0057a8 !important; --orange:#8a3b00 !important; --red:#9b0000 !important; --purple:#5b1aa8 !important; --yellow:#6b5700 !important; --gold:#705500 !important; --gold-glow:#70550044 !important; --shadow:0 4px 20px rgba(0,0,0,.18) !important; }
        [data-theme="dark"][data-highcontrast="on"] { --bg:#050b08 !important; --card:#0d1b14 !important; --card-2:#15291f !important; --line:#fff !important; --text:#fff !important; --muted:#d7eee2 !important; --green:#79c52a !important; --green-light:#b8ff55 !important; --blue:#42f5f5 !important; --orange:#ffb36b !important; --red:#ff7180 !important; --purple:#c4a8ff !important; --yellow:#ffe87a !important; --gold:#ffd95a !important; --gold-glow:#ffd95a66 !important; --shadow:0 4px 20px rgba(0,0,0,.65) !important; }
        [data-theme="dark"][data-highcontrast="on"] body, [data-theme="dark"][data-highcontrast="on"] #app { background:#050b08 !important; color:#fff !important; }
        [data-theme="dark"][data-highcontrast="on"] .splash { background:#020604 !important; color:#fff !important; }
        [data-theme="dark"][data-highcontrast="on"] .splash h1 { color:#fff !important; text-shadow:0 0 20px var(--blue) !important; }
        [data-theme="dark"][data-highcontrast="on"] .splash p { color:#d7eee2 !important; }
        [data-theme="dark"][data-highcontrast="on"] a { color:var(--blue) !important; }
        [data-theme="dark"][data-highcontrast="on"] button.primary { background:#fff !important; color:#000 !important; border-color:#fff !important; }
        [data-theme="dark"][data-highcontrast="on"] .splash-logo { border-color:var(--blue) !important; box-shadow:0 0 30px var(--blue),0 0 60px var(--blue) !important; }
        [data-theme="dark"][data-highcontrast="on"] .side-logo { text-shadow:0 0 20px var(--blue) !important; }
        [data-theme="dark"][data-highcontrast="on"] .readiness { border-color:var(--blue) !important; }
        .fp-story-strip { scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
        .fp-story-card { scroll-snap-align:start; }
        .fp-story-viewer, .fp-story-view { touch-action:none; user-select:none; }
        .fp-story-progress i.active { transform:scaleY(1.15); }
        .fp-story-hint { position:absolute; top:34px; left:50%; z-index:3; transform:translateX(-50%); color:#fff9; font-size:8px; pointer-events:none; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid; place-items: center;
            overflow: hidden;
            overscroll-behavior: none;
            color: var(--text);
            background: radial-gradient(circle at 0 0, #6fae2033, transparent 31%), radial-gradient(circle at 100% 100%, #19d8da2b, transparent 32%), var(--bg);
            font-family: var(--font);
        }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
        a:not([href]) { cursor:pointer; }
        .topbar .icon, .profile-stats > div { cursor:pointer; }
        /* ── RELEASE ACCESSIBILITY / ROBUSTNESS ── */
        :focus-visible { outline: 3px solid var(--blue) !important; outline-offset: 3px; }
        button, a, [role="button"], input, select, textarea { -webkit-tap-highlight-color: transparent; }
        button:disabled { cursor:not-allowed; opacity:.55; }
        img { max-width:100%; }
        @media (max-width: 380px) { .auth { padding-left:14px !important; padding-right:14px !important; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
        .fp-story-card.seen { opacity:.72; }
        .fp-story-card:not(.seen)::after { content:""; position:absolute; inset:8px; border:2px solid var(--blue); border-radius:inherit; pointer-events:none; }
        .fp-story-card { position:relative; }
        .fp-story-seen-dot { position:absolute; top:10px; right:10px; width:9px; height:9px; border-radius:50%; background:var(--muted); border:2px solid var(--card); }
        .fp-story-viewer.hold-paused .fp-story-view { animation-play-state:paused !important; }
        .fp-offline-badge { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:9998; background:#b00020; color:#fff; padding:7px 12px; border-radius:999px; font-size:12px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
        .fp-toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%, 20px); z-index:9999; max-width:min(92vw,420px); padding:11px 15px; border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; font-size:14px; }
        .fp-toast.show { opacity:1; transform:translate(-50%,0); }
        @media (prefers-reduced-motion: reduce) { .fp-toast { transition:none; } }

        h1, h2, h3, .number, .logo-text { font-family: var(--font-display); letter-spacing: .5px; }
        #app {
            width: min(100%, 460px);
            height: min(920px, 100vh);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 32px;
            background: var(--bg);
            box-shadow: var(--shadow);
        }
        .page {
            height: 100%;
            overflow-y: auto;
            overscroll-behavior: contain;
            scroll-behavior: auto;
            padding: 24px 17px 108px;
            animation: pageIn .3s ease;
        }
        .page::-webkit-scrollbar, .horizontal::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
        @keyframes pageIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

        /* ── SPLASH ── */
        .splash {
            position: absolute; inset:0; z-index:50;
            display: grid; place-items: center;
            overflow: hidden;
            background: #020604;
            animation: splashOut .7s 5.2s forwards;
        }
        .splash-scene {
            position: absolute; inset:0;
            background: linear-gradient(#02060455, #020604f2), url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=1200") center/cover;
            animation: sceneZoom 5.2s ease;
        }
        .splash-scene::after {
            content: ""; position: absolute; inset:0;
            opacity:0;
            background: linear-gradient(#02060455, #020604f2), url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1200") center/cover;
            animation: sceneChange 5.2s 1.5s ease;
        }
        .splash-content { position: relative; z-index:1; text-align: center; animation: splashIn .9s ease; }
        .splash-logo {
            width: 120px; height: 120px;
            display: block; margin: auto;
            object-fit: contain;
            border: 2px solid var(--blue);
            border-radius: 30px;
            background: #07130d;
            animation: neonPulse 2.5s ease-in-out infinite, floatLogo 3s ease-in-out infinite;
            box-shadow: var(--neon-glow);
            padding: 4px;
        }
        @keyframes neonPulse {
            0%,100% { box-shadow: 0 0 20px var(--blue), 0 0 60px var(--blue), 0 0 100px var(--green); }
            50% { box-shadow: 0 0 30px var(--blue), 0 0 80px var(--blue), 0 0 120px var(--green), 0 0 160px var(--green-light); }
        }
        .splash h1 {
            margin-top: 22px;
            color: #fff;
            font-size: 66px;
            text-shadow: 0 0 20px var(--blue), 0 0 50px var(--blue), 0 0 80px var(--green);
            animation: textGlow 3s ease-in-out infinite;
        }
        @keyframes textGlow {
            0%,100% { text-shadow: 0 0 20px var(--blue), 0 0 50px var(--blue), 0 0 80px var(--green); }
            50% { text-shadow: 0 0 30px var(--blue), 0 0 70px var(--blue), 0 0 100px var(--green), 0 0 140px var(--green-light); }
        }
        .splash p { margin-top:4px; color:#d7eee2; font-size:10px; letter-spacing:3px; text-transform:uppercase; }
        @keyframes sceneZoom { from { transform:scale(1.14); } to { transform:scale(1); } }
        @keyframes sceneChange { 40%,78% { opacity:.85; } 100% { opacity:0; } }
        @keyframes splashIn { from { opacity:0; transform:translateY(25px) scale(.88); } to { opacity:1; transform:none; } }
        @keyframes splashOut { to { opacity:0; visibility:hidden; pointer-events:none; } }
        @keyframes floatLogo { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-7px) scale(1.02); } }

        /* ── SIDE LOGO (glow only) ── */
        .side-logo {
            position: absolute; z-index:10; top:19px; right:14px;
            color: var(--blue);
            font: 900 27px var(--font-display);
            letter-spacing:2px;
            pointer-events:none;
            text-shadow: 0 0 15px var(--blue), 0 0 40px var(--blue), 0 0 70px var(--green);
            animation: neonPulse 2.5s ease-in-out infinite, floatLogo 3s ease-in-out infinite;
        }
        .notification {
            width:32px; height:32px;
            position:absolute; z-index:10; top:20px; left:14px;
            color:var(--text);
            border:1px solid var(--line);
            border-radius:10px;
            background:var(--card);
            box-shadow:0 0 15px #19d8da33;
            display:grid; place-items:center;
            font-size:14px;
        }
        .notification::after {
            content:""; width:6px; height:6px;
            position:absolute; top:3px; right:3px;
            border-radius:50%;
            background:var(--red);
            box-shadow:0 0 8px var(--red);
        }

        /* ── COMMON ── */
        .topbar, .between, .row { display:flex; align-items:center; }
        .topbar, .between { justify-content:space-between; }
        .topbar { min-height:48px; margin-bottom:20px; padding:4px 60px 0 43px; }
        .topbar h1 { margin-top:3px; font-size:34px; font-weight:700; letter-spacing:-0.5px; font-family:var(--font); }
        .eyebrow { color:var(--muted); font-size:9px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; }
        .page-title { margin-bottom:17px; }
        .page-title h2 { margin-top:5px; font-size:37px; }
        .page-title p { margin-top:5px; color:var(--muted); font-size:11px; line-height:1.45; }
        .section { margin:21px 0 10px; }
        .section h3 { font-size:21px; }
        .section a { color:var(--blue); cursor:pointer; font-size:10px; font-weight:800; }
        .card { padding:15px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); }
        .icon, .primary, .secondary { border:0; border-radius:12px; }
        .icon { width:36px; height:36px; color:var(--muted); border:1px solid var(--line); background:var(--card); display:grid; place-items:center; }
        .primary { padding:12px 15px; color:#07100d; background:linear-gradient(135deg, var(--green-light), var(--green)); box-shadow:0 0 18px #6fae204d; font-size:12px; font-weight:800; }
        .secondary { padding:11px 13px; color:var(--text); border:1px solid var(--line); background:var(--card-2); font-size:10px; }
        .full { width:100%; }
        .photo { width:39px; height:39px; border-radius:50%; background:var(--green); display:grid; place-items:center; font-weight:800; font-size:18px; overflow:hidden; border:2px solid var(--blue); }
        .photo img { width:100%; height:100%; object-fit:cover; }

        /* ── HERO ── */
        .hero {
            min-height:188px; position:relative; overflow:hidden; margin-bottom:20px; padding:22px;
            border:1px solid #19d8da4d; border-radius:25px;
            background:linear-gradient(125deg, #06120bc5, #06120bea), url("https://images.unsplash.com/photo-1517964603305-11c0f6f66012?w=800") center/cover;
        }
        .hero h2 { max-width:220px; margin-top:8px; color:#fff; font-size:38px; line-height:.88; }
        .hero p { max-width:230px; margin-top:10px; color:#c0d1c5; font-size:11px; line-height:1.45; }
        .hero .primary { margin-top:17px; }
        .readiness {
            width:78px; height:78px;
            position:absolute; top:52px; right:22px;
            display:grid; place-items:center;
            color:var(--blue);
            font:30px var(--font-display);
            border:7px solid #19d8da2e;
            border-top-color:var(--blue);
            border-radius:50%;
            box-shadow:0 0 22px #19d8da59;
            animation:spin 3s linear infinite;
        }
        .readiness span { animation:counter 3s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @keyframes counter { to { transform:rotate(-360deg); } }

        /* ── METRICS ── */
        .metrics, .grid-2, .grid-4 { display:grid; gap:8px; }
        .metrics, .grid-2 { grid-template-columns:repeat(2,1fr); }
        .grid-4 { grid-template-columns:repeat(4,1fr); }
        .metric {
            min-height:86px; padding:12px; text-align:left;
            background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
        }
        .metric i { color:var(--metric-color); font-size:14px; }
        .metric strong { display:block; margin-top:5px; color:var(--metric-color); font:29px var(--font-display); }
        .metric small, .metric p { color:var(--muted); font-size:9px; }
        .metric p { margin-top:3px; }
        .metric:nth-child(1) { --metric-color:var(--red); }
        .metric:nth-child(2) { --metric-color:var(--blue); }
        .metric:nth-child(3) { --metric-color:var(--green); }
        .metric:nth-child(4) { --metric-color:var(--purple); }

        .circle-stat {
            min-height:82px; padding:10px 4px; text-align:center;
            border:1px solid var(--line); border-radius:15px; background:var(--card);
        }
        .circle-stat i { color:var(--stat); font-size:14px; }
        .circle-stat b { display:block; margin-top:4px; color:var(--stat); font:24px var(--font-display); }
        .circle-stat small { color:var(--muted); font-size:8px; }

        /* ── CALENDAR ── */
        .week { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
        .day {
            padding:7px 1px; color:var(--muted); text-align:center; border-radius:50%; font-size:8px; cursor:pointer; transition:var(--transition);
        }
        .day b {
            width:30px; height:30px; display:grid; place-items:center; margin:5px auto 0;
            color:var(--text); font:20px var(--font-display); border-radius:50%; transition:var(--transition);
        }
        .day.active { color:#07100d; background:var(--green); }
        .day.active b { color:#07100d; }
        .day.event b { border:2px solid var(--blue); }
        .day.selected b { background:var(--blue); color:#07100d; }
        .day.has-event b::after { content:""; display:block; width:5px; height:5px; margin:-4px auto 0; border-radius:50%; background:var(--blue); }
        .month { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:13px; }
        .month span { padding:6px 0; color:var(--muted); text-align:center; border-radius:8px; font-size:9px; cursor:pointer; transition:var(--transition); }
        .month span:hover { background:var(--card-2); }
        .month .selected { color:#07100d; background:var(--green); }
        .month .has-event { border-bottom:2px solid var(--blue); }
        .calendar-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px; }
        .calendar-stat { padding:10px 4px; text-align:center; border-radius:12px; background:var(--card-2); }
        .calendar-stat b { display:block; color:var(--blue); font:23px var(--font-display); }
        .calendar-stat small { color:var(--muted); font-size:8px; }

        /* ── CHARTS ── */
        .activity-chart, .macro-chart {
            width:142px; height:142px; display:grid; place-items:center; margin:2px auto 14px;
            border:16px solid var(--green); border-top-color:var(--blue); border-right-color:var(--orange); border-bottom-color:var(--purple);
            border-radius:50%; box-shadow:0 0 25px #19d8da33;
        }
        .activity-chart strong, .macro-chart strong { font:30px var(--font-display); }
        .legend { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
        .legend span { color:var(--muted); font-size:9px; }
        .legend i { margin-right:4px; }

        /* ── NUTRITION ── */
        .date-card {
            display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; padding:15px;
            border:1px solid #19d8da4d; border-radius:18px;
            background:linear-gradient(135deg, #19d8da29, var(--card));
        }
        .date-card strong { display:block; margin-top:4px; font-size:18px; }
        .date-card p { margin-top:3px; color:var(--muted); font-size:10px; }
        .date-number {
            width:48px; height:48px; display:grid; place-items:center;
            color:#07100d; font:30px var(--font-display);
            border-radius:14px; background:var(--blue); box-shadow:0 0 20px #19d8da8c;
        }
        .view-tabs, .training-tabs { display:flex; gap:7px; margin-bottom:14px; }
        .view-tab, .training-tab {
            flex:1; padding:10px 5px;
            color:var(--muted); border:1px solid var(--line); border-radius:11px; background:var(--card);
            font-size:10px; text-align:center; transition:var(--transition);
        }
        .view-tab.active, .training-tab.active { color:#07100d; background:var(--blue); }
        .chips { display:flex; gap:7px; margin-bottom:15px; overflow-x:auto; }
        .chip {
            padding:9px 11px; color:var(--muted); white-space:nowrap;
            border:1px solid var(--line); border-radius:11px; background:var(--card);
            font-size:9px; transition:var(--transition);
        }
        .chip.active { color:#07100d; border-color:var(--blue); background:var(--blue); }

        .meal-plan { display:flex; flex-direction:column; gap:9px; }
        .meal {
            display:flex; align-items:center; gap:9px; padding:11px;
            border:1px solid var(--line); border-left:3px solid var(--blue);
            border-radius:16px; background:var(--card); transition:var(--transition);
        }
        .meal:hover { border-color:var(--blue); box-shadow:0 0 16px #19d8da29; transform:translateY(-2px); }
        .meal.optional { border-left-color:var(--orange); }
        .meal-icon {
            width:38px; height:38px; display:grid; place-items:center; flex-shrink:0;
            color:#07100d; border-radius:12px; background:var(--blue);
        }
        .meal.optional .meal-icon { background:var(--orange); }
        .meal-info { min-width:0; flex:1; }
        .meal-info strong, .meal-info small { display:block; }
        .meal-info strong { font-size:12px; }
        .meal-info small { overflow:hidden; margin-top:4px; color:var(--muted); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
        .meal-time { color:var(--blue); font-size:9px; font-weight:800; }
        .change, .choose { padding:7px 9px; color:#07100d; border:0; border-radius:9px; background:var(--blue); font-size:9px; font-weight:800; }
        .warning {
            display:flex; gap:9px; margin-top:12px; padding:12px;
            color:#ffdc91; border:1px solid #ffc85740; border-radius:13px; background:#ffc85714;
            font-size:9px; line-height:1.45;
        }
        .warning i { color:var(--orange); }

        .ai-suggestions { display:grid; gap:8px; margin-top:12px; }
        .ai-suggestion {
            display:flex; align-items:center; gap:9px; padding:9px;
            border:1px solid #19d8da40; border-radius:14px;
            background:linear-gradient(135deg, #19d8da12, var(--card));
        }
        .ai-suggestion img { width:48px; height:48px; flex-shrink:0; object-fit:cover; border-radius:10px; }
        .ai-suggestion-info { min-width:0; flex:1; }
        .ai-suggestion-info strong, .ai-suggestion-info small { display:block; }
        .ai-suggestion-info strong { font-size:11px; }
        .ai-suggestion-info small { overflow:hidden; margin-top:3px; color:var(--muted); font-size:9px; text-overflow:ellipsis; white-space:nowrap; }

        /* ── WATER TRACKER ── */
        .water-tracker {
            display:flex; align-items:center; gap:12px; padding:12px 16px;
            background:var(--card-2); border-radius:14px; border:1px solid var(--line);
            margin-top:8px;
        }
        .water-tracker .water-icon { font-size:24px; color:var(--blue); animation:waterDrop 2s ease-in-out infinite; }
        @keyframes waterDrop { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
        .water-tracker .water-info { flex:1; }
        .water-tracker .water-info strong { display:block; font-size:14px; }
        .water-tracker .water-info small { color:var(--muted); font-size:9px; }
        .water-tracker .water-progress { width:60px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
        .water-tracker .water-progress div { height:100%; border-radius:3px; background:var(--blue); transition:width .5s ease; }
        .water-btn { padding:4px 10px; border:1px solid var(--blue); border-radius:20px; background:transparent; color:var(--blue); font-size:9px; font-weight:700; transition:var(--transition); }
        .water-btn:hover { background:var(--blue); color:#07100d; }

        /* ── BODY / SILHOUETTE ── */
        .body-visual {
            min-height:320px; position:relative; display:flex; align-items:center; justify-content:center;
            overflow:hidden; border-radius:21px;
            background:radial-gradient(circle, #19d8da22, transparent 45%), var(--card);
            padding:20px 0;
        }
        .body-visual .silhouette-container { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
        .body-visual .silhouette-container svg { width:200px; height:280px; filter:drop-shadow(0 0 25px #19d8da44); }
        .body-wave {
            width:88%; height:61px; position:absolute; left:6%;
            border:2px solid var(--blue); border-radius:50%;
            transform:rotate(-12deg);
            animation:waveMove 2.5s ease-in-out infinite alternate;
            pointer-events:none;
        }
        .body-wave:nth-child(1) { top:75px; }
        .body-wave:nth-child(2) { top:121px; opacity:.6; animation-delay:.4s; }
        .body-wave:nth-child(3) { top:167px; opacity:.3; animation-delay:.8s; }
        @keyframes waveMove { to { transform:rotate(-12deg) scaleX(1.1) translateX(8px); } }
        .weight-layer {
            position:absolute; z-index:2; right:9px; padding:7px 9px; color:#fff; border-radius:9px; background:#087f83dd; font-size:9px;
        }
        .weight-layer.current { top:15px; }
        .weight-layer.goal { bottom:15px; background:#285d32ee; }
        .body-row, .history-row {
            display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0;
            border-bottom:1px solid var(--line); font-size:11px;
        }
        .body-row:last-child, .history-row:last-child { border-bottom:0; }
        .body-row span, .history-row span { color:var(--muted); }
        .history-list { max-height:180px; overflow-y:auto; }
        .history-row b { color:var(--blue); }
        .status {
            padding:4px 7px; border-radius:7px; font-size:8px; font-weight:800;
        }
        .status.good { color:#07100d; background:var(--green); }
        .status.low { color:#07100d; background:var(--blue); }
        .status.high { color:#07100d; background:var(--orange); }
        .segments { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
        .segment {
            padding:9px 2px; text-align:center; border-radius:11px; background:var(--card-2);
        }
        .segment i { color:var(--blue); font-size:13px; }
        .segment b, .segment small { display:block; }
        .segment b { margin-top:5px; font:18px var(--font-display); }
        .segment small { color:var(--muted); font-size:8px; }

        /* ── WORKOUT ── */
        .workout-card {
            position:relative; margin-bottom:10px; padding:15px;
            border:1px solid var(--line); border-left:3px solid var(--green);
            border-radius:17px; background:var(--card); transition:var(--transition);
        }
        .workout-card.open { border-color:var(--blue); box-shadow:0 0 19px #19d8da26; }
        .workout-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .workout-title strong { font-size:14px; }
        .workout-title small { color:var(--blue); font-size:10px; font-weight:800; }
        .workout-meta { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
        .workout-meta span { padding:5px 7px; color:var(--muted); border-radius:7px; background:var(--card-2); font-size:9px; }
        .exercise-list { display:none; margin-top:12px; border-top:1px solid var(--line); }
        .workout-card.open .exercise-list { display:block; }
        .exercise {
            display:flex; align-items:center; justify-content:space-between; padding:9px 0;
            border-bottom:1px solid var(--line); font-size:10px;
        }
        .exercise:last-child { border-bottom:0; }
        .exercise span { color:var(--muted); }
        .interval {
            display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px;
        }
        .interval div { padding:8px 3px; text-align:center; border-radius:10px; background:var(--card-2); }
        .interval b { display:block; color:var(--blue); font:21px var(--font-display); }
        .interval small { color:var(--muted); font-size:8px; }

        /* ── VIDEO ── */
        .video-card {
            height:165px; position:relative; overflow:hidden; margin-bottom:10px; padding:14px;
            display:flex; align-items:flex-end; border-radius:var(--radius);
            background-position:center; background-size:cover;
            cursor:pointer; transition:var(--transition);
        }
        .video-card:hover { transform:scale(1.01); }
        .video-card::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 20%, #000e); }
        .video-card .video-text { position:relative; z-index:1; }
        .video-card .video-text strong { display:block; font-size:16px; }
        .video-card .video-text small { color:#bbb; font-size:9px; }
        .video-text strong,
        .video-text small {
            color: #fff !important;
        }
        .play {
            width:44px; height:44px; position:absolute; z-index:2; top:50%; left:50%;
            display:grid; place-items:center; color:#07100d; border-radius:50%;
            background:var(--green); box-shadow:0 0 22px #6fae20b3;
            transform:translate(-50%, -50%);
        }
        .equipment { min-height:104px; padding:13px; }
        .equipment i { color:var(--orange); font-size:19px; }
        .equipment strong { display:block; margin-top:8px; font-size:12px; }
        .equipment small { color:var(--muted); font-size:9px; }

        /* ── MAP ── */
        .place-map {
            min-height:200px; position:relative; overflow:hidden; border-radius:var(--radius); background:var(--card); cursor:pointer;
        }
        .place-map iframe {
            width:100%; height:100%; min-height:200px; border:0; border-radius:var(--radius);
        }
        .fp-map-pins {
            position:absolute; inset:0; z-index:3; pointer-events:none;
        }
        .fp-map-pin {
            position:absolute; display:grid; place-items:center; width:34px; height:34px;
            color:var(--pin-color); border:2px solid var(--pin-color); border-radius:50% 50% 50% 0;
            background:#07130ddd; transform:translate(-50%,-50%) rotate(-45deg);
            box-shadow:0 0 16px var(--pin-color); pointer-events:auto; cursor:pointer; transition:var(--transition);
        }
        .fp-map-pin:hover { transform:translate(-50%,-50%) rotate(-45deg) scale(1.12); }
        .fp-map-pin i, .fp-map-pin span { transform:rotate(45deg); }
        .fp-map-pin span {
            position:absolute; top:32px; left:50%; padding:3px 6px; color:#fff; border-radius:5px; background:#000c;
            font:8px var(--font); white-space:nowrap; transform:translateX(-50%) rotate(0deg);
        }
        .fp-place-editor {
            display:grid; gap:7px; margin-top:9px; padding:11px;
            border:1px solid var(--line); border-radius:14px; background:var(--card);
        }
        .place-buttons {
            display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:9px;
        }
        .place-button {
            padding:9px 4px; color:var(--muted); border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:9px; transition:var(--transition);
        }
        .place-button.active { color:#07100d; background:var(--blue); }

        /* ── AI ── */
        .ai-head { display:flex; align-items:center; gap:11px; }
        .ai-avatar {
            width:48px; height:48px; display:grid; place-items:center;
            color:#07100d; border-radius:15px;
            background:linear-gradient(135deg, var(--green), var(--blue));
            box-shadow:0 0 20px #19d8da59; overflow:hidden;
        }
        .ai-avatar img { width:100%; height:100%; object-fit:cover; }
        .messages { margin-top:16px; }
        .message {
            max-width:89%; margin-bottom:9px; padding:12px 14px; border-radius:16px; font-size:11px; line-height:1.5;
        }
        .message.ai { border:1px solid var(--line); background:var(--card); }
        .message.user { margin-left:auto; color:#07100d; background:var(--green); }
        .quick-questions { display:flex; gap:7px; margin-top:13px; overflow-x:auto; }
        .quick-questions button {
            padding:8px 10px; color:var(--blue); white-space:nowrap;
            border:1px solid #19d8da4d; border-radius:10px; background:#19d8da14; font-size:9px; transition:var(--transition);
        }
        .quick-questions button:hover { background:#19d8da28; }
        .chat {
            display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;
        }
        .chat input { flex:1; margin:0; min-width:120px; }
        .chat button { width:47px; color:#07100d; border:0; border-radius:12px; background:var(--green); display:grid; place-items:center; }

        /* ── PROFILE ── */
        .profile-card {
            background:var(--card); border-radius:var(--radius); border:1px solid var(--line); padding:18px;
        }
        .profile-header {
            display:flex; align-items:center; gap:14px;
        }
        .profile-photo-large {
            width:80px; height:80px; border-radius:50%; overflow:hidden; border:3px solid var(--blue); flex-shrink:0;
            background:var(--green); display:grid; place-items:center; font-size:34px; font-weight:800; color:#07100d;
        }
        .profile-photo-large img { width:100%; height:100%; object-fit:cover; }
        .profile-info { flex:1; }
        .profile-info h2 { font-size:24px; }
        .profile-info .status-text { color:var(--muted); font-size:10px; }
        .profile-info .upload-btn { color:var(--blue); font-size:9px; cursor:pointer; display:inline-block; margin-top:4px; }
        .profile-info .upload-btn input { display:none; }
        .profile-stats {
            display:flex; gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
        }
        .profile-stats div { text-align:center; cursor:pointer; transition:var(--transition); }
        .profile-stats div:hover { opacity:.7; }
        .profile-stats div b { display:block; font-size:16px; font-family:var(--font-display); }
        .profile-stats div small { color:var(--muted); font-size:8px; }
        .profile-actions {
            display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
        }
        .profile-actions button { flex:1; min-width:70px; }

        /* ── FRIENDS & ONLINE ── */
        .friends-grid {
            display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:8px;
        }
        .friend-card {
            background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 6px;
            text-align:center; transition:var(--transition); cursor:pointer;
        }
        .friend-card:hover { border-color:var(--blue); transform:translateY(-2px); }
        .friend-card .avatar {
            width:48px; height:48px; border-radius:50%; margin:0 auto 4px;
            background:var(--card-2); display:grid; place-items:center; font-weight:800; font-size:18px; color:var(--blue);
            border:2px solid var(--line); overflow:hidden;
        }
        .friend-card .avatar img { width:100%; height:100%; object-fit:cover; }
        .friend-card .name { font-size:10px; font-weight:700; display:block; }
        .friend-card .status-text { font-size:8px; color:var(--muted); }
        .friend-card .status-dot {
            display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px;
        }
        .friend-card .status-dot.online-gym { background:var(--green); }
        .friend-card .status-dot.online-pool { background:var(--blue); }
        .friend-card .status-dot.dnd { background:var(--red); }
        .friend-card .status-dot.offline { background:var(--muted); }

        .fp-online-grid {
            display:grid !important;
            grid-template-columns:repeat(3,1fr) !important;
            gap:10px !important;
        }
        .fp-online-card {
            min-height:108px; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:10px 4px; text-align:center; border:2px solid var(--line); border-radius:16px;
            background:var(--card); cursor:pointer; transition:var(--transition);
        }
        .fp-online-card:hover { transform:translateY(-2px); }
        .fp-online-card img { width:48px; height:48px; object-fit:cover; border-radius:50%; margin-bottom:4px; }
        .fp-online-card small { margin-top:4px; color:var(--muted); font-size:8px; }
        .fp-online-card.online-gym { border-color:var(--green); border-width:2px; }
        .fp-online-card.online-pool { border-color:var(--blue); border-width:2px; }
        .fp-online-card.dnd { border-color:var(--red); border-width:2px; }

        /* ── LEVEL & ACHIEVEMENTS ── */
        .fp-level-card {
            padding:15px; border:1px solid var(--gold); border-radius:18px;
            background:linear-gradient(135deg, #f5c84222, var(--card)); box-shadow:0 0 20px #f5c84233;
        }
        .fp-level-title { display:flex; align-items:center; justify-content:space-between; }
        .fp-level-title strong { color:var(--gold); font:22px var(--font-display); }
        .fp-xp { height:9px; margin-top:12px; overflow:hidden; border-radius:10px; background:var(--card-2); }
        .fp-xp i { display:block; width:72%; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--gold), var(--orange)); }
        .fp-achievement {
            padding:12px; border:1px solid var(--line); border-radius:15px; background:var(--card);
            transition:var(--transition); cursor:pointer;
        }
        .fp-achievement:hover { border-color:var(--gold); }
        .fp-achievement.done { border-color:var(--gold); box-shadow:0 0 14px #f5c84233; }
        .fp-achievement i { color:var(--gold); font-size:21px; }
        .fp-achievement strong, .fp-achievement small { display:block; margin-top:6px; }
        .fp-achievement small { color:var(--muted); font-size:9px; line-height:1.4; }
        .fp-trophy-grid {
            display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;
        }
        .fp-trophy {
            text-align:center; padding:10px 4px; border-radius:14px;
            background:var(--card-2); border:1px solid var(--line); transition:var(--transition);
        }
        .fp-trophy i { font-size:28px; color:var(--gold); }
        .fp-trophy strong { display:block; margin-top:4px; font-size:12px; }
        .fp-trophy small { color:var(--muted); font-size:7px; }

        /* ── STORY CAROUSEL ── */
        .fp-story-carousel { position:relative; margin-top:8px; }
        .fp-story-strip {
            display:flex; gap:9px; overflow:hidden; scroll-behavior:smooth;
        }
        .fp-story-card {
            width:108px; height:132px; flex:0 0 auto; position:relative;
            display:flex; flex-direction:column; justify-content:flex-end;
            overflow:hidden; padding:11px; color:#fff; border-radius:17px;
            background-position:center; background-size:cover; cursor:pointer;
        }
        .fp-story-card::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 20%, #000e); }
        .fp-story-card > * { position:relative; z-index:1; }
        .fp-story-arrow {
            position:absolute; z-index:3; top:50%; width:31px; height:31px;
            display:grid; place-items:center; color:#fff; border:1px solid #fff9; border-radius:50%;
            background:#000b; transform:translateY(-50%);
        }
        .fp-story-arrow.left { left:3px; }
        .fp-story-arrow.right { right:3px; }

        /* ── STORY VIEWER ── */
        .fp-story-viewer {
            position:fixed; inset:0; z-index:100;
            display:flex; align-items:center; justify-content:center;
            background:#000e; backdrop-filter:blur(12px);
        }

    // ── UX / connectivity layer ──
    function notify(message, duration=2600){
        const old=document.querySelector(".fp-toast"); if(old) old.remove();
        const el=document.createElement("div"); el.className="fp-toast"; el.textContent=String(message); document.body.appendChild(el);
        requestAnimationFrame(()=>el.classList.add("show"));
        setTimeout(()=>{el.classList.remove("show");setTimeout(()=>el.remove(),220);},duration);
    }
    window.addEventListener("online", updateConnectivityUI);
    window.addEventListener("offline", updateConnectivityUI);
    function updateConnectivityUI(){
        let badge=document.querySelector(".fp-offline-badge");
        if(!navigator.onLine){ if(!badge){badge=document.createElement("div");badge.className="fp-offline-badge";document.body.appendChild(badge);} badge.textContent=tr("Нет соединения · демо-режим","Offline · demo mode"); }
        else if(badge) badge.remove();
    }
    const BACKEND_CONFIG={ baseUrl: localStorage.getItem("fitpulse-api-base") || "", production: localStorage.getItem("fitpulse-production")==="1" };
    async function backendRequest(path, options={}){
        if(!BACKEND_CONFIG.baseUrl){ notify(tr("Backend/API не настроен: используется демо-режим","Backend/API is not configured: demo mode is active")); return null; }
        const res=await fetch(BACKEND_CONFIG.baseUrl.replace(/\/$/,"")+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
        if(!res.ok) throw new Error(`Backend ${res.status}`);
        return res.status===204?null:res.json();
    }

    function translateDomToEnglish(root=document) {
        if(state.language !== 'en') return;
        const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(n=>{ let t=n.nodeValue; Object.keys(EN_TEXT).sort((a,b)=>b.length-a.length).forEach(k=>{ if(t.includes(k)) t=t.split(k).join(EN_TEXT[k]); }); n.nodeValue=t; });
        root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>['placeholder','title','aria-label'].forEach(a=>{ let v=el.getAttribute(a); if(v) Object.keys(EN_TEXT).forEach(k=>{v=v.split(k).join(EN_TEXT[k]);}); el.setAttribute(a,v); }));
    }

    function getMonthName(index) {
        return state.language === "ru" ? MONTHS_RU[index] : MONTHS_EN[index];
    }

    function getDateKey(year, monthIndex, day) {
        return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function getEventsForDate(year, monthIndex, day) {
        const key = getDateKey(year, monthIndex, day);
        return state.calendarEvents[key] || [];
    }

    function getEventsForMonth(year, monthIndex) {
        const result = {};
        for (let day = 1; day <= 31; day++) {
            const key = getDateKey(year, monthIndex, day);
            if (state.calendarEvents[key]) {
                result[day] = state.calendarEvents[key];
            }
        }
        return result;
    }

    function addEventToDate(year, monthIndex, day, eventData) {
        const key = getDateKey(year, monthIndex, day);
        if (!state.calendarEvents[key]) state.calendarEvents[key] = [];
        state.calendarEvents[key].push(eventData);
        save();
    }

    function isDateAllowed(year, monthIndex) {
        if (year < MIN_YEAR) return false;
        if (year === MIN_YEAR && monthIndex < MIN_MONTH) return false;
        return true;
    }

    // ── RENDER ──
    function render() {
        const prevScreen = state.__renderedScreen;
        const preservePageScroll = prevScreen === state.screen;
        const oldPage = document.querySelector('#app .page');
        const oldScrollTop = oldPage ? oldPage.scrollTop : 0;
        state.__renderedScreen = state.screen;
        document.documentElement.dataset.theme = state.theme;
        document.documentElement.dataset.highcontrast = state.highContrast ? "on" : "off";
        document.documentElement.lang = state.language === "en" ? "en" : "ru";

        if (state.screen === "splash") {
            app.innerHTML = splashPage();
            setTimeout(() => { state.screen = "login"; render(); }, 5200);
            return;
        }
        if (state.screen === "login") { app.innerHTML = loginPage(); return; }
        if (state.screen === "register") { app.innerHTML = registerPage(); return; }
        if (state.screen === "survey") { app.innerHTML = surveyPage(); return; }
        if (state.screen === "verify") { app.innerHTML = verifyPage(); return; }
        if (state.screen === "reset") { app.innerHTML = resetPage(); return; }
        if (state.screen === "privacy") { app.innerHTML = privacyPage(); return; }
        if (state.screen === "terms") { app.innerHTML = termsPage(); return; }
        if (state.screen === "consent") { app.innerHTML = consentPage(); return; }

        const pages = {
            home: homePage,
            nutrition: nutritionPage,
            calendar: calendarPage,
            training: trainingPage,
            body: bodyPage,
            videos: videosPage,
            ai: aiPage,
            profile: profilePage,
            chat: chatPage,
            chatDetail: chatDetailPage,
        };

        const showTopControls = state.screen === "home";
        app.innerHTML = `
            ${showTopControls ? `<button class="notification" aria-label="${tr("Уведомления","Notifications")}" onclick="showNotification()"><i class="fas fa-bell"></i></button>` : ""}
            <main class="page">
                ${pages[state.screen] ? pages[state.screen]() : homePage()}

            ${state.selectedMeal ? mealModal() : ""}
            ${state.selectedMetric ? metricModal() : ""}
            ${state.showDateModal ? dateModal() : ""}
            ${state.selectedAchievement ? achievementModal() : ""}
            ${state.selectedStory ? storyModal() : ""}
        `;
        setTimeout(() => {
            translateDomToEnglish(app);
            enhanceApp();
            if (state.screen === "calendar") openCalendarPage(false);
            if (state.selectedStory) bindStoryGestures();
            if (preservePageScroll) { const nextPage=document.querySelector('#app .page'); if(nextPage) nextPage.scrollTop=oldScrollTop; }
        }, 0);
    }

    // ── CALENDAR ──
    function calendarMini() {
        const days = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
        const monthEvents = getEventsForMonth(state.calendarYear, state.calendarMonthIndex);
        const firstDayOfMonth = new Date(state.calendarYear, state.calendarMonthIndex, 1).getDay();
        const daysInMonth = new Date(state.calendarYear, state.calendarMonthIndex + 1, 0).getDate();
        const today = new Date().getDate();
        const todayMonth = new Date().getMonth();
        const todayYear = new Date().getFullYear();
        let gridHtml = '';
        let startOffset = (firstDayOfMonth === 0) ? 6 : firstDayOfMonth - 1;
        for (let i = 0; i < startOffset; i++) {
            gridHtml += `<span class="muted" style="padding:6px 0;text-align:center;font-size:9px"></span>`;
        }
        for (let day = 1; day <= daysInMonth; day++) {
            const hasEvent = monthEvents[day] && monthEvents[day].length > 0;
            const isToday = (day === today && state.calendarMonthIndex === todayMonth && state.calendarYear === todayYear);
            const selected = (day === state.selectedCalendarDay);
            gridHtml += `
                <span class="${selected ? "selected" : ""} ${hasEvent ? "has-event" : ""} ${isToday ? "active" : ""}"
                    onclick="selectCalendarDay(${day})"
                    style="padding:6px 0;text-align:center;border-radius:8px;font-size:9px;cursor:pointer;transition:var(--transition);
                    ${isToday && !selected ? "background:var(--card-2);color:var(--text);" : ""}">
                    ${day}
                </span>
            `;
        }
        return `
        <section class="card">
            <div class="between">
                <span class="eyebrow">${getMonthName(state.calendarMonthIndex)} ${state.calendarYear}</span>
                <div style="display:flex;gap:6px;">
                    <button class="secondary" style="padding:4px 8px;font-size:8px;" onclick="changeCalendar(-1)"><i class="fas fa-chevron-left"></i></button>
                    <button class="secondary" style="padding:4px 8px;font-size:8px;" onclick="changeCalendar(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="week" style="margin-top:10px">
                ${days.map(day => `<div class="day" style="font-size:8px;padding:4px 0;">${day}</div>`).join("")}
            </div>
            <div class="month" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;">
                ${gridHtml}
            </div>
        </section>
        `;
    }

    function _legacy_1_changeCalendar(direction) {
        let month = state.calendarMonthIndex + direction;
        let year = state.calendarYear;
        if (month < 0) { month = 11; year--; }
        if (month > 11) { month = 0; year++; }
        if (!isDateAllowed(year, month)) {
            notify(tr("Нельзя выбрать дату раньше августа 2025 года","Cannot select date before August 2025"));
            return;
        }
        state.calendarMonthIndex = month;
        state.calendarYear = year;
        save();
        render();
    }

    function _legacy_1_selectCalendarDay(day) {
        state.selectedCalendarDay = day;
        state.showDateModal = true;
        render();
    }

    // ── CALENDAR PAGE ──
    function _legacy_1_openCalendarPage(resetToToday = true) {
        if (resetToToday) { const now = new Date(); state.calendarMonthIndex = now.getMonth(); state.calendarYear = now.getFullYear(); save(); }
        const old = document.getElementById("fp-calendar-page");
        if (old) old.remove();

        const page = document.createElement("section");
        page.id = "fp-calendar-page";
        page.className = "fp-calendar-page";

        const monthName = getMonthName(state.calendarMonthIndex);
        const year = state.calendarYear;
        const today = new Date().getDate();
        const todayMonth = new Date().getMonth();
        const todayYear = new Date().getFullYear();
        const monthEvents = getEventsForMonth(year, state.calendarMonthIndex);

        let datesHtml = '';
        const firstDayOfMonth = new Date(year, state.calendarMonthIndex, 1).getDay();
        const daysInMonth = new Date(year, state.calendarMonthIndex + 1, 0).getDate();
        let startOffset = (firstDayOfMonth === 0) ? 6 : firstDayOfMonth - 1;
        for (let i = 0; i < startOffset; i++) {
            datesHtml += `<div class="fp-calendar-date" style="background:transparent;border-color:transparent;"></div>`;
        }
        for (let day = 1; day <= daysInMonth; day++) {
            const dayEvents = monthEvents[day] || [];
            const isToday = (day === today && state.calendarMonthIndex === todayMonth && year === todayYear);
            datesHtml += `
                <button class="fp-calendar-date ${dayEvents.length ? "active" : ""} ${isToday ? "selected" : ""}"
                    onclick="selectCalendarDay(${day})" type="button">
                    ${day}
                    <span class="fp-dots">
                        ${dayEvents.slice(0, 4).map(ev =>
                            `<i class="fp-dot" style="background:${ev.color || "#19d8da"}"></i>`
                        ).join("")}
                    </span>
                </button>
            `;
        }

        const allEvents = [];
        Object.keys(state.calendarEvents).forEach(key => {
            const parts = key.split('-');
            const y = parseInt(parts[0]);
            const m = parseInt(parts[1]) - 1;
            const d = parseInt(parts[2]);
            state.calendarEvents[key].forEach(ev => {
                allEvents.push({ ...ev, day: d, month: m, year: y });
            });
        });
        allEvents.sort((a, b) => {
            if (a.year !== b.year) return a.year - b.year;
            if (a.month !== b.month) return a.month - b.month;
            return a.day - b.day;
        });

        page.innerHTML = `
        <div class="fp-calendar-head">
            <div>
                <div class="eyebrow">FITPULSE PLANNER</div>
                <h2>${tr("Календарь","Calendar")}</h2>

                    <button class="secondary" style="padding:4px 8px;font-size:8px;" onclick="changeCalendarPage(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <span class="muted">${tr("до 1 года","up to 1 year")}</span>
        </div>
        <div class="fp-calendar-toolbar">
            <button class="secondary" id="fp-add-calendar-event">
                <i class="fas fa-plus"></i> ${tr("Запись","Entry")}
            </button>
            <button class="primary" id="fp-ai-calendar-event">
                <i class="fas fa-robot"></i> AI
            </button>
        </div>
        <div class="card">
            <div class="week" style="margin-bottom:6px;">
                ${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d => `<span style="font-size:8px;text-align:center;color:var(--muted);">${d}</span>`).join("")}
            </div>
            <div class="fp-calendar-dates">
                ${datesHtml}
            </div>
        </div>
        <div class="section">
            <h3>${tr("Записи и события","Entries and events")}</h3>
            <span class="muted fs-10">${allEvents.length} ${tr("записей","entries")}</span>
        </div>
        <div id="fp-calendar-events">
            ${allEvents.length ? allEvents.slice(0, 20).map(event => `
                <article class="fp-event" style="--event-color:${event.color || "#19d8da"}">
                    <i class="fp-event-color"></i>
                    <div class="fp-event-content">
                        <strong>${event.title}</strong>
                        <small>${event.day} ${getMonthName(event.month)} ${event.year} · ${event.time || ""} · ${event.type || tr("заметка","note")}</small>
                    </div>
                </article>
            `).join("") : `
                <p class="muted">${tr("Записей пока нет.","No entries yet.")}</p>
            `}
        </div>

            <h3>${tr("Правила тренировок и гигиены","Training and hygiene rules")}</h3>
            <ul>
                <li>${tr("В зале: сделайте разминку 5--10 минут, настройте тренажёр, начните с небольшого веса и соблюдайте технику.","Gym: warm up for 5--10 minutes, adjust equipment, start with a light weight and use proper technique.")}</li>
                <li>${tr("В бассейне: примите душ, используйте шапочку и очки, соблюдайте направление дорожки и дистанцию.","Pool: shower before entering, use a cap and goggles, follow lane direction and keep distance.")}</li>

            </ul>
        </section>
        `;

        document.body.appendChild(page);
        document.getElementById("fp-close-calendar").onclick = () => page.remove();
        document.getElementById("fp-add-calendar-event").onclick = () => {
            const day = prompt(tr("День месяца","Day of month"), String(new Date().getDate()));

    function changeCalendarPage(direction) {
        let month = state.calendarMonthIndex + direction;
        let year = state.calendarYear;
        if (month < 0) { month = 11; year--; }
        if (month > 11) { month = 0; year++; }
        if (!isDateAllowed(year, month)) {
            notify(tr("Нельзя выбрать дату раньше августа 2025 года","Cannot select date before August 2025"));
            return;
        }
        state.calendarMonthIndex = month;
        state.calendarYear = year;
        save();
        const old = document.getElementById("fp-calendar-page");
        if (old) old.remove();
        openCalendarPage(false);
    }

    function formatRelativeDate(offsetDays) {

        return `${offsetDays === 0 ? tr("Сегодня","Today") : offsetDays === 1 ? tr("Завтра","Tomorrow") : weekday} · ${d.getDate()} ${getMonthName(d.getMonth())}`;

    function _legacy_1_startWorkout(title) {
        const data = state.trainingData.day;
        const index = data.workouts.findIndex(w => w === title);
        if (index >= 0 && index >= data.completed) {
            data.completed = Math.min(data.goal, data.completed + 1);
            data.minutes += 42; data.calories += 420; state.points += 40;
            if (state.points >= state.level * 1000) { state.points -= state.level * 1000; state.level++; }
            save();
            render();
        }
        notify(`${title}: ${tr("тренировка отмечена как выполненная","workout marked as completed")} · ${tr("место","place")}: «${state.selectedPlace}»`);
    }

        save();
        document.getElementById("customExerciseName").value = "";
        document.getElementById("customExerciseSets").value = "";

    function answerAI(text) {
        const query = text.toLowerCase();
        let answer = "";
        const ru = state.language === "ru";

        if (query.includes("меню") || query.includes("пит") || query.includes("meal")) {
            answer = ru ? `Учитываю ${surveyContext()}. На сегодня предлагаю: завтрак --- омлет со шпинатом, обед --- индейка с киноа, ужин --- треска с овощами. Это даст около 1 680 ккал и хороший уровень белка. В разделе «Питание» можно выбрать другой вариант.` :
                "For today: breakfast --- spinach omelet, lunch --- turkey with quinoa, dinner --- cod with vegetables. About 1,680 kcal with good protein. Check 'Nutrition' for alternatives.";
        } else if (query.includes("завтрак") || query.includes("breakfast")) {
            answer = ru ? `С учётом ${surveyContext()} для завтрака предлагаю омлет со шпинатом, творог с бананом или тост с авокадо. Если нужна сытость надолго, выбери омлет.` :
                "For breakfast: spinach omelet, cottage cheese with banana, or avocado toast. Choose omelet for lasting fullness.";
        } else if (query.includes("обед") || query.includes("lunch")) {
            answer = ru ? "Для обеда подойдут индейка с киноа, паста с тунцом или тофу с овощами. Для формы лучше индейка с киноа." :
                "For lunch: turkey with quinoa, pasta with tuna, or tofu with vegetables. Turkey with quinoa is best for fitness.";
        } else if (query.includes("ужин") || query.includes("dinner")) {
            answer = ru ? "Для лёгкого ужина рекомендую треску с овощами: 390 ккал и 38 г белка. Альтернативы --- куриный боул или овощной суп." :
                "For a light dinner: cod with vegetables --- 390 kcal, 38g protein. Alternatives: chicken bowl or vegetable soup.";
        } else if (query.includes("трен") || query.includes("спорт") || query.includes("workout")) {
            answer = ru ? "Сегодня готовность 87%. Лучший вариант --- 42 минуты силовой тренировки средней интенсивности. Если энергии мало, выбери мобильность на 20 минут." :
                "Today readiness is 87%. Best: 42 min strength training, moderate intensity. Low energy? Choose 20 min mobility.";
        } else if (query.includes("календар") || query.includes("событ") || query.includes("event")) {
            answer = ru ? "Я могу добавить тренировку, питание, восстановление или встречу. Рекомендую поставить силовую в 18:30, белковый ужин в 19:30 и восстановление в 21:30." :
                "I can add training, meal, recovery, or meeting. Recommend: strength at 18:30, protein dinner at 19:30, recovery at 21:30.";
        } else if (query.includes("врем") || query.includes("мало") || query.includes("time")) {
            answer = ru ? "Если времени мало, сделай 3 круга: приседания, отжимания, выпады, планка и 5 минут растяжки. Общая длительность --- около 20 минут." :
                "Short on time? Do 3 rounds: squats, push-ups, lunges, plank, 5 min stretching. Total ~20 min.";
        } else if (query.includes("сон") || query.includes("sleep")) {
            answer = ru ? "Сон 7.2 часа и стресс 32 выглядят нормально. Сегодня помогут прогулка, отсутствие кофе после 15:00 и одинаковое время отхода ко сну." :
                "Sleep 7.2h and stress 32 are normal. Today: walk, no coffee after 3pm, consistent bedtime.";
        } else if (query.includes("вес") || query.includes("жир") || query.includes("мышц") || query.includes("композ") ||
            query.includes("weight") || query.includes("fat") || query.includes("muscle")) {
            answer = ru ? "Текущий вес 74.2 кг, мышцы 34.8 кг, жир 18.4%. Целевой диапазон --- 72--76 кг. Сохраняй силовые 3 раза в неделю и белок 120--145 г в день." :
                "Current weight 74.2 kg, muscle 34.8 kg, fat 18.4%. Target range 72--76 kg. Strength 3x/week, protein 120--145g/day.";
        } else if (query.includes("устройство") || query.includes("device")) {
            const device = prompt(ru ? "Введите название устройства" : "Enter device name");
            if (device && !state.profile.devices.includes(device)) {
                state.profile.devices.push(device);
                save();
                answer = ru ? `Устройство "${device}" добавлено.` : `Device "${device}" added.`;
            } else if (device) {
                answer = ru ? `Устройство "${device}" уже есть в списке.` : `Device "${device}" is already in the list.`;
            } else {
                answer = ru ? "Отмена добавления устройства." : "Device addition cancelled.";
            }
        } else {
            answer = ru ? "Я понял запрос. Уточни, что именно нужно: меню, завтрак, обед, ужин, тренировка, календарь, вес, сон, стресс или устройства." :
                "I understand. Please specify: menu, breakfast, lunch, dinner, training, calendar, weight, sleep, stress, or devices.";
        }

        state.messages.push({ type: "user", text });
        state.messages.push({ type: "ai", text: answer });

        if (query.includes("календар") || query.includes("событ") || query.includes("event")) {
            const day = new Date().getDate();
            const monthIndex = new Date().getMonth();
            const year = new Date().getFullYear();
            addEventToDate(year, monthIndex, day, {
                title: ru ? "AI: событие добавлено" : "AI: event added",
                type: "ai",
                date: `${day} ${getMonthName(monthIndex)}`,
                time: "19:00",
                color: "#19d8da"
            });
        }
        render();
    }

        const friend = state.friends.find(f => f.name === name);

        }

    function _legacy_1_searchFriends() {
        const q = prompt(tr("Имя или ID пользователя","User name or ID"), "");
        if (!q) return;
        const matches = state.friends.filter(f => f.name.toLowerCase().includes(q.toLowerCase()) || String(f.id || "").includes(q));
        if (!matches.length) return notify(tr("Ничего не найдено","Nothing found"));
        const names = matches.map(f => `${f.name}${f.added ? " · ✓" : ""}`).join("\n");
        const picked = prompt(tr("Найдено:\n","Found:\n") + names + "\n\n" + tr("Введите имя для добавления","Enter a name to add"), matches[0].name);
        const friend = matches.find(f => f.name === picked);
        if (friend) { friend.added = true; state.profile.friends = state.friends.filter(f=>f.added).length; save(); render(); }
    }

    function sendChat() {
        if(state.guest){ notify(tr('В гостевом режиме личный чат недоступен.','Private chat is unavailable in guest mode.')); return; }
        if(!state.chatConsent){ chatSettings(); return; }
        const input=document.getElementById('chatInput'); if(!input)return; const text=input.value.trim(); if(!text)return;
        state.chatMessages.push({from:'Я',text,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),sent:true}); input.value=''; save(); render();
        setTimeout(()=>{ state.chatMessages.push({from:state.selectedChat||'Анна',text:tr('Отлично! Продолжай в том же духе 💪','Great! Keep it up 💪'),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),sent:false}); save(); render(); },800);
    }

    function prefersReducedMotion(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    function storyKey(story){ return String(state.stories.indexOf(story)); }
    function restartStoryTimer(){ if(window.storyTimer)clearInterval(window.storyTimer); state.storyPaused=false; if(state.selectedStory && !prefersReducedMotion()) window.storyTimer=setInterval(()=>nextStory(true),6000); }
    function pauseStory(){ if(window.storyTimer)clearInterval(window.storyTimer); state.storyPaused=true; document.getElementById("storyViewer")?.classList.add("hold-paused"); }
    function resumeStory(){ if(!state.selectedStory)return; state.storyPaused=false; document.getElementById("storyViewer")?.classList.remove("hold-paused"); restartStoryTimer(); }
    function storyModal() {
        const s=state.selectedStory; if(!s) return "";
        const idx=state.stories.indexOf(s);
        return `<div class="fp-story-viewer ${state.storyPaused?"hold-paused":""}" id="storyViewer" onclick="if(event.target===this)closeStory()"><div class="fp-story-view" id="storyView" style="background-image:url('${s.image}')" data-story-index="${idx}"><div class="fp-story-progress">${state.stories.map((_,i)=>`<i class="${i<=idx?"active":""}"></i>`).join("")}</div><div class="fp-story-hint">${tr("Смахни влево или вправо · удерживай для паузы","Swipe left or right · hold to pause")}</div><button class="fp-story-close" onclick="closeStory()" aria-label="${tr("Закрыть","Close")}">×</button><button class="fp-story-view-arrow left" onclick="prevStory()" aria-label="${tr("Предыдущая история","Previous story")}"><i class="fas fa-chevron-left"></i></button><button class="fp-story-view-arrow right" onclick="nextStory()" aria-label="${tr("Следующая история","Next story")}"><i class="fas fa-chevron-right"></i></button><div class="fp-story-info"><h2>${s.title}</h2><p>${s.description}</p><p>${s.text}</p></div></div></div>`;
    }
    function openStory(index){ if(!state.stories[index])return; state.selectedStory=state.stories[index]; state.storySeen[index]=true; save(); render(); restartStoryTimer(); setTimeout(bindStoryGestures,0); }
    function closeStory(){ state.selectedStory=null; state.storyPaused=false; if(window.storyTimer)clearInterval(window.storyTimer); render(); }
    function nextStory(){ const i=state.stories.indexOf(state.selectedStory); if(i<state.stories.length-1){state.selectedStory=state.stories[i+1];state.storySeen[i+1]=true;save();render();restartStoryTimer();setTimeout(bindStoryGestures,0);}else closeStory(); }
    function prevStory(){ const i=state.stories.indexOf(state.selectedStory); if(i>0){state.selectedStory=state.stories[i-1];state.storySeen[i-1]=true;save();render();restartStoryTimer();setTimeout(bindStoryGestures,0);} }
    function bindStoryGestures(){ const v=document.getElementById("storyView"); if(!v||v.dataset.gestureBound)return; v.dataset.gestureBound="1"; let sx=0,sy=0;
        const hold=()=>pauseStory(), release=()=>resumeStory();
        v.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
        v.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){dx<0?nextStory():prevStory();return;}if(Math.abs(dx)<12&&Math.abs(dy)<12){const r=v.getBoundingClientRect();if(t.clientX-r.left<r.width*.35)prevStory();else if(t.clientX-r.left>r.width*.65)nextStory();}},{passive:true});
        v.addEventListener("pointerdown",()=>{window.storyHoldTimer=setTimeout(hold,450);});
        ["pointerup","pointercancel","pointerleave"].forEach(ev=>v.addEventListener(ev,()=>{clearTimeout(window.storyHoldTimer);if(state.storyPaused)release();}));
        v.addEventListener("click",e=>{if(e.target.closest("button"))return;const r=v.getBoundingClientRect();if(e.clientX-r.left<r.width*.35)prevStory();else if(e.clientX-r.left>r.width*.65)nextStory();}); }
    function showAllStories(){ openStory(0); }

                if (state.waterIntake === state.waterGoal) {
                    notify("🎉 " + tr("Отлично! Ты выполнил норму воды на сегодня!","Great! You've reached your daily water goal!"));
                    const ach = state.achievements.find(a => a.name === "Водный баланс");
                    if (ach && !ach.done) {
                        ach.done = true;
                        notify("⭐ " + tr("Новое достижение: Водный баланс!","New achievement: Water balance!"));
                    }
                    state.points += 30;
                    if (state.points >= state.level * 1000) {
                        state.level++;
                        state.points = 0;
                        notify(`🎉 ${tr("Новый уровень!","New level!")} ${tr("Уровень","Level")} ${state.level}`);
                    }
                    save();
                }
                save();
                render();
            } else {
                notify(tr("Ты уже выполнил норму воды на сегодня! 💧","You've already reached your daily water goal! 💧"));
            }
        }

    // ── AUTH ACTIONS ──
    function doLogin() {
        const email = document.getElementById("loginEmail")?.value.trim();
        const pass = document.getElementById("loginPassword")?.value.trim();
        if (!email || !pass) {
            notify(tr("Неверный email или пароль","Invalid email or password"));
            return;
        }
        state.profile.email = email;
        state.profile.password = pass;
        state.registered = true;
        state.guest = false;
        save();
        state.screen = "home";
        save();
        render();
    }

    function doRegister() {
        const email = document.getElementById("regEmail")?.value.trim();
        const pass = document.getElementById("regPassword")?.value;
        const confirm = document.getElementById("regConfirm")?.value;
        if (!email || !pass || !confirm) {
            notify(tr("Заполните все поля","Please fill all fields"));
            return;
        }
        if (pass !== confirm) {
            notify(tr("Пароли не совпадают","Passwords do not match"));
            return;
        }
        if (pass.length < 6) {
            notify(tr("Пароль должен содержать минимум 6 символов","Password must be at least 6 characters"));
            return;
        }
        if (!document.getElementById("regConsent")?.checked) { notify(tr("Подтвердите согласие с документами.","Please accept the legal documents.")); return; }
        state.guest = false;
        state.registrationData.email = email;
        state.registrationData.password = pass;
        state.profile.email = email;
        state.screen = "verify";
        render();
    }

    function doVerify() {
        const code = document.getElementById("verifyCode")?.value.trim();
        if (code === "123456") {
            state.registered = true;
            state.guest = false;
            state.survey.step = Number.isInteger(state.survey.step) ? state.survey.step : 0;
            save();
            state.screen = state.surveyCompleted ? "home" : "survey";
            render();
        } else {
            notify(tr("Неверный код","Invalid code"));
        }
    }

    function surveySelect(key, value, isMulti) {
        if (isMulti) {
            const arr = state.survey[key] || [];
            const idx = arr.indexOf(value);
            if (idx > -1) arr.splice(idx, 1);
            else arr.push(value);
            state.survey[key] = arr;
        } else {
            state.survey[key] = value;
        }
        state.surveyDeferred = false;
        save();
    }

    function surveyNext() {
        const steps = ["allergies","restrictions","goals","diet","activity","sleepHours","waterIntake","preferredWorkouts","trainingDays"];
        const key = steps[state.survey.step];
        const val = state.survey[key];
        if (Array.isArray(val) && val.length === 0) {
            notify(tr("Выберите хотя бы один вариант","Select at least one option"));
            return;
        }
        if (typeof val === "string" && !val) {
            notify(tr("Выберите один вариант","Select one option"));
            return;
        }
        if (state.survey.step < steps.length - 1) {
            state.survey.step++;
            save();
            render();
        } else {
            state.surveyCompleted = true;
            save();
            state.screen = "home";
            render();
        }
    }

    function deferSurvey() {
        state.surveyDeferred = true;
        save();
        state.screen = "home";
        render();
    }

    function resumeSurvey() {
        state.screen = "survey";
        state.surveyDeferred = false;
        save();
        render();
    }

    function surveyPrev() {
        if (state.survey.step > 0) {
            state.survey.step--;
            render();
        }
    }

    // Auto-cleanup: remove events older than 1 year
    const now = new Date();
    const oneYearBack = new Date(now);
    oneYearBack.setFullYear(oneYearBack.getFullYear() - 1);
    Object.keys(state.calendarEvents).forEach(key => {
        const parts = key.split('-');
        const y = parseInt(parts[0]);
        const m = parseInt(parts[1]) - 1;
        const d = parseInt(parts[2]);
        const eventDate = new Date(y, m, d);
        if (eventDate < oneYearBack) {
            delete state.calendarEvents[key];
        }
    });
    save();

    const totalDone = state.achievements.filter(a => a.done).length;
    if (totalDone >= 5 && state.level < 6) {
        state.level = 6;

    // ── FINAL CONSOLIDATION PASS ──
    // Single source of truth for interactions that were previously duplicated.
    function getCurrentDateParts() {
        const d = new Date();
        return { day:d.getDate(), monthIndex:d.getMonth(), year:d.getFullYear() };
    }

    function safeText(v) {
        return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function copyMetricValue(value) {
        const text=String(value||'').trim();
        if(!text) return;
        if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>notify(tr('Значение скопировано','Value copied'))).catch(()=>notify(text));
        else notify(text);
    }

        };

        const page=document.createElement('section'); page.id='fp-calendar-page'; page.className='fp-calendar-page';
        const y=state.calendarYear, m=state.calendarMonthIndex;
        const today=getCurrentDateParts();
        const events=getEventsForMonth(y,m);
        const first=(new Date(y,m,1).getDay()+6)%7;
        const daysInMonth=new Date(y,m+1,0).getDate();
        let dates='';
        for(let i=0;i<first;i++) dates+='<div class="fp-calendar-date" aria-hidden="true" style="visibility:hidden"></div>';
        for(let day=1;day<=daysInMonth;day++){

        }
        const monthEvents=Object.entries(state.calendarEvents).flatMap(([key,list])=>list.map((e,i)=>({key,index:i,...e})));
        monthEvents.sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
        const monthList=monthEvents.filter(e=>keyMatchesMonth(e.key,y,m));
        const rules=`<div class="card" style="margin-top:10px"><h3>${tr('Правила и гигиена','Rules & hygiene')}</h3><p class="muted">${tr('Соблюдай технику, начинай с разминки и используй чистый инвентарь.','Use proper form, warm up first and keep equipment clean.')}</p></div>`;

        document.body.appendChild(page);

        while(m<0){m+=12;y--;} while(m>11){m-=12;y++;}
        if(!isDateAllowed(y,m)){ notify(tr('Нельзя выбрать дату раньше августа 2025 года','Cannot select a date before August 2025')); return false; }
        state.calendarMonthIndex=m; state.calendarYear=y; state.selectedCalendarDay=null; save();
        if(document.getElementById('fp-calendar-page')) openCalendarPage(false); else render();
        return true;
    }

    function waterDateKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function ensureDailyWater(){ const key=waterDateKey(); if(state.waterDate!==key){ state.waterDate=key; state.waterIntake=0; save(); } }

    function startWorkout(title){
        const id=String(title);
        state.completedWorkouts=state.completedWorkouts||[];
        if(state.completedWorkouts.includes(id)){ notify(tr('Эта тренировка уже отмечена как выполненная','This workout is already completed')); return; }
        state.completedWorkouts.push(id); state.dailyCompleted=(state.dailyCompleted||0)+1;
        const td=state.trainingData?.day; if(td){ td.completed=Math.min(td.goal||3,(td.completed||0)+1); td.minutes=(td.minutes||0)+42; td.calories=(td.calories||0)+420; }
        state.points=(state.points||0)+40; state.xp=(state.xp||0)+40;
        const duration=42, calories=420;
        state.trainingMinutes=(state.trainingMinutes||0)+duration; state.caloriesBurned=(state.caloriesBurned||0)+calories;
        if(state.dailyCompleted===3) state.streak=(state.streak||0)+1; state.maxStreak=Math.max(state.maxStreak||0,state.streak||0);
        save(); render(); notify(`${title}\n✓ ${tr('Тренировка завершена. +40 XP','Workout completed. +40 XP')}`);
    }
