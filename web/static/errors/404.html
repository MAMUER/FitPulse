<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(1200px 600px at 50% -10%, #0d2417 0%, #050b08 60%);
            color: #f3fff7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #0d1b14;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px 26px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            margin: 0 auto 18px;
            display: block;
            border-radius: 16px;
        }
        .code {
            font-size: 88px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #a5ed38, #6fae20);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { font-size: 20px; font-weight: 700; margin: 6px 0 10px; color: #f3fff7; }
        p { font-size: 14px; color: #8da99a; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 12px 22px;
            background: linear-gradient(135deg, #3f7a10, #2c5e0a);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 18px rgba(111, 174, 32, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 24px rgba(111, 174, 32, 0.5);
        }
        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
            .btn:hover { transform: none; box-shadow: 0 0 18px rgba(111, 174, 32, 0.3); }
        }
        .brand { display: block; margin-top: 18px; font-size: 12px; color: #607669; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/images/logo.jpg" alt="FitPulse">
        <div class="code">404</div>
        <h1>Страница не найдена</h1>
        <p>Запрашиваемая страница недоступна или была перемещена.</p>
        <a href="/" class="btn">На главную</a>
        <span class="brand">FITPULSE</span>
    </div>
</body>
</html>
