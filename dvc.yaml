stages:
  prepare:
    cmd: python cmd/ml_generator/prepare_data.py
    deps:
      - datasets/raw/
      - cmd/ml_generator/prepare_data.py
    outs:
      - datasets/processed/

  train:
    cmd: python cmd/ml_generator/train.py
    deps:
      - datasets/processed/
      - cmd/ml_generator/train.py
    params:
      - train.epochs
      - train.batch_size
      - train.learning_rate
      - train.model_type
    outs:
      - models/generator.onnx
      - models/tokenizer.json
    metrics:
      - metrics/train_metrics.json:
          cache: false
      - metrics/val_metrics.json:
          cache: false

  evaluate:
    cmd: python cmd/ml_generator/evaluate.py
    deps:
      - models/generator.onnx
      - datasets/processed/
      - cmd/ml_generator/evaluate.py
    metrics:
      - metrics/test_metrics.json:
          cache: false
