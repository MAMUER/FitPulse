version: v2
plugins:
  # Локальные плагины. Установка: `make proto-plugins`
  #   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
  #   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
  #   go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@latest
  #
  # out/ считаются от каталога buf.gen.yaml (api/proto), поэтому ../gen.
  # paths=source_relative сохраняет раскладку api/gen/<dir>/<file>.pb.go, которую
  # импортирует Go-код (api/gen/user, api/gen/training, api/gen/biometric).
  # Swagger/OpenAPI генерируется отдельно через `make swagger` (swag init).
  - local: protoc-gen-go
    out: ../gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../gen
    opt:
      - paths=source_relative
  - local: protoc-gen-grpc-gateway
    out: ../gen
    opt:
      - paths=source_relative