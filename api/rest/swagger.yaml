openapi: 3.0.3
info:
  title: Fitness Platform API
  version: 1.0.0
  description: API for personalized fitness management with biometric data integration

servers:
  - url: https://fittpulse.duckdns.org/api/v1
    description: Production server

security:
  - bearerAuth: []

paths:
  # ============================================================================
  # PUBLIC AUTHENTICATION
  # ============================================================================
  /api/v1/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                role:
                  type: string
                  enum: [user, admin, trainer]
                  default: user
      responses:
        "200":
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        "400":
          description: Validation error
        "409":
          description: User already exists

  /api/v1/register/invite:
    post:
      tags:
        - Authentication
      summary: Register with invite code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
                - invite_code
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                invite_code:
                  type: string
                license_number:
                  type: string
                specialty:
                  type: string
                phone:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: User registered with invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user_id:
                    type: string
                  message:
                    type: string

  /api/v1/invite/validate:
    post:
      tags:
        - Authentication
      summary: Validate invite code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Invite code validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_valid:
                    type: boolean
                  role:
                    type: string
                  specialty:
                    type: string
                  error:
                    type: string

  /api/v1/login:
    post:
      tags:
        - Authentication
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                      access_token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: integer
                      refresh_token:
                        type: string
                  - type: object
                    properties:
                      requires_2fa:
                        type: boolean
                      temp_token:
                        type: string
                      message:
                        type: string

  /api/v1/auth/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm email with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: string

  /api/v1/auth/yandex:
    get:
      tags:
        - Authentication
      summary: Yandex ID OAuth login
      security: []
      responses:
        "302":
          description: Redirect to Yandex ID OAuth

  /api/v1/auth/yandex/callback:
    get:
      tags:
        - Authentication
      summary: Yandex ID OAuth callback
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OAuth callback result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  user_id:
                    type: string
                  role:
                    type: string

  /api/v1/auth/2fa/verify:
    post:
      tags:
        - Authentication
      summary: Verify TOTP passcode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - temp_token
                - passcode
              properties:
                temp_token:
                  type: string
                passcode:
                  type: string
                  minLength: 6
                  maxLength: 6
                is_backup_code:
                  type: boolean
      responses:
        "200":
          description: 2FA verified, tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  backup_codes_remaining:
                    type: integer

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer

  /api/v1/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent if account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/v1/auth/reset:
    post:
      tags:
        - Authentication
      summary: Reset password with code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - new_password
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/v1/captcha/verify:
    post:
      tags:
        - Authentication
      summary: Verify CAPTCHA token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: CAPTCHA verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # ============================================================================
  # PUBLIC SYSTEM
  # ============================================================================
  /health:
    get:
      tags:
        - System
      summary: Health check
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  timestamp:
                    type: string
                  services:
                    type: object
                   classifier:
                     type: object

  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

  /.well-known/jwks.json:
    get:
      tags:
        - System
      summary: JWKS endpoint for JWT verification
      security: []
      responses:
        "200":
          description: JWKS JSON
          content:
            application/json:
              schema:
                type: object

  /api/security/csp-report:
    post:
      tags:
        - System
      summary: CSP violation report endpoint
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                url:
                  type: string
                user_agent:
                  type: string
                body:
                  type: object
                report:
                  type: object
      responses:
        "200":
          description: Report received

  /confirm:
    get:
      tags:
        - Authentication
      summary: Email confirmation page (HTML)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML confirmation page

  # ============================================================================
  # PROTECTED PROFILE
  # ============================================================================
  /api/v1/profile:
    get:
      tags:
        - Profile
      summary: Get user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  profile:
                    type: object
    put:
      tags:
        - Profile
      summary: Update user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
    delete:
      tags:
        - Profile
      summary: Delete user account
      security:
        - bearerAuth: []
        - criticalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"

  /api/v1/profile/export:
    get:
      tags:
        - Profile
      summary: Export user data
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User data exported
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  user_id:
                    type: string
                  email:
                    type: string
                  full_name:
                    type: string
                  nickname:
                    type: string
                  role:
                    type: string
                  age:
                    type: integer
                  gender:
                    type: string
                  height_cm:
                    type: integer
                  weight_kg:
                    type: number
                  fitness_level:
                    type: string
                  goals:
                    type: array
                    items:
                      type: string
                  contraindications:
                    type: array
                    items:
                      type: string
                  nutrition:
                    type: string
                  sleep_hours:
                    type: number
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  health_conditions:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthCondition"
                  body_composition:
                    type: array
                    items:
                      $ref: "#/components/schemas/BodyCompositionRecord"
                  menstrual_cycles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenstrualCycle"
                  devices:
                    type: array
                    items:
                      type: object
                  exported_at:
                    type: string

  # ============================================================================
  # PROTECTED HEALTH
  # ============================================================================
  /api/v1/health/conditions:
    get:
      tags:
        - Health
      summary: List health conditions
      security:
        - bearerAuth: []
      parameters:
        - name: condition_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Health conditions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  conditions:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthCondition"
                  total:
                    type: integer
    post:
      tags:
        - Health
      summary: Create health condition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertHealthConditionRequest"
      responses:
        "200":
          description: Condition created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  condition:
                    $ref: "#/components/schemas/HealthCondition"

  /api/v1/health/conditions/{condition_id}:
    parameters:
      - name: condition_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - Health
      summary: Delete health condition
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Condition deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"

  /api/v1/health/body-composition:
    get:
      tags:
        - Health
      summary: List body composition records
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 10000
      responses:
        "200":
          description: Body composition records
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/BodyCompositionRecord"
                  total:
                    type: integer
    post:
      tags:
        - Health
      summary: Create body composition record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BodyCompositionRequest"
      responses:
        "200":
          description: Record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  record:
                    $ref: "#/components/schemas/BodyCompositionRecord"

  /api/v1/health/menstrual-cycles:
    get:
      tags:
        - Health
      summary: List menstrual cycles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Menstrual cycles list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  cycles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MenstrualCycle"
                  total:
                    type: integer
    post:
      tags:
        - Health
      summary: Create menstrual cycle record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenstrualCycleRequest"
      responses:
        "200":
          description: Cycle created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  cycle:
                    $ref: "#/components/schemas/MenstrualCycle"

  /api/v1/health/menstrual-cycles/{cycle_id}:
    parameters:
      - name: cycle_id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
        - Health
      summary: Update menstrual cycle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenstrualCycleRequest"
      responses:
        "200":
          description: Cycle updated
    delete:
      tags:
        - Health
      summary: Delete menstrual cycle
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cycle deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "deleted"

  # ============================================================================
  # PROTECTED AUTH
  # ============================================================================
  /api/v1/auth/2fa/setup:
    post:
      tags:
        - Authentication
      summary: Setup TOTP 2FA
      security:
        - bearerAuth: []
        - criticalSession: []
      responses:
        "200":
          description: TOTP setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code_url:
                    type: string
                  qr_code_base64:
                    type: string
                  secret:
                    type: string
                  backup_codes:
                    type: array
                    items:
                      type: string

  /api/v1/auth/2fa/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm TOTP setup
      security:
        - bearerAuth: []
        - criticalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passcode
              properties:
                passcode:
                  type: string
                  minLength: 6
                  maxLength: 6
                temp_secret:
                  type: string
                backup_codes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 2FA enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/v1/auth/2fa/status:
    get:
      tags:
        - Authentication
      summary: Get 2FA status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  backup_codes_remaining:
                    type: integer

  /api/v1/auth/2fa/disable:
    post:
      tags:
        - Authentication
      summary: Disable 2FA
      security:
        - bearerAuth: []
        - criticalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passcode
              properties:
                passcode:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/v1/auth/critical-session:
    post:
      tags:
        - Authentication
      summary: Create critical session token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Critical session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  critical_session_token:
                    type: string

  /api/v1/logout:
    post:
      tags:
        - Authentication
      summary: Logout (revoke refresh token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # ============================================================================
  # PROTECTED BIOMETRICS
  # ============================================================================
  /api/v1/biometrics:
    post:
      tags:
        - Biometrics
      summary: Add biometric record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - metric_type
                - value
                - timestamp
              properties:
                metric_type:
                  type: string
                  enum:
                    [
                      heart_rate,
                      spo2,
                      sleep,
                      blood_pressure,
                      steps,
                      calories,
                      distance,
                      active_minutes,
                      stress,
                      respiration_rate,
                      body_temperature,
                      blood_glucose,
                      oxygen_saturation,
                      vo2_max,
                      hrv,
                      respiratory_rate,
                      skin_temperature,
                      glucose,
                      lactate,
                      caffeine_intake,
                      water_intake,
                      steps_per_minute,
                      heart_rate_variability,
                      sleep_stages,
                      rem_sleep,
                      deep_sleep,
                      light_sleep,
                      sleep_score,
                      readiness_score,
                      activity_score,
                    ]
                value:
                  oneOf:
                    - type: number
                    - type: integer
                timestamp:
                  type: string
                  format: date-time
                device_type:
                  type: string
                  enum: [garmin, whoop, polar, suunto, strava, oura, ultrahuman, apple_health, samsung_health, google_health_connect, open_wearables, withings, manual]
                quality:
                  type: string
                  enum: [high, medium, low]
                  default: medium
      responses:
        "200":
          description: Record added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "created"
    get:
      tags:
        - Biometrics
      summary: Get biometric records
      security:
        - bearerAuth: []
      parameters:
        - name: metric_type
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 10000
      responses:
        "200":
          description: Biometric records
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/BiometricRecord"
                  total:
                    type: integer

  # ============================================================================
  # PROTECTED TRAINING
  # ============================================================================
  /api/v1/training/generate:
    post:
      tags:
        - Training
      summary: Generate training plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                duration_weeks:
                  type: integer
                  minimum: 1
                  maximum: 52
                available_days:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                class:
                  type: string
                  enum: [strength, cardio, flexibility, hiit, endurance, mixed]
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
      responses:
        "200":
          description: Plan generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  plan_id:
                    type: string
                  plan_data:
                    type: object
                  training_type:
                    type: string

  /api/v1/training/plans:
    get:
      tags:
        - Training
      summary: Get user training plans
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        "200":
          description: Training plans
          content:
            application/json:
              schema:
                type: object
