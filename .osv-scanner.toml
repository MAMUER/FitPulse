# Список игнорируемых advisory OSV (см. scripts/ci/osv_ignore_sync.py).
#
# Пуст намеренно: osv-scanner сообщает "unused ignores", если запись больше не
# соответствует ни одному срабатыванию (например, уязвимый пакет исчез из
# lock-файла или вышел исправленный релиз). Добавлять сюда advisory только
# вместе с причиной и условием пересмотра.