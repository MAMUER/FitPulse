apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: fitness-platform-production
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "fitpulse-alerts@example.com"
      smtp_auth_username: "${SMTP_USER}"
      smtp_auth_password: "${SMTP_PASS}"
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical'
          continue: true
        - match:
            severity: warning
          receiver: 'default'

    receivers:
      - name: 'default'
        # Phase 2: configure SMTP credentials and real recipient addresses
        email_configs:
          - to: 'ops-team@example.com'
            send_resolved: true
            headers:
              subject: '[FITPULSE] {{ .GroupLabels.alertname }}'

      - name: 'critical'
        # Phase 2: configure SMTP credentials and real on-call address
        email_configs:
          - to: 'oncall@example.com'
            send_resolved: true
            headers:
              subject: '[FITPULSE CRITICAL] {{ .GroupLabels.alertname }}'

      - name: 'telegram'
        webhook_configs:
          - url: 'http://alertmanager-telegram-bot:8080/alert'
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace', 'service']
