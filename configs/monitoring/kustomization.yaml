apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alertmanager
  - fluent-bit
  - grafana
  - jaeger
  - node-exporter
  - pg-exporter
  - prometheus
  - rabbitmq-exporter
  - valkey-exporter
namespace: fitness-platform-production
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      zone: monitoring-zone
    includeSelectors: true
