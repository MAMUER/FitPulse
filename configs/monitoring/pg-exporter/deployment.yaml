apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-exporter
  namespace: fitness-platform-production
  labels:
    app: pg-exporter
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-exporter
  template:
    metadata:
      labels:
        app: pg-exporter
        tier: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pg-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          args:
            - "--web.listen-address=0.0.0.0:9187"
            - "--log.level=info"
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-dsn
          ports:
            - containerPort: 9187
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pg-exporter
  namespace: fitness-platform-production
  labels:
    app: pg-exporter
spec:
  clusterIP: None
  selector:
    app: pg-exporter
  ports:
    - port: 9187
      targetPort: 9187
      name: http
