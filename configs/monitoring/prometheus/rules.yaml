apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fitpulse-alerts
  namespace: fitness-platform-production
  labels:
    app: fitpulse
    tier: monitoring
spec:
  groups:
    - name: fitpulse.slo
      rules:
        - alert: HighErrorRate
          expr: |
            sum(rate(request_total{status=~"5.."}[5m])) 
            / sum(rate(request_total[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate for {{ $labels.service }}"
            description: "Error rate is {{ $value | humanizePercentage }} for service {{ $labels.service }} on endpoint {{ $labels.endpoint }}"
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m])) by (le, service)) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High P95 latency for {{ $labels.service }}"
            description: "P95 latency is {{ $value | humanizeDuration }} for service {{ $labels.service }}"
        - alert: DatabaseConnectionsHigh
          expr: |
            pg_stat_activity_count / pg_settings_max_connections > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connections high"
            description: "Database connections are at {{ $value | humanizePercentage }} of max"
        - alert: RabbitMQQueueDepth
          expr: rabbitmq_queue_messages > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ queue depth high"
            description: "Queue {{ $labels.queue }} has {{ $value }} messages"
    - name: fitpulse.availability
      rules:
        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Service {{ $labels.service }} is down"
            description: "{{ $labels.job }} in namespace {{ $labels.namespace }} has been down for more than 1 minute"
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"
