apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-exporter
  namespace: fitness-platform-production
  labels:
    app: rabbitmq-exporter
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-exporter
  template:
    metadata:
      labels:
        app: rabbitmq-exporter
        tier: monitoring
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq-exporter
          image: kbudde/rabbitmq-exporter:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--rabbitmq-url=amqps://guest:$(RABBITMQ_PASSWORD)@rabbitmq:5671/"
          env:
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: rabbitmq-password
          ports:
            - containerPort: 9419
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-exporter
  namespace: fitness-platform-production
  labels:
    app: rabbitmq-exporter
spec:
  clusterIP: None
  selector:
    app: rabbitmq-exporter
  ports:
    - port: 9419
      targetPort: 9419
      name: http
