apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-exporter
  namespace: fitness-platform-production
  labels:
    app: valkey-exporter
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-exporter
  template:
    metadata:
      labels:
        app: valkey-exporter
        tier: monitoring
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey-exporter
          image: oliver006/redis_exporter:v1.53.0
          imagePullPolicy: IfNotPresent
          args:
            - "--redis.addr=valkey:6379"
            - "--redis.password=$(VALKEY_PASSWORD)"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: VALKEY_PASSWORD
          ports:
            - containerPort: 9121
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "2Gi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-exporter
  namespace: fitness-platform-production
  labels:
    app: valkey-exporter
spec:
  clusterIP: None
  selector:
    app: valkey-exporter
  ports:
    - port: 9121
      targetPort: 9121
      name: http
