apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: fitness-platform-production
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: grpc
      port: 14250
      targetPort: 14250
    - name: http
      port: 14268
      targetPort: 14268
  selector:
    app: jaeger
