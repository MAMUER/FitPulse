input {
  stdin { }
}

filter {
  # Parse JSON logs from FitPulse services
  json {
    source => "message"
    target => "log"
    skip_on_invalid_json => true
  }

  # Add service name from container label or log field
  if [log][service] {
    mutate {
      add_field => { "service" => "%{[log][service]}" }
    }
  }

  # Add timestamp
  if [log][timestamp] {
    date {
      match => ["[log][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  } else {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add level
  if [log][level] {
    mutate {
      add_field => { "level" => "%{[log][level]}" }
    }
  }

  # Add user_id if present
  if [log][user_id] {
    mutate {
      add_field => { "user_id" => "%{[log][user_id]}" }
    }
  }

  # Add request_id if present
  if [log][request_id] {
    mutate {
      add_field => { "request_id" => "%{[log][request_id]}" }
    }
  }

  # Add correlation_id if present
  if [log][correlation_id] {
    mutate {
      add_field => { "correlation_id" => "%{[log][correlation_id]}" }
    }
  }

  # PII field tagging for compliance
  if [log][pii_fields] {
    mutate {
      add_field => { "pii_fields" => "%{[log][pii_fields]}" }
    }
  } else {
    # Auto-detect PII fields from log content
    grok {
      match => { "message" => "%{DATA:email}" }
      tag_on_failure => []
    }
    if [email] {
      mutate {
        add_field => { "pii_fields" => "email" }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS}"]
    index => "fitpulse-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    user => "${ELASTICSEARCH_USER}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    ilm_enabled => true
    ilm_policy => "fitpulse-logs-policy"
    template_name => "fitpulse-logs-template"
  }

  # Debug output
  # stdout { codec => rubydebug }
}
