apiVersion: v1
kind: Service
metadata:
  name: biometric-service
  namespace: fitness-platform-production
spec:
  selector:
    app: biometric-service
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
    - port: 8085
      targetPort: 8085
      name: webhook
  type: ClusterIP
