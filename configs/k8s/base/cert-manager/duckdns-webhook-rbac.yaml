# RBAC для API-aggregation-слоя Kubernetes.
#
# cert-manager-webhook-duckdns регистрируется как APIService v1alpha1.acme.duckdns.org,
# а kube-apiserver перед вызовом вебхука обязан прочитать ConfigMap
# kube-system/extension-apiserver-authentication (запросы на валидацию запросов от
# system:serviceaccount:cert-manager:cert-manager-webhook-duckdns). Штатный чарт
# ebrianne/cert-manager-webhook-duckdns этого права не выдаёт, поэтому в логах
# вебхука на каждом рестарте:
#
#   Failed to watch *v1.ConfigMap: configmaps "extension-apiserver-authentication"
#   is forbidden: User "system:serviceaccount:cert-manager:cert-manager-webhook-duckdns"
#   cannot list resource "configmaps" in API group "" in the namespace "kube-system"
#
# Сам выпуск сертификатов от этого не страдает (APIService Available=True), но лог
# грязный, а авторизация запросов к вебхуку работает не полностью.
#
# Доступ ограничен одним ConfigMap через resourceNames — минимально необходимые права.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-webhook-duckdns:auth-configmap-reader
  labels:
    app: cert-manager-webhook-duckdns
    app.kubernetes.io/managed-by: Helm
    heritage: Helm
    release: cert-manager-webhook-duckdns
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["extension-apiserver-authentication"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-webhook-duckdns:auth-configmap-reader
  labels:
    app: cert-manager-webhook-duckdns
    app.kubernetes.io/managed-by: Helm
    heritage: Helm
    release: cert-manager-webhook-duckdns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-webhook-duckdns:auth-configmap-reader
subjects:
  - kind: ServiceAccount
    name: cert-manager-webhook-duckdns
    namespace: cert-manager