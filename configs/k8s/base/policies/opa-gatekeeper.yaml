# yaml-language-server: disable
# file_format: policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-gatekeeper-policies
  namespace: gatekeeper-system
  labels:
    app: gatekeeper
    component: policies
data:
  ## Constraint Templates
  
  k8srequiredlabels.yaml: |
    apiVersion: templates.gatekeeper.sh/v1
    kind: ConstraintTemplate
    metadata:
      name: k8srequiredlabels
    spec:
      crd:
        spec:
          names:
            kind: K8sRequiredLabels
      targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
            package k8srequiredlabels
            
            violation[{"msg": msg}] {
              provided := {label | input.review.object.metadata.labels[label]}
              required := {label | label := input.parameters.labels[_]}
              missing := required - provided
              count(missing) > 0
              msg := sprintf("Missing required labels: %v", [missing])
            }
  
  k8srequiredresources.yaml: |
    apiVersion: templates.gatekeeper.sh/v1
    kind: ConstraintTemplate
    metadata:
      name: k8srequiredresources
    spec:
      crd:
        spec:
          names:
            kind: K8sRequiredResources
      targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
            package k8srequiredresources
            
            violation[{"msg": msg}] {
              container := input.review.object.spec.containers[_]
              not container.resources.limits
              msg := sprintf("Container %v has no resource limits", [container.name])
            }
            
            violation[{"msg": msg}] {
              container := input.review.object.spec.containers[_]
              not container.resources.requests
              msg := sprintf("Container %v has no resource requests", [container.name])
            }
  
  k8sblockprivileged.yaml: |
    apiVersion: templates.gatekeeper.sh/v1
    kind: ConstraintTemplate
    metadata:
      name: k8sblockprivileged
    spec:
      crd:
        spec:
          names:
            kind: K8sBlockPrivileged
      targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
            package k8sblockprivileged
            
            violation[{"msg": msg}] {
              container := input.review.object.spec.containers[_]
              container.securityContext.privileged == true
              msg := sprintf("Container %v is privileged", [container.name])
            }
  
  k8srequirenonroot.yaml: |
    apiVersion: templates.gatekeeper.sh/v1
    kind: ConstraintTemplate
    metadata:
      name: k8srequirenonroot
    spec:
      crd:
        spec:
          names:
            kind: K8sRequireNonRoot
      targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
            package k8srequirenonroot
            
            violation[{"msg": msg}] {
              container := input.review.object.spec.containers[_]
              not container.securityContext.runAsNonRoot
              msg := sprintf("Container %v must set runAsNonRoot", [container.name])
            }
  
  k8srequiredreadonlyroot.yaml: |
    apiVersion: templates.gatekeeper.sh/v1
    kind: ConstraintTemplate
    metadata:
      name: k8srequiredreadonlyroot
    spec:
      crd:
        spec:
          names:
            kind: K8sRequiredReadOnlyRoot
      targets:
        - target: admission.k8s.gatekeeper.sh
          rego: |
            package k8srequiredreadonlyroot
            
            violation[{"msg": msg}] {
              container := input.review.object.spec.containers[_]
              not container.securityContext.readOnlyRootFilesystem
              msg := sprintf("Container %v must set readOnlyRootFilesystem", [container.name])
            }
  
  ## Constraints
  
  require-app-labels.yaml: |
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sRequiredLabels
    metadata:
      name: require-app-labels
    spec:
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
        namespaces: ["fitness-platform-production", "ingress-nginx", "monitoring"]
      parameters:
        labels: ["app", "app.kubernetes.io/name", "app.kubernetes.io/managed-by"]
  
  require-resource-limits.yaml: |
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sRequiredResources
    metadata:
      name: require-resource-limits
    spec:
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
        namespaces: ["fitness-platform-production", "ingress-nginx", "monitoring"]
  
  block-privileged-containers.yaml: |
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sBlockPrivileged
    metadata:
      name: block-privileged-containers
    spec:
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
        namespaces: ["fitness-platform-production", "ingress-nginx", "monitoring"]
  
  require-non-root.yaml: |
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sRequireNonRoot
    metadata:
      name: require-non-root
    spec:
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
        namespaces: ["fitness-platform-production", "ingress-nginx", "monitoring"]
  
  require-readonly-rootfs.yaml: |
    apiVersion: constraints.gatekeeper.sh/v1beta1
    kind: K8sRequiredReadOnlyRoot
    metadata:
      name: require-readonly-rootfs
    spec:
      match:
        kinds:
          - apiGroups: [""]
            kinds: ["Pod"]
        namespaces: ["fitness-platform-production", "ingress-nginx", "monitoring"]
  
  ## Sync
  
  sync.yaml: |
    apiVersion: config.gatekeeper.sh/v1alpha1
    kind: Config
    metadata:
      name: config
      namespace: "gatekeeper-system"
    spec:
      sync:
        syncOnly:
          - group: ""
            version: "v1"
            kind: "Pod"
          - group: "apps"
            version: "v1"
            kind: "Deployment"
          - group: "apps"
            version: "v1"
            kind: "StatefulSet"
