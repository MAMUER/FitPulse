apiVersion: batch/v1
kind: Job
metadata:
  name: create-open-wearables-db
  namespace: fitness-platform-production
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
      containers:
        - name: create-db
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              PGPASSWORD=$(cat "$PGPASSWORD_FILE") psql \
                -h postgres-service \
                -U $(cat /etc/secrets/POSTGRES_USER) \
                -tc "SELECT 1 FROM pg_database WHERE datname = 'open_wearables'" | grep -q 1 || \
              psql -h postgres-service \
                -U $(cat /etc/secrets/POSTGRES_USER) \
                -c "CREATE DATABASE open_wearables"
          env:
            - name: PGPASSWORD_FILE
              value: "/etc/secrets/POSTGRES_PASSWORD"
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
  backoffLimit: 3
