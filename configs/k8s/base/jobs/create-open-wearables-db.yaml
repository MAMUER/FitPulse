apiVersion: batch/v1
kind: Job
metadata:
  name: create-open-wearables-db
  namespace: fitness-platform-production
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
      containers:
        - name: create-db
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              PGPASSWORD=$(cat /etc/secrets/POSTGRES_PASSWORD) psql \
                -h postgres-service \
                -U $(cat /etc/secrets/POSTGRES_USER) \
                -tc "SELECT 1 FROM pg_database WHERE datname = 'open_wearables'" | grep -q 1 || \
              psql -h postgres-service \
                -U $(cat /etc/secrets/POSTGRES_USER) \
                -c "CREATE DATABASE open_wearables"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  backoffLimit: 3
