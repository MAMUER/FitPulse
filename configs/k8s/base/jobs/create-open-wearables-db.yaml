apiVersion: batch/v1
kind: Job
metadata:
  name: create-open-wearables-db
  namespace: fitness-platform-production
  labels:
    app: create-open-wearables-db
    zone: app-zone
    app.kubernetes.io/name: create-open-wearables-db
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  template:
    metadata:
      labels:
        app: create-open-wearables-db
        zone: app-zone
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
      containers:
        - name: create-db
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: docker.io/library/postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD=$(cat /etc/secrets/POSTGRES_PASSWORD)
              DB_USER=$(cat /etc/secrets/POSTGRES_USER)
              # -d postgres: CREATE DATABASE cannot run inside a transaction and the
              # default database would otherwise be a per-user DB that initdb never
              # created (POSTGRES_USER=fitness_admin), so psql failed with
              # 'database "fitness_admin" does not exist'.
              if psql -h postgres-service -U "$DB_USER" -d postgres \
                -tAc "SELECT 1 FROM pg_database WHERE datname = 'open_wearables'" | grep -q 1; then
                echo "Database open_wearables already exists"
              else
                psql -h postgres-service -U "$DB_USER" -d postgres \
                  -c "CREATE DATABASE open_wearables"
                echo "Database open_wearables created"
              fi
          env:
            - name: PGPASSWORD_FILE
              value: "/etc/secrets/POSTGRES_PASSWORD"
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
  backoffLimit: 3
