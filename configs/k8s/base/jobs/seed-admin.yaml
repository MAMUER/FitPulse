apiVersion: batch/v1
kind: Job
metadata:
  name: seed-admin
  namespace: fitness-platform-production
  labels:
    app: seed-admin
    zone: app-zone
    environment: production
    app.kubernetes.io/name: seed-admin
    app.kubernetes.io/instance: seed-admin
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: seed-admin
        zone: app-zone
        app.kubernetes.io/name: seed-admin
        app.kubernetes.io/instance: seed-admin
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/version: "latest"
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: app-service-account
      restartPolicy: Never
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
      containers:
        - name: seed-admin
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: docker.io/library/postgres:18-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export POSTGRES_USER=$(cat /etc/secrets/POSTGRES_USER)
              export POSTGRES_PASSWORD=$(cat /etc/secrets/POSTGRES_PASSWORD)
              export POSTGRES_DB=$(cat /etc/secrets/POSTGRES_DB)
              export SEED_ADMIN_EMAIL=$(cat /etc/secrets/SEED_ADMIN_EMAIL)
              export SEED_ADMIN_PASSWORD=$(cat /etc/secrets/SEED_ADMIN_PASSWORD)
              export SEED_ADMIN_HASH=$(cat /etc/secrets/SEED_ADMIN_HASH)
              echo "=== FitPulse Admin Seed ==="
              echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Email: ${SEED_ADMIN_EMAIL}"
              echo "DB Host: ${DB_HOST:-postgres-service}"
              echo "DB Port: ${DB_PORT:-5432}"
              echo "DB Name: ${POSTGRES_DB}"
              echo "-> Waiting for PostgreSQL to accept connections..."
              for i in $(seq 1 30); do
                if PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                  -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                  -c "SELECT 1" >/dev/null 2>&1; then
                  echo "✅ PostgreSQL is ready"
                  break
                fi
                echo "  Attempt $i/30: PostgreSQL not ready yet, waiting 5s..."
                sleep 5
              done
              if ! PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
                -c "SELECT 1" >/dev/null 2>&1; then
                echo "❌ Cannot connect to database after retries"
                exit 1
              fi
              echo "-> Migrating legacy email hash if needed..."
              # Before 32417e2e the app used hex(email) as the lookup hash. The
              # current code uses SHA256(lower(trim(email))); rewrite the seeded
              # admin row so login keeps working after the upgrade.
              PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 \
                -v email="${SEED_ADMIN_EMAIL}" <<'SQL'
              UPDATE users u
              SET email_hash = encode(digest(lower(btrim(:'email')), 'sha256'), 'hex')
              WHERE u.email_hash = encode(convert_to(btrim(:'email'), 'UTF8'), 'hex')
                AND NOT EXISTS (
                  SELECT 1 FROM users x
                  WHERE x.email_hash = encode(digest(lower(btrim(:'email')), 'sha256'), 'hex')
                );
              SQL
              echo "-> Checking if admin exists..."
              # psql -c does not expand :'var' placeholders (they are psql-specific
              # features, which -c rejects), so feed the query on stdin instead.
              EXISTING=$(PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 \
                -v email="${SEED_ADMIN_EMAIL}" -tA <<'SQL'
              SELECT EXISTS (SELECT 1 FROM users WHERE email_hash = encode(digest(lower(btrim(:'email')), 'sha256'), 'hex'));
              SQL
              )
              if [ "${EXISTING}" = "t" ]; then
                echo "✅ Admin user already exists"
                exit 0
              fi
              KEY_ID=$(PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -tAc \
                "SELECT key_id FROM pgsodium.key WHERE name = 'fitpulse_pii' AND key_type = 'aead-det'")
              if [ -z "${KEY_ID}" ]; then
                KEY_ID=$(PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                  -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -tAc \
                  "SELECT (pgsodium.create_key('aead-det'::pgsodium.key_type, 'fitpulse_pii')).key_id")
              fi
              if [ -z "${KEY_ID}" ]; then
                echo "❌ Failed to find or create the pgsodium PII key"
                exit 1
              fi
              # pgcrypto's gen_salt() has no Argon2id support, so the hash is
              # generated in CI by cmd/hash-password and stored in app-secrets.
              if [ -z "${SEED_ADMIN_HASH}" ]; then
                echo "❌ SEED_ADMIN_HASH is empty (app-secrets lacks the Argon2id hash)"
                exit 1
              fi
              echo "-> Using precomputed Argon2id password hash"
              echo "-> Creating admin user..."
              PGPASSWORD="${POSTGRES_PASSWORD}" psql -h "${DB_HOST:-postgres-service}" \
                -p "${DB_PORT:-5432}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 \
                -v email="${SEED_ADMIN_EMAIL}" -v password_hash="${SEED_ADMIN_HASH}" -v key_id="${KEY_ID}" <<'SQL'
              BEGIN;
              WITH admin_data AS (
                SELECT
                  :'email'::text AS email,
                  :'password_hash'::text AS password_hash,
                  gen_random_bytes(12) AS email_nonce,
                  gen_random_bytes(12) AS full_name_nonce
              )
              INSERT INTO users (
                id, email_encrypted, email_nonce, email_hash, password_hash,
                full_name_encrypted, full_name_nonce, full_name_hash,
                role, email_confirmed, created_at, updated_at
              )
              SELECT
                gen_random_uuid(),
                pgsodium.crypto_aead_aegis256_encrypt(email, '', :key_id, email_nonce),
                email_nonce,
                encode(digest(lower(btrim(email)), 'sha256'), 'hex'),
                password_hash,
                pgsodium.crypto_aead_aegis256_encrypt('System Administrator', '', :key_id, full_name_nonce),
                full_name_nonce,
                encode(digest(lower('System Administrator'), 'sha256'), 'hex'),
                'admin',
                TRUE,
                NOW(),
                NOW()
              FROM admin_data
              ON CONFLICT (email_hash) DO NOTHING;
              INSERT INTO user_profiles (user_id)
              SELECT id FROM users WHERE email_hash = encode(digest(lower(btrim(:'email')), 'sha256'), 'hex')
              ON CONFLICT (user_id) DO NOTHING;
              INSERT INTO invite_codes (code, role, max_uses, is_active, created_at)
              SELECT
                'INVITE-' || substr(md5(random()::text || i::text), 1, 8),
                'client',
                1,
                TRUE,
                NOW()
              FROM generate_series(1, 5) AS i
              WHERE NOT EXISTS (
                SELECT 1 FROM invite_codes WHERE code LIKE 'INVITE-%'
              );
              COMMIT;
              SELECT 'Admin user present' WHERE EXISTS (
                SELECT 1 FROM users WHERE email_hash = encode(digest(lower(btrim(:'email')), 'sha256'), 'hex')
              );
              SQL
              echo "✅ Admin user seed completed"
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
