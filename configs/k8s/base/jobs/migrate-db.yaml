apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-db
  namespace: fitness-platform-production
  labels:
    app: migrate-db
    zone: app-zone
    app.kubernetes.io/name: migrate-db
    app.kubernetes.io/instance: migrate-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/version: "18"
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: migrate-db
        zone: app-zone
        app.kubernetes.io/name: migrate-db
        app.kubernetes.io/instance: migrate-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/version: "18"
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      serviceAccountName: app-service-account
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
        - name: migrations
          configMap:
            name: db-migrations
      containers:
        - name: migrate
          # checkov:skip=CKV_K8S_43: Known public image; tag-based reference acceptable
          image: docker.io/library/postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGHOST
              value: "postgres-service"
            - name: PGPORT
              value: "5432"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="$(cat /etc/secrets/POSTGRES_PASSWORD)"
              DB_USER="$(cat /etc/secrets/POSTGRES_USER)"
              DB_NAME="$(cat /etc/secrets/POSTGRES_DB)"
              # Fail fast with an actionable message instead of letting
              # CREATE EXTENSION pgsodium abort V1 mid-file (ON_ERROR_STOP=1),
              # which used to leave the schema empty and only surface later as
              # "timed out waiting for the condition" plus a user-service crash
              # on "relation pgsodium.key does not exist".
              AVAILABLE="$(psql -h postgres-service -U "$DB_USER" -d "$DB_NAME" -tAc \
                "SELECT count(*) FROM pg_available_extensions WHERE name = 'pgsodium'")"
              if [ "${AVAILABLE:-0}" != "1" ]; then
                echo "::error::PostgreSQL image does not provide the 'pgsodium' extension."
                echo "::error::user-service requires the pgsodium keyring (pgsodium.key);"
                echo "::error::use the pgsodium-enabled server image (docker/postgres-pgsodium/Dockerfile)."
                exit 1
              fi
              psql -h postgres-service -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
                -f /migrations/V1__full_schema.sql
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "256Mi"
