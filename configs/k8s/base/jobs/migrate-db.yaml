apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-db
  namespace: fitness-platform-production
  labels:
    app: migrate-db
    zone: app-zone
    app.kubernetes.io/name: migrate-db
    app.kubernetes.io/instance: migrate-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/version: "18"
    app.kubernetes.io/managed-by: kustomize
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: migrate-db
        zone: app-zone
        app.kubernetes.io/name: migrate-db
        app.kubernetes.io/instance: migrate-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/version: "18"
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      serviceAccountName: app-service-account
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
        - name: migrations
          configMap:
            name: db-migrations
      containers:
        - name: migrate
          # checkov:skip=CKV_K8S_43: Known public image; tag-based reference acceptable
          image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PGHOST
              value: "postgres-service"
            - name: PGPORT
              value: "5432"
          command: ["/bin/sh", "-c"]
          args:
            - "PGPASSWORD=\"$(cat /etc/secrets/POSTGRES_PASSWORD)\" psql -h postgres-service -U \"$(cat /etc/secrets/POSTGRES_USER)\" -d \"$(cat /etc/secrets/POSTGRES_DB)\" -v ON_ERROR_STOP=1 -f /migrations/V1__full_schema.sql"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "256Mi"
