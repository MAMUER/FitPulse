apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-wal-archive-to-minio
  namespace: fitness-platform-production
  labels:
    app: postgres
    component: wal-archive
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
            - name: wal-archive
              image: postgres:18-alpine
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  
                  # Install AWS CLI
                  apk add --no-cache aws-cli
                  
                  WAL_DIR="/wal-archive"
                  S3_ENDPOINT="${S3_ENDPOINT:-http://minio.minio.svc.cluster.local:9000}"
                  S3_BUCKET="${S3_BUCKET:-postgres-wal-archive}"
                  S3_PATH="${S3_WAL_PATH:-wal}"
                  AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-}}"
                  AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-}}"
                  
                  export AWS_ACCESS_KEY_ID
                  export AWS_SECRET_ACCESS_KEY
                  
                  if [[ ! -d "$WAL_DIR" ]] || [[ -z "$(ls -A "$WAL_DIR" 2>/dev/null)" ]]; then
                    echo "No WAL files to archive"
                    exit 0
                  fi
                  
                  echo "Archiving WAL files to S3: ${S3_BUCKET}/${S3_PATH}"
                  
                  ARCHIVED=0
                  FAILED=0
                  
                  for wal_file in "$WAL_DIR"/*; do
                    if [[ -f "$wal_file" ]]; then
                      filename=$(basename "$wal_file")
                      s3_key="${S3_PATH}/${filename}"
                      
                      if aws --endpoint-url "$S3_ENDPOINT" s3 cp "$wal_file" "s3://${S3_BUCKET}/${s3_key}" --only-show-errors; then
                        ARCHIVED=$((ARCHIVED + 1))
                        # Remove local WAL file after successful upload
                        rm -f "$wal_file"
                      else
                        echo "ERROR: Failed to upload WAL file: $filename"
                        FAILED=$((FAILED + 1))
                      fi
                    fi
                  done
                  
                  echo "WAL archive completed: ${ARCHIVED} files uploaded, ${FAILED} failed"
                  
                  if [[ $FAILED -gt 0 ]]; then
                    exit 1
                  fi
              env:
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: S3_ENDPOINT
                      optional: true
                - name: S3_BUCKET
                  value: "postgres-wal-archive"
                - name: S3_WAL_PATH
                  value: "wal"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: wal-archive-storage
                  mountPath: /wal-archive
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          restartPolicy: Never
          volumes:
            - name: wal-archive-storage
              persistentVolumeClaim:
                claimName: postgres-wal-archive
