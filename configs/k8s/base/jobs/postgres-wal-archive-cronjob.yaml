apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-wal-archive-to-minio
  namespace: fitness-platform-production
  labels:
    app: postgres
    component: wal-archive
spec:
  schedule: "*/5 * * * *" # Every 5 minutes
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      # `apk add aws-cli` and the upload must never keep a pod alive for hours.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: postgres
            component: wal-archive
        spec:
          automountServiceAccountToken: false
          securityContext:
            # aws-cli is installed at runtime; the postgres image does not
            # contain it and the install needs a writable root filesystem.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: wal-archive
              # checkov:skip=CKV_K8S_43: Public image tag resolved at runtime; digest not pinned for ephemeral job
              # checkov:skip=CKV_K8S_22: apk needs a writable root filesystem
              image: docker.io/library/postgres:18-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  # `wal` is the same code path as the backup script (previously
                  # duplicated here), minus the full pg_dump.
                  apk add --no-cache bash aws-cli
                  exec /scripts/backup-db-with-minio.sh wal
              env:
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_DB
                - name: BACKUP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: BACKUP_KEY
                - name: WAL_DIR
                  value: "/wal-archive"
                - name: S3_ENDPOINT
                  value: "http://minio.minio.svc.cluster.local:9000"
                - name: S3_BUCKET
                  value: "postgres-backups"
                - name: S3_WAL_BUCKET
                  value: "postgres-wal-archive"
                - name: S3_WAL_PATH
                  value: "wal"
                - name: PROMETHEUS_TEXTFILE_DIR
                  value: "/tmp/metrics"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-password
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                # apk installs files as root and chowns them; dropping every
                # capability makes the install fail with EPERM.
                capabilities:
                  add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: wal-archive-storage
                  mountPath: /wal-archive
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          restartPolicy: Never
          volumes:
            - name: wal-archive-storage
              persistentVolumeClaim:
                claimName: postgres-wal-archive-postgres-0
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0755
