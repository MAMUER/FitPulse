apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: fitness-platform-production
  labels:
    app: postgres
    component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      # A backup that hangs on a full dump or a slow MinIO upload must not stay
      # active forever (this used to leave Pending/Running pods for 10+ hours).
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: postgres
            component: backup
        spec:
          automountServiceAccountToken: false
          securityContext:
            # backup-db-with-minio.sh needs `apk add aws-cli openssl` (and the
            # postgres image does not ship them), so this ephemeral job runs as
            # root without a service-account token. readOnlyRootFilesystem must
            # stay false for the package install.
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # checkov:skip=CKV_K8S_43: Public image tag resolved at runtime; digest not pinned for ephemeral job
              # checkov:skip=CKV_K8S_35: Backup script requires secrets as environment variables for pg_dump authentication
              # checkov:skip=CKV_K8S_22: apk needs a writable root filesystem
              image: docker.io/library/postgres:18-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  # The AWS CLI and openssl are not part of the postgres image.
                  # Install them on every run; the VPS has egress and the
                  # package cache makes this a few seconds.
                  apk add --no-cache bash aws-cli openssl
                  exec /scripts/backup-db-with-minio.sh full
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_USER
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_DB
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_DB
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: POSTGRES_USER
                - name: PGHOST
                  value: "postgres-service"
                - name: PGPORT
                  value: "5432"
                - name: BACKUP_KEY
                  valueFrom:
                    secretKeyRef:
                      name: app-secrets
                      key: BACKUP_KEY
                - name: BACKUP_DIR
                  value: "/backups"
                - name: PROMETHEUS_TEXTFILE_DIR
                  value: "/tmp/metrics"
                - name: S3_ENDPOINT
                  value: "http://minio.minio.svc.cluster.local:9000"
                - name: S3_BUCKET
                  value: "postgres-backups"
                - name: S3_WAL_BUCKET
                  value: "postgres-wal-archive"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-user
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: root-password
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                # apk installs files as root and chowns them; dropping every
                # capability makes the install fail with EPERM.
                capabilities:
                  add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
          restartPolicy: Never
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 0755
