apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: db-migrations
    files:
      - V1__full_schema.sql=V1__full_schema.sql
    options:
      disableNameSuffixHash: true

resources:
  - backup-scripts-configmap.yaml
  # One-shot Jobs are run explicitly by CI so migrations and setup stay sequential.
  - postgres-backup-cronjob.yaml
  - postgres-backup-pvc.yaml
  - postgres-wal-archive-cronjob.yaml
  - update-modsecurity-crs.yaml
