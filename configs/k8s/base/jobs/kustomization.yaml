apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: db-migrations
    files:
      - V1__full_schema.sql=../../../../db/migrations/V1__full_schema.sql
    options:
      disableNameSuffixHash: true

resources:
  - backup-scripts-configmap.yaml
  - create-open-wearables-db.yaml
  - migrate-db.yaml
  - postgres-backup-cronjob.yaml
  - postgres-backup-pvc.yaml
  - postgres-wal-archive-cronjob.yaml
  - seed-admin.yaml
  - update-modsecurity-crs.yaml
