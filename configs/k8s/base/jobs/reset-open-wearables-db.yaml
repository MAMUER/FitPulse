apiVersion: batch/v1
kind: Job
metadata:
  name: reset-open-wearables-db
  namespace: fitness-platform-production
  labels:
    app: reset-open-wearables-db
    zone: app-zone
    app.kubernetes.io/name: reset-open-wearables-db
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  template:
    metadata:
      labels:
        app: reset-open-wearables-db
        zone: app-zone
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
      containers:
        - name: reset-db
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: docker.io/library/postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              export PGPASSWORD=$(cat /etc/secrets/POSTGRES_PASSWORD)
              export PGCONNECT_TIMEOUT=5
              DB_USER=$(cat /etc/secrets/POSTGRES_USER)
              # This job starts right after the app deployments were restarted,
              # so postgres-service can transiently refuse connections (pod not
              # yet admitted by the network policy / endpoint propagation).
              # Retry instead of burning the job's backoff limit on the first
              # "Connection refused".
              attempt=0
              until psql -h postgres-service -U "$DB_USER" -d postgres -tAc "SELECT 1" >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "postgres-service is not accepting connections after ${attempt} attempts" >&2
                  exit 1
                fi
                echo "Waiting for postgres-service (attempt ${attempt}/60)..."
                sleep 2
              done
              # Alembic in the pinned backend image cannot resolve the revision
              # stored in alembic_version when the database was migrated by a
              # newer upstream build, so the backend crash-loops. Dropping the
              # database makes alembic rebuild the schema from the image.
              # WARNING: this deletes all Open Wearables data.
              psql -h postgres-service -U "$DB_USER" -d postgres \
                -c "DROP DATABASE IF EXISTS open_wearables WITH (FORCE)"
              echo "Database open_wearables dropped"
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
  backoffLimit: 3
