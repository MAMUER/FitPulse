apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-to-logstash
  namespace: elk
  labels:
    app: fluent-bit
    component: logging
spec:
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: logstash
      ports:
        - protocol: TCP
          port: 5044
  podSelector:
    matchLabels:
      app: fluent-bit
