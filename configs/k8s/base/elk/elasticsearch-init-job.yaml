apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: elk
  labels:
    app: elasticsearch
    component: logging
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch-init
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              ES_URL="http://elasticsearch:9200"

              echo "Waiting for Elasticsearch to be ready..."
              for attempt in {1..60}; do
                if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
                  -u "elastic:${ELASTIC_PASSWORD}" "${ES_URL}/_cluster/health" |
                  grep -Eq '"status":"(green|yellow)"'; then
                  break
                fi
                if [[ "$attempt" -eq 60 ]]; then
                  echo "Elasticsearch did not become ready after 5 minutes" >&2
                  exit 1
                fi
                echo "Waiting for Elasticsearch..."
                sleep 5
              done

              json_escape() {
                local value="$1"
                value="${value//\\/\\\\}"
                value="${value//\"/\\\"}"
                value="${value//$'\n'/\\n}"
                value="${value//$'\r'/\\r}"
                value="${value//$'\t'/\\t}"
                printf '%s' "$value"
              }

              echo "Applying ILM policy..."
              curl --fail --silent --show-error -X PUT "${ES_URL}/_ilm/policy/fitpulse-logs-policy" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d @/tmp/ilm-policy.json

              echo "Applying index template..."
              curl --fail --silent --show-error -X PUT "${ES_URL}/_index_template/fitpulse-logs-template" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d @/tmp/index-template.json

              echo "Creating roles..."
              curl --fail --silent --show-error -X PUT "${ES_URL}/_security/role/platform-team" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "indices": [
                    {
                      "names": ["fitpulse-logs-*"],
                      "privileges": ["read", "write", "create_index"]
                    }
                  ]
                }'

              curl --fail --silent --show-error -X PUT "${ES_URL}/_security/role/auditor" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "indices": [
                    {
                      "names": ["fitpulse-logs-*"],
                      "privileges": ["read"]
                    }
                  ]
                }'

              echo "Creating users..."
              platform_team_password="$(json_escape "$PLATFORM_TEAM_PASSWORD")"
              curl --fail --silent --show-error -X PUT "${ES_URL}/_security/user/platform-team" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"password\": \"${platform_team_password}\",
                  \"roles\": [\"platform-team\"],
                  \"full_name\": \"Platform Team\"
                }"

              auditor_password="$(json_escape "$AUDITOR_PASSWORD")"
              curl --fail --silent --show-error -X PUT "${ES_URL}/_security/user/auditor" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"password\": \"${auditor_password}\",
                  \"roles\": [\"auditor\"],
                  \"full_name\": \"Auditor\"
                }"

              echo "Elasticsearch initialization completed successfully"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: elasticsearch-password
            - name: PLATFORM_TEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: platform-team-password
            - name: AUDITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: auditor-password
          volumeMounts:
            - name: ilm-policy
              mountPath: /tmp/ilm-policy.json
              subPath: ilm-policy.json
            - name: index-template
              mountPath: /tmp/index-template.json
              subPath: index-template.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
      restartPolicy: Never
      volumes:
        - name: ilm-policy
          configMap:
            name: elasticsearch-config
        - name: index-template
          configMap:
            name: elasticsearch-config
