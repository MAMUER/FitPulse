apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-init
  namespace: elk
  labels:
    app: elasticsearch
    component: logging
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: elasticsearch-init
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              
              ES_URL="http://elasticsearch:9200"
              ELASTIC_PASSWORD="$${ELASTIC_PASSWORD}"
              
              echo "Waiting for Elasticsearch to be ready..."
              until curl -s -u "elastic:$${ELASTIC_PASSWORD}" "$${ES_URL}/_cluster/health" | grep -E '"status":"(green|yellow)"' >/dev/null 2>&1; do
                echo "Waiting for Elasticsearch..."
                sleep 5
              done
              
              echo "Applying ILM policy..."
              curl -X PUT "$${ES_URL}/_ilm/policy/fitpulse-logs-policy" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d @/tmp/ilm-policy.json
              
              echo "Applying index template..."
              curl -X PUT "$${ES_URL}/_index_template/fitpulse-logs-template" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d @/tmp/index-template.json
              
              echo "Creating roles..."
              curl -X POST "$${ES_URL}/_security/role/platform-team" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "indices": [
                    {
                      "names": ["fitpulse-logs-*"],
                      "privileges": ["read", "write", "create_index"]
                    }
                  ]
                }'
              
              curl -X POST "$${ES_URL}/_security/role/auditor" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "indices": [
                    {
                      "names": ["fitpulse-logs-*"],
                      "privileges": ["read"]
                    }
                  ]
                }'
              
              echo "Creating users..."
              curl -X POST "$${ES_URL}/_security/user/platform-team" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "password": "$${PLATFORM_TEAM_PASSWORD}",
                  "roles": ["platform-team"],
                  "full_name": "Platform Team"
                }'
              
              curl -X POST "$${ES_URL}/_security/user/auditor" \
                -u "elastic:$${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -d '{
                  "password": "$${AUDITOR_PASSWORD}",
                  "roles": ["auditor"],
                  "full_name": "Auditor"
                }'
              
              echo "Elasticsearch initialization completed successfully"
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elk-credentials
                  key: elasticsearch-password
            - name: PLATFORM_TEAM_PASSWORD
              value: "changeme-platform"
            - name: AUDITOR_PASSWORD
              value: "changeme-auditor"
          volumeMounts:
            - name: ilm-policy
              mountPath: /tmp/ilm-policy.json
              subPath: ilm-policy.json
            - name: index-template
              mountPath: /tmp/index-template.json
              subPath: index-template.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      restartPolicy: Never
      volumes:
        - name: ilm-policy
          configMap:
            name: elasticsearch-config
        - name: index-template
          configMap:
            name: elasticsearch-config
