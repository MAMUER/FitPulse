apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-rabbitmq
  namespace: fitness-platform-production
  labels:
    app: rabbitmq
    tier: monitoring
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Prometheus runs in the monitoring namespace, so select it by namespace:
        # a bare podSelector only matches pods in this namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 15692