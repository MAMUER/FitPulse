apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-ingress
  namespace: fitness-platform-production
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002

    # Prometheus lives in the monitoring namespace and scrapes /metrics from the
    # backend pods. A plain podSelector would only match same-namespace pods, so
    # the source has to be selected by namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9091
        - protocol: TCP
          port: 9092
