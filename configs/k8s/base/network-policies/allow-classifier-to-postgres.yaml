apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-classifier-to-postgres
  namespace: fitness-platform-production
spec:
  podSelector:
    matchLabels:
      app: classifier
  policyTypes:
    - Egress
  egress:
    # Персональные дельты Delta_u хранятся в PostgreSQL и переживают рестарт.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53