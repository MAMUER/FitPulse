apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ml-generator-egress
  namespace: fitness-platform-production
spec:
  podSelector:
    matchLabels:
      app: ml-generator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - protocol: TCP
          port: 5671
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
