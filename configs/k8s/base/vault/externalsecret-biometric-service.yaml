apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: biometric-service-db-credentials
  namespace: fitness-platform-production
  labels:
    app: biometric-service
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: biometric-service-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: database/creds/biometric-service-role
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: database/creds/biometric-service-role
        property: password
