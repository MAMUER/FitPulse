apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-bot
  namespace: monitoring
  labels:
    app: oncall-bot
    component: oncall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oncall-bot
  template:
    metadata:
      labels:
        app: oncall-bot
        component: oncall
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: oncall-bot
          image: oncall-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oncall-bot-credentials
                  key: telegram-bot-token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: oncall-bot-credentials
                  key: telegram-chat-id
            - name: ALERTMANAGER_URL
              value: "http://alertmanager.monitoring.svc.cluster.local:9093"
          volumeMounts:
            - name: oncall-config
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: oncall-config
          configMap:
            name: oncall-schedule
