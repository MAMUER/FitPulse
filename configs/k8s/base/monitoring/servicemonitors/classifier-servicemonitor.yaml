apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: classifier
  namespace: fitness-platform-production
  labels:
    app: classifier
    tier: ml
spec:
  selector:
    matchLabels:
      app: classifier
  namespaceSelector:
    matchNames:
      - fitness-platform-production
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
