apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: training-service
  namespace: fitness-platform-production
  labels:
    app: training-service
    tier: backend
spec:
  selector:
    matchLabels:
      app: training-service
  namespaceSelector:
    matchNames:
      - fitness-platform-production
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
