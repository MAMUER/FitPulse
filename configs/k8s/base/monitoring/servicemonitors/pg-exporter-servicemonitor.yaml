apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pg-exporter
  namespace: fitness-platform-production
  labels:
    app: pg-exporter
spec:
  selector:
    matchLabels:
      app: pg-exporter
  namespaceSelector:
    matchNames:
      - fitness-platform-production
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
