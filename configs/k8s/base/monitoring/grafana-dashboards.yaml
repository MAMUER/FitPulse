apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "fitpulse"
        folder: "FitPulse"
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards/json
  slo-overview.json: |
    {
      "dashboard": {
        "title": "SLO Overview",
        "tags": ["slo", "fittpulse"],
        "timezone": "utc",
        "panels": [
          {
            "id": 1,
            "title": "Error Budget Remaining",
            "type": "gauge",
            "targets": [
              {
                "expr": "job:slo_error_budget_remaining",
                "legendFormat": "{{ job }}"
              }
            ],
            "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 }
          },
          {
            "id": 2,
            "title": "Burn Rate (5m)",
            "type": "graph",
            "targets": [
              {
                "expr": "job:slo_burn_rate_5m",
                "legendFormat": "{{ job }}"
              }
            ],
            "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 }
          },
          {
            "id": 3,
            "title": "P95 Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{ job }}"
              }
            ],
            "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 }
          },
          {
            "id": 4,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(error_total[5m]) / rate(request_total[5m])",
                "legendFormat": "{{ job }}"
              }
            ],
            "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 }
          }
        ]
      }
    }
