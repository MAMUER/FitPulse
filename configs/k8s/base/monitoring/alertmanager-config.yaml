apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
    component: config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: "${SLACK_API_URL}"

    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "telegram-notifications"
      routes:
        - match:
            severity: critical
          receiver: "telegram-notifications"
          continue: true
        - match:
            severity: warning
          receiver: "telegram-notifications"

    receivers:
      - name: "telegram-notifications"
        telegram_configs:
          - chat_id: ${TELEGRAM_CHAT_ID}
            bot_token: ${TELEGRAM_BOT_TOKEN}
            parse_mode: "HTML"
            message: |
              <b>{{ .GroupLabels.alertname }}</b>
              {{ range .Alerts }}
                <b>Severity:</b> {{ .Labels.severity }}
                <b>Summary:</b> {{ .Annotations.summary }}
                <b>Description:</b> {{ .Annotations.description }}
                <b>Starts At:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
              {{ end }}

      - name: "slack-notifications"
        slack_configs:
          - channel: "#alerts"
            api_url: "${SLACK_API_URL}"
            send_resolved: true
            title: "{{ .GroupLabels.alertname }}"
            text: |
              {{ range .Alerts }}
                *Severity:* {{ .Labels.severity }}
                *Summary:* {{ .Annotations.summary }}
                *Description:* {{ .Annotations.description }}
              {{ end }}

      - name: "pagerduty-notifications"
        pagerduty_configs:
          - service_key: "${PAGERDUTY_SERVICE_KEY}"
            severity: critical
            description: "{{ .GroupLabels.alertname }}"

      - name: "grafana-oncall-notifications"
        webhook_configs:
          - url: "${GRAFANA_ONCALL_WEBHOOK_URL}"
            send_resolved: true
            http_config:
              basic_auth:
                username: "${GRAFANA_ONCALL_USERNAME}"
                password: "${GRAFANA_ONCALL_PASSWORD}"

    inhibit_rules:
      - source_match:
          severity: "critical"
        target_match:
          severity: "warning"
        equal: ["alertname", "namespace", "service"]
