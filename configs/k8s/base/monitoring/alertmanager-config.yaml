apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
    component: config
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: ""

    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "telegram-notifications"
      routes:
        - match:
            severity: critical
          receiver: "telegram-notifications"
          continue: true
        - match:
            severity: warning
          receiver: "telegram-notifications"

    receivers:
      - name: "telegram-notifications"
        telegram_configs:
          - chat_id: ${TELEGRAM_CHAT_ID}
            bot_token: ${TELEGRAM_BOT_TOKEN}
            parse_mode: "HTML"
            message: |
              <b>{{ .GroupLabels.alertname }}</b>
              {{ range .Alerts }}
                <b>Severity:</b> {{ .Labels.severity }}
                <b>Summary:</b> {{ .Annotations.summary }}
                <b>Description:</b> {{ .Annotations.description }}
                <b>Starts At:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
              {{ end }}

    inhibit_rules:
      - source_match:
          severity: "critical"
        target_match:
          severity: "warning"
        equal: ["alertname", "namespace", "service"]
