apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
    component: config
data:
  # Alertmanager does not expand environment variables inside its config file,
  # so credentials must not be written as ${VAR} placeholders here: a literal
  # ${TELEGRAM_CHAT_ID} fails config validation and crash-loops the container.
  # Routing goes to oncall-bot, which owns the Telegram credentials and exposes
  # /webhook/alertmanager.
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ["alertname", "namespace", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "oncall-bot"

    receivers:
      - name: "oncall-bot"
        webhook_configs:
          - url: "http://oncall-bot.monitoring.svc.cluster.local:8000/webhook/alertmanager"
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - 'severity="critical"'
        target_matchers:
          - 'severity="warning"'
        equal: ["alertname", "namespace", "service"]