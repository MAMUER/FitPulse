apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: fitness-platform-production
type: Opaque
stringData:
  rabbitmq.conf: |
    # Credentials are provided via RABBITMQ_DEFAULT_USER_FILE and RABBITMQ_DEFAULT_PASS_FILE
    # Disable deprecated metrics collection in management API (RabbitMQ 4.x).
    # Native metrics are scraped from rabbitmq_prometheus plugin on :15692.
    management_metrics_collection = false