apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: training-service-pdb
  namespace: fitness-platform-production
  labels:
    app: training-service
    tier: backend
    environment: production
    app.kubernetes.io/name: training-service
    app.kubernetes.io/instance: training-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: training-service
      tier: backend
