apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: data-processor-pdb
  namespace: fitness-platform-production
  labels:
    app: data-processor
    tier: backend
    environment: production
    app.kubernetes.io/name: data-processor
    app.kubernetes.io/instance: data-processor
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: data-processor
      tier: backend
