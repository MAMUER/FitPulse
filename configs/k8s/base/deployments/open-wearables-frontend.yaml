apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-wearables-frontend
  namespace: fitness-platform-production
  labels:
    app: open-wearables-frontend
    tier: frontend
    environment: production
    app.kubernetes.io/name: open-wearables-frontend
    app.kubernetes.io/instance: open-wearables-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: open-wearables-frontend
  template:
    metadata:
      labels:
        app: open-wearables-frontend
        zone: dmz
        environment: production
        app.kubernetes.io/name: open-wearables-frontend
        app.kubernetes.io/instance: open-wearables-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: open-wearables-frontend
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # checkov:skip=CKV_K8S_43: CI-built image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/open-wearables-frontend:0.0.0-dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: VITE_API_URL
              value: "/ow-api"
          # The Vite/Node server accepts connections before it can answer an
          # HTTP probe reliably; an HTTP probe here kept the pod unready and
          # eventually tripped liveness. A TCP probe verifies the listener.
          # Bun + SvelteKit adapter-node needs noticeably longer than a Go
          # service to bind :3000, and the previous 50m CPU limit stretched that
          # past the liveness budget (30s + 3x15s), so the kubelet killed the
          # container before it ever listened (exit 137, reason "Error", empty
          # logs). The startup probe gates liveness instead of racing it.
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            # Bun + SvelteKit needs more headroom than the previous 64Mi/50m:
            # at that size the cold start exceeded the probe budget.
            requests:
              cpu: "100m"
              memory: "96Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
              ephemeral-storage: "200Mi"
