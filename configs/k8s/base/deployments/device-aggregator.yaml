apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-aggregator
  namespace: fitness-platform-production
  labels:
    app: device-aggregator
    tier: backend
    environment: production
    app.kubernetes.io/name: device-aggregator
    app.kubernetes.io/instance: device-aggregator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 2
  selector:
    matchLabels:
      app: device-aggregator
  template:
    metadata:
      labels:
        app: device-aggregator
        zone: dmz
        environment: production
        app.kubernetes.io/name: device-aggregator
        app.kubernetes.io/instance: device-aggregator
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: device-aggregator
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: device-aggregator-sa
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: RABBITMQ_URL
                path: RABBITMQ_URL
              - key: VALKEY_PASSWORD
                path: VALKEY_PASSWORD
      containers:
        - name: device-aggregator
          # checkov:skip=CKV_K8S_43: CI-built image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/device-aggregator:0.0.0-dev
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9093
              name: metrics
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          env:
            - name: DEVICE_AGGREGATOR_PORT
              value: "8083"
            - name: DEVICE_AGGREGATOR_METRICS_PORT
              value: "9093"
            - name: RABBITMQ_URL_FILE
              value: "/etc/secrets/RABBITMQ_URL"
            - name: VALKEY_ADDR
              value: "valkey:6379"
            - name: VALKEY_PASSWORD_FILE
              value: "/etc/secrets/VALKEY_PASSWORD"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "15m"
              memory: "32Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "200Mi"
