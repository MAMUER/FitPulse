apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-aggregator
  namespace: fitness-platform-production
  labels:
    app: device-aggregator
    tier: backend
    environment: production
    app.kubernetes.io/name: device-aggregator
    app.kubernetes.io/instance: device-aggregator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: device-aggregator
  template:
    metadata:
      labels:
        app: device-aggregator
        zone: app-zone
        environment: production
        app.kubernetes.io/name: device-aggregator
        app.kubernetes.io/instance: device-aggregator
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: device-aggregator-sa
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: POSTGRES_USER
                path: POSTGRES_USER
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
              - key: POSTGRES_DB
                path: POSTGRES_DB
              - key: DEVICE_TOKEN_ENCRYPTION_KEY
                path: DEVICE_TOKEN_ENCRYPTION_KEY
              - key: FITBIT_CLIENT_ID
                path: FITBIT_CLIENT_ID
              - key: FITBIT_CLIENT_SECRET
                path: FITBIT_CLIENT_SECRET
              - key: WITHINGS_CLIENT_ID
                path: WITHINGS_CLIENT_ID
              - key: WITHINGS_CLIENT_SECRET
                path: WITHINGS_CLIENT_SECRET
              - key: WITHINGS_CALLBACK_URL
                path: WITHINGS_CALLBACK_URL
        - name: grpc-tls
          secret:
            secretName: app-secrets
            items:
              - key: GRPC_TLS_CERT
                path: tls.crt
              - key: GRPC_TLS_KEY
                path: tls.key
              - key: GRPC_TLS_CA_CERT
                path: ca.crt
              - key: GRPC_TLS_CLIENT_CERT
                path: client.crt
              - key: GRPC_TLS_CLIENT_KEY
                path: client.key
      containers:
        - name: device-aggregator
          image: ghcr.io/mamuer/project/device-aggregator:${{ steps.sha.outputs.short_sha }}
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8083
              name: http
            - containerPort: 9093
              name: metrics
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: grpc-tls
              mountPath: /etc/grpc-tls
              readOnly: true
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: POSTGRES_USER_FILE
              value: "/etc/secrets/POSTGRES_USER"
            - name: POSTGRES_PASSWORD_FILE
              value: "/etc/secrets/POSTGRES_PASSWORD"
            - name: POSTGRES_DB_FILE
              value: "/etc/secrets/POSTGRES_DB"
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_SSLMODE
            - name: DEVICE_TOKEN_ENCRYPTION_KEY_FILE
              value: "/etc/secrets/DEVICE_TOKEN_ENCRYPTION_KEY"
            - name: FITBIT_CLIENT_ID_FILE
              value: "/etc/secrets/FITBIT_CLIENT_ID"
            - name: FITBIT_CLIENT_SECRET_FILE
              value: "/etc/secrets/FITBIT_CLIENT_SECRET"
            - name: WITHINGS_CLIENT_ID_FILE
              value: "/etc/secrets/WITHINGS_CLIENT_ID"
            - name: WITHINGS_CLIENT_SECRET_FILE
              value: "/etc/secrets/WITHINGS_CLIENT_SECRET"
            - name: WITHINGS_CALLBACK_URL_FILE
              value: "/etc/secrets/WITHINGS_CALLBACK_URL"
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "15m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "48Mi"
