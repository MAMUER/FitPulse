apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-generator-pdb
  namespace: fitness-platform-production
  labels:
    app: ml-generator
    tier: ml
    environment: production
    app.kubernetes.io/name: ml-generator
    app.kubernetes.io/instance: ml-generator
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-generator
      tier: ml
