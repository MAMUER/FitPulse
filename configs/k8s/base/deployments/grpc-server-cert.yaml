apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grpc-server-cert
  namespace: fitness-platform-production
spec:
  secretName: grpc-server-tls
  duration: 8760h # 1 год
  renewBefore: 720h # 30 дней
  issuerRef:
    name: grpc-selfsigned-ca
    kind: ClusterIssuer
  commonName: "*.fitness-platform-production.svc.cluster.local"
  dnsNames:
    - "*.fitness-platform-production.svc.cluster.local"
    - "fitness-platform-production.svc.cluster.local"
    - "localhost"
    - "user-service"
    - "biometric-service"
    - "training-service"
  privateKey:
    algorithm: RSA
    size: 2048
