apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-generator
  namespace: fitness-platform-production
  labels:
    app: ml-generator
    tier: ml
    environment: production
    app.kubernetes.io/name: ml-generator
    app.kubernetes.io/instance: ml-generator
    app.kubernetes.io/component: ml
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 2
  selector:
    matchLabels:
      app: ml-generator
  template:
    metadata:
      labels:
        app: ml-generator
        zone: app-zone
        environment: production
        app.kubernetes.io/name: ml-generator
        app.kubernetes.io/instance: ml-generator
        app.kubernetes.io/component: ml
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ml-generator
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: ml-generator-sa
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      containers:
        - name: ml-generator
          # checkov:skip=CKV_K8S_43: CI-built image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/ml-generator:0.0.0-dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8002
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: GAN_SERVICE_PORT
              value: "8002"
            - name: GAN_SERVICE_METRICS_PORT
              value: "9094"
            - name: MPLCONFIGDIR
              value: "/tmp/matplotlib"
            - name: TF_CPP_MIN_LOG_LEVEL
              value: "2"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "ml-generator"
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "150m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
