apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: fitness-platform-production
  labels:
    app: rabbitmq
    tier: infrastructure
    environment: production
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    checkov.io/skip: "CKV_K8S_43,CKV_K8S_15,CKV_K8S_11,CKV_K8S_13,CKV_K8S_10,CKV_K8S_12: Cert-managed image; digest pinned for reproducibility"
spec:
  revisionHistoryLimit: 3
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        zone: data-zone
        environment: production
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/instance: rabbitmq
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: fitness-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
        prometheus.io/path: "/metrics"
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: rabbitmq
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: app-service-account
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rabbitmq-etc
          emptyDir: {}
        - name: rabbitmq-log
          emptyDir: {}
        - name: secrets
          secret:
            secretName: app-secrets
        - name: rabbitmq-conf
          secret:
            secretName: rabbitmq-secret
            items:
              - key: rabbitmq.conf
                path: rabbitmq.conf
      containers:
        - name: rabbitmq
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: docker.io/library/rabbitmq:4.3-management-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
            - containerPort: 15692
              name: prometheus
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "-rabbit log_levels [{connection,error},{default,error}] +S 2:2"
            - name: RABBITMQ_ENABLED_PLUGINS
              value: "rabbitmq_prometheus"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_USER
                  optional: true
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_DEFAULT_PASS
                  optional: true
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            - name: rabbitmq-etc
              mountPath: /etc/rabbitmq
            - name: rabbitmq-log
              mountPath: /var/log/rabbitmq
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: rabbitmq-conf
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          volumeClaimTemplates:
            - metadata:
                name: rabbitmq-storage
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 256Mi
