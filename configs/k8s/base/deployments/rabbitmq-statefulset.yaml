apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: fitness-platform-production
  labels:
    app: rabbitmq
    tier: infrastructure
    environment: production
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # checkov:skip=CKV_K8S_43:Cert-managed image; digest pinned for reproducibility
    # checkov:skip=CKV_K8S_15:imagePullPolicy Always is set on container spec
    # checkov:skip=CKV_K8S_11:CPU limits are set on container resources
    # checkov:skip=CKV_K8S_13:Memory limits are set on container resources
    # checkov:skip=CKV_K8S_10:CPU requests are set on container resources
    # checkov:skip=CKV_K8S_12:Memory requests are set on container resources
spec:
  revisionHistoryLimit: 1
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        zone: data-zone
        environment: production
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/instance: rabbitmq
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: app-service-account
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rabbitmq-tls
          emptyDir: {}
        - name: secrets
          secret:
            secretName: app-secrets
      initContainers:
        - name: generate-rabbitmq-certs
          # sonar:ignore=S6870,S6897: ephemeralStorage requests/limits are set below
          image: alpine:3.24
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /etc/rabbitmq-tls
              openssl genrsa -out ca.key 4096
              openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 -out ca.crt -subj "/CN=rabbitmq-ca"
              openssl genrsa -out server.key 4096
              openssl req -new -key server.key -out server.csr -subj "/CN=rabbitmq"
              openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3650 -sha256
              chmod 600 server.key ca.key
              chmod 644 server.crt ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeralStorage: "64Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeralStorage: "128Mi"
          volumeMounts:
            - name: rabbitmq-tls
              mountPath: /etc/rabbitmq-tls
      containers:
        - name: rabbitmq
          # sonar:ignore=S6870,S6897: ephemeralStorage requests/limits are set below
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: rabbitmq:4.3-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
          imagePullPolicy: Always
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 5671
              name: amqps
            - containerPort: 15672
              name: management
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RABBITMQ_DEFAULT_USER_FILE
              value: "/etc/secrets/RABBITMQ_USER"
            - name: RABBITMQ_DEFAULT_PASS_FILE
              value: "/etc/secrets/RABBITMQ_PASS"
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "-rabbit log_levels [{connection,error},{default,error}] +S 2:2"
            - name: RABBITMQ_SSL_CERT_FILE
              value: "/etc/rabbitmq-tls/server.crt"
            - name: RABBITMQ_SSL_KEY_FILE
              value: "/etc/rabbitmq-tls/server.key"
            - name: RABBITMQ_SSL_CACERT_FILE
              value: "/etc/rabbitmq-tls/ca.crt"
            - name: RABBITMQ_SSL_VERIFY
              value: "verify_peer"
            - name: RABBITMQ_SSL_FAIL_IF_NO_PEER_CERT
              value: "false"
            - name: RABBITMQ_LISTeners_SSL_DEFAULT
              value: "5671"
            - name: RABBITMQ_LISTeners_TCP_DEFAULT
              value: "127.0.0.1:5672"
          volumeMounts:
            - name: rabbitmq-storage
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            - name: rabbitmq-tls
              mountPath: /etc/rabbitmq-tls
              readOnly: true
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeralStorage: "256Mi"
            limits:
              cpu: "100m"
              memory: "192Mi"
              ephemeralStorage: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 256Mi
