apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fitness-platform-production
  labels:
    app: gateway
    tier: frontend
    environment: production
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        zone: dmz
        environment: production
        app.kubernetes.io/name: gateway
        app.kubernetes.io/instance: gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: gateway
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: gateway-sa
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: JWT_PRIVATE_KEY_PEM
                path: JWT_PRIVATE_KEY_PEM
              - key: JWT_PUBLIC_KEY_PEM
                path: JWT_PUBLIC_KEY_PEM
              - key: RABBITMQ_URL
                path: RABBITMQ_URL
              - key: VALKEY_PASSWORD
                path: VALKEY_PASSWORD
              - key: SMTP_HOST
                path: SMTP_HOST
                optional: true
              - key: SMTP_PORT
                path: SMTP_PORT
                optional: true
              - key: SMTP_USER
                path: SMTP_USER
                optional: true
              - key: SMTP_PASSWORD
                path: SMTP_PASSWORD
                optional: true
              - key: SMTP_FROM
                path: SMTP_FROM
                optional: true
              - key: YANDEX_CLIENT_ID
                path: YANDEX_CLIENT_ID
                optional: true
              - key: YANDEX_CLIENT_SECRET
                path: YANDEX_CLIENT_SECRET
                optional: true
              - key: YANDEX_REDIRECT_URL
                path: YANDEX_REDIRECT_URL
                optional: true
        - name: grpc-tls
          secret:
            secretName: grpc-server-tls
      containers:
        - name: gateway
          # checkov:skip=CKV_K8S_43: CI-built image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/gateway:0.0.0-dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: grpc-tls
              mountPath: /etc/grpc-tls
              readOnly: true
          env:
            - name: USER_SERVICE_ADDR
              value: "user-service:50051"
            - name: BIOMETRIC_SERVICE_ADDR
              value: "biometric-service:50052"
            - name: TRAINING_SERVICE_ADDR
              value: "training-service:50053"
            - name: VALKEY_ADDR
              value: "valkey:6379"
            - name: VALKEY_PASSWORD_FILE
              value: "/etc/secrets/VALKEY_PASSWORD"
            - name: ML_ASYNC
              value: "false"
            - name: RABBITMQ_URL_FILE
              value: "/etc/secrets/RABBITMQ_URL"
            - name: SMTP_HOST_FILE
              value: "/etc/secrets/SMTP_HOST"
            - name: SMTP_PORT_FILE
              value: "/etc/secrets/SMTP_PORT"
            - name: SMTP_USER_FILE
              value: "/etc/secrets/SMTP_USER"
            - name: SMTP_PASSWORD_FILE
              value: "/etc/secrets/SMTP_PASSWORD"
            - name: SMTP_FROM_FILE
              value: "/etc/secrets/SMTP_FROM"
            - name: JWT_PRIVATE_KEY_PEM_FILE
              value: "/etc/secrets/JWT_PRIVATE_KEY_PEM"
            - name: JWT_PUBLIC_KEY_PEM_FILE
              value: "/etc/secrets/JWT_PUBLIC_KEY_PEM"
            - name: YANDEX_CLIENT_ID_FILE
              value: "/etc/secrets/YANDEX_CLIENT_ID"
            - name: YANDEX_CLIENT_SECRET_FILE
              value: "/etc/secrets/YANDEX_CLIENT_SECRET"
            - name: YANDEX_REDIRECT_URL_FILE
              value: "/etc/secrets/YANDEX_REDIRECT_URL"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "opentelemetry-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "gateway"
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.01"
            - name: CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: captcha-config
                  key: CAPTCHA_PROVIDER
            - name: CLOUDFLARE_TURNSTILE_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: captcha-config
                  key: CLOUDFLARE_TURNSTILE_SITE_KEY
            - name: CLOUDFLARE_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: captcha-secrets
                  key: CLOUDFLARE_TURNSTILE_SECRET_KEY
                  optional: true
            - name: HCAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: captcha-config
                  key: HCAPTCHA_SITE_KEY
            - name: HCAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: captcha-secrets
                  key: HCAPTCHA_SECRET_KEY
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: User-Agent
                  value: kube-probe/1.26
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
              ephemeral-storage: "200Mi"
