apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fitness-platform-production
  labels:
    app: postgres
    tier: database
    environment: production
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/version: "18"
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      tier: database
  template:
    metadata:
      labels:
        app: postgres
        tier: database
        zone: data-zone
        environment: production
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/version: "18"
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: app-service-account
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
        - name: tmp
          emptyDir: {}
        - name: postgres-config
          configMap:
            name: postgres-config
      containers:
        - name: postgres
          # Образ с предустановленным pgsodium (libsodium) для шифрования PII.
          # Заменяет стандартный postgres: образ = postgres + pgsodium extension.
          # checkov:skip=CKV_K8S_43: Custom pgsodium image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/postgres-pgsodium:pg18
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
              name: postgres
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: tmp
              mountPath: /var/run/postgresql
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql
              readOnly: true
            - name: postgres-wal-archive
              mountPath: /var/lib/postgresql/wal-archive
          env:
            - name: POSTGRES_USER_FILE
              value: "/etc/secrets/POSTGRES_USER"
            - name: POSTGRES_PASSWORD_FILE
              value: "/etc/secrets/POSTGRES_PASSWORD"
            - name: POSTGRES_DB_FILE
              value: "/etc/secrets/POSTGRES_DB"
            - name: POSTGRES_INITDB_ARGS
              value: "--locale=en_US.utf8"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi" # Жесткий лимит для БД
              ephemeral-storage: "512Mi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h "${DB_HOST:-localhost}" -p 5432 -U "${POSTGRES_USER:-postgres}"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h "${DB_HOST:-localhost}" -p 5432 -U "${POSTGRES_USER:-postgres}"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: postgres-wal-archive
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteMany"]
        resources:
          requests:
            storage: 1Gi
