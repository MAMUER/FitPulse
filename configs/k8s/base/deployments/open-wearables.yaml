apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-wearables
  namespace: fitness-platform-production
  labels:
    app: open-wearables
    tier: backend
    environment: production
    app.kubernetes.io/name: open-wearables
    app.kubernetes.io/instance: open-wearables
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: open-wearables
  template:
    metadata:
      labels:
        app: open-wearables
        zone: internal
        environment: production
        app.kubernetes.io/name: open-wearables
        app.kubernetes.io/instance: open-wearables
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fitness-platform
        app.kubernetes.io/managed-by: kustomize
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: open-wearables
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: open-wearables-sa
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: backend
          # checkov:skip=CKV_K8S_43: CI-built image; digest resolved in deployment pipeline
          image: ghcr.io/mamuer/project/open-wearables-backend:0.0.0-dev
          imagePullPolicy: IfNotPresent
          # The upstream image has no CMD/ENTRYPOINT. Without this the
          # container exits immediately with code 0.
          command: ["/bin/bash", "scripts/start/app.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # Upstream settings are plain pydantic fields (case-insensitive), so
            # the generic POSTGRES_*_FILE names used elsewhere in this repo do
            # not work here. DB_* must be provided directly.
            - name: ENVIRONMENT
              value: "production"
            - name: API_PORT
              value: "8000"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OPEN_WEARABLES_SECRET_KEY
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "open_wearables"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: "valkey"
            - name: REDIS_PORT
              value: "6379"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SEED_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SEED_ADMIN_PASSWORD
            - name: API_BASE_URL
              value: "https://fittpulse.duckdns.org"
            - name: FRONTEND_URL
              value: "https://fittpulse.duckdns.org"
            - name: CORS_ORIGINS
              value: '["https://fittpulse.duckdns.org"]'
            # The root filesystem is read-only. Keep uv's cache and Python
            # bytecode out of /root_project.
            - name: PYTHONPYCACHEPREFIX
              value: "/tmp/pycache"
            - name: UV_CACHE_DIR
              value: "/tmp/uv-cache"
            - name: UV_NO_SYNC
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
              ephemeral-storage: "200Mi"
