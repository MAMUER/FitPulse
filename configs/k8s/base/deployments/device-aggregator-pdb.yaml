apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: device-aggregator-pdb
  namespace: fitness-platform-production
  labels:
    app: device-aggregator
    tier: backend
    environment: production
    app.kubernetes.io/name: device-aggregator
    app.kubernetes.io/instance: device-aggregator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fitness-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: device-aggregator
      tier: backend
