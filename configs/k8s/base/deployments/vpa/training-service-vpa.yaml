apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: training-service-vpa
  namespace: fitness-platform-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: training-service
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: training-service
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 1000m
          memory: 512Mi
        controlledResources: ["cpu", "memory"]
