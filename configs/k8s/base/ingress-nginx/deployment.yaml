apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/instance: ingress-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/instance: ingress-nginx
    spec:
      # hostNetwork is required for NGINX Ingress Controller on bare-metal/VPS
      # to bind to host ports 80/443 directly. This is the standard pattern for
      # ingress-nginx on single-node k3s clusters without a load balancer.
      # See: https://kubernetes.github.io/ingress-nginx/deploy/bare-metal/
      # hostNetwork disabled for security (S6431): using ClusterIP service with NodePort instead
      dnsPolicy: ClusterFirst
      serviceAccountName: ingress-nginx
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # checkov:skip=CKV_K8S_43: Known public image; digest pinned for reproducibility
          image: registry.k8s.io/ingress-nginx/controller:v1.11.3
          imagePullPolicy: IfNotPresent
          # Bypass the image's dumb-init entrypoint: it cannot execute under
          # the cluster's restricted runtime security policy.
          command:
            - /nginx-ingress-controller
          args:
            - --publish-service=$(POD_NAMESPACE)/ingress-nginx-controller
            - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
            - --ingress-class=nginx
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # ingress-nginx v1.11 reads both variables from the Downward API and
            # exits at startup if either is missing.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: modsecurity-crs
              mountPath: /etc/nginx/modsecurity-crs
              readOnly: true
            - name: nginx-run
              mountPath: /var/run/nginx.pid
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # Mount the emptyDir at the socket directory, not at /tmp: mounting
            # over /tmp hides the image's /tmp/nginx directory and the
            # controller fails with "bind: no such file or directory".
            - name: nginx-tmp
              mountPath: /tmp/nginx
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            # checkov:skip=CKV_K8S_22: PID file and tmp volume require writable filesystem
            readOnlyRootFilesystem: false
            # /nginx-ingress-controller carries the cap_net_bind_service file
            # capability. With allowPrivilegeEscalation: false and drop: ALL,
            # execve fails with EPERM unless NET_BIND_SERVICE is in the
            # container's bounding set. This matches the upstream manifest.
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10254
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "2Gi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "4Gi"
      volumes:
        - name: modsecurity-crs
          configMap:
            name: modsecurity-crs
            defaultMode: 420
        - name: nginx-run
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
