apiVersion: v1
kind: ResourceQuota
metadata:
  name: fitness-platform-production-quota
  namespace: fitness-platform-production
spec:
  hard:
    requests.cpu: "4000m"
    requests.memory: "8Gi"
    limits.cpu: "12000m"
    limits.memory: "16Gi"
    pods: "100"
    services: "40"
    secrets: "100"
    configmaps: "100"
    persistentvolumeclaims: "40"
