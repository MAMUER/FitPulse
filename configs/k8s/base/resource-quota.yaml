apiVersion: v1
kind: ResourceQuota
metadata:
  name: fitness-platform-production-quota
  namespace: fitness-platform-production
spec:
  hard:
    requests.cpu: "2000m"
    requests.memory: "2Gi"
    limits.cpu: "4000m"
    limits.memory: "4Gi"
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
    persistentvolumeclaims: "20"
