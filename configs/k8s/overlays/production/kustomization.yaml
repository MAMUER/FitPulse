apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ingress-nginx-tls-role.yaml
  - ingress.yaml

patches:
  # Scale monitoring and ELK to 0 in production to free VPS resources
  - target:
      kind: Deployment
      name: prometheus
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: grafana
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: alertmanager
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: jaeger
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: opentelemetry-collector
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: oncall-bot
      namespace: monitoring
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: elasticsearch
      namespace: elk
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: kibana
      namespace: elk
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: logstash
      namespace: elk
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # Note: fluent-bit is a DaemonSet and cannot be scaled to 0 via replicas.
  # To disable it, you would need to either delete the resource or set a nodeSelector that matches no nodes.
  # For now, we leave it as is - it has minimal resource footprint.
  - path: ingress-nginx-watch-namespace-patch.yaml
    target:
      kind: Deployment
      name: ingress-nginx-controller
      namespace: ingress-nginx
  - target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: environment=production
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      labelSelector: environment=production
    patch: |-
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1
images:
  - name: ghcr.io/mamuer/project/user-service
    newTag: latest
  - name: ghcr.io/mamuer/project/biometric-service
    newTag: latest
  - name: ghcr.io/mamuer/project/training-service
    newTag: latest
  - name: ghcr.io/mamuer/project/gateway
    newTag: latest
  - name: ghcr.io/mamuer/project/classifier
    newTag: latest
  - name: ghcr.io/mamuer/project/ml-generator
    newTag: latest
  - name: ghcr.io/mamuer/project/open-wearables-backend
    newTag: latest
  - name: ghcr.io/mamuer/project/open-wearables-frontend
    newTag: latest
  - name: ghcr.io/mamuer/project/device-aggregator
    newTag: latest
  - name: ghcr.io/mamuer/project/data-processor
    newTag: latest
  - name: ghcr.io/mamuer/project/oncall-bot
    newTag: latest
