apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-wearables-ingress
  namespace: fitness-platform-production
  annotations:
    # The backend serves routes under /api/v1 (settings.api_v1). Do not strip
    # the /api prefix: path /api with pathType Prefix forwards /api/v1/... as-is.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fittpulse.duckdns.org
      secretName: openwearables-fittpulse-ru-tls
  rules:
    - host: fittpulse.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: open-wearables
                port:
                  number: 8000
          - path: /(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: open-wearables-frontend
                port:
                  number: 3000
