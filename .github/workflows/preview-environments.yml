name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    if: github.event.action != 'closed'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push preview images
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="pr-${PR_NUMBER}-${SHA}"

          for service in gateway user-service biometric-service training-service classifier device-aggregator data-processor; do
            docker build -t "ghcr.io/mamuer/project/${service}:${IMAGE_TAG}" \
              --build-arg SERVICE_NAME=${service} \
              -f "cmd/${service}/Dockerfile" .
            docker push "ghcr.io/mamuer/project/${service}:${IMAGE_TAG}"
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: "v1.36.0"

      - name: Configure kubeconfig
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          printf '%s' "$KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create preview namespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          NAMESPACE="fitness-platform-preview-${PR_NUMBER}"
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply --validate=false -f -
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GH_ACTOR" \
            --docker-password="$DOCKER_PASSWORD" \
            -n "${NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -

      - name: Deploy to preview namespace
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="pr-${PR_NUMBER}-${SHA}"
          NAMESPACE="fitness-platform-preview-${PR_NUMBER}"

          cd configs/k8s/base
           for svc in gateway user-service biometric-service training-service classifier device-aggregator data-processor; do
            kustomize edit set image "ghcr.io/mamuer/project/$svc=ghcr.io/mamuer/project/$svc:${IMAGE_TAG}" || true
          done

          kustomize build . > /tmp/preview-manifests.yaml
          sed "s/namespace: fitness-platform-production/namespace: ${NAMESPACE}/g" /tmp/preview-manifests.yaml | kubectl apply --validate=false -f -

      - name: Wait for preview deployment
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="fitness-platform-preview-${PR_NUMBER}"
          kubectl wait --for=condition=ready pod -l app=gateway -n "${NAMESPACE}" --timeout=180s || true
          kubectl get pods -n "${NAMESPACE}"

      - name: Comment preview URL on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_NUMBER_REF: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PREVIEW_URL="https://pr-${PR_NUMBER}-fittpulse.duckdns.org"
          gh pr comment "$PR_NUMBER_REF" --repo "$REPO" --body "рџљЂ Preview environment deployed: ${PREVIEW_URL}"

  cleanup:
    name: Cleanup Preview Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event.action == 'closed'
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d
        with:
          version: "v1.36.0"

      - name: Configure kubeconfig
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          printf '%s' "$KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Delete preview namespace
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          NAMESPACE="fitness-platform-preview-${PR_NUMBER}"
          kubectl delete namespace "${NAMESPACE}" --ignore-not-found=true --timeout=60s || true
