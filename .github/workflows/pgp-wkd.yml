name: PGP Key Publication

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pgp-setup.sh'
      - 'scripts/pgp-wkd-setup.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-publish'
        required: false
        default: 'false'

jobs:
  publish-pgp:
    runs-on: ubuntu-latest
    env:
      PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      - name: Import signing key
        run: |
          echo "$PGP_PRIVATE_KEY" | gpg --batch --import
          printf '5\ny\n' | gpg --batch --passphrase-fd 0 --pinentry-mode loopback --edit-key mihnikolaenko12@yandex.ru trust quit

      - name: Export public key
        run: |
          KEY_ID=$(gpg --list-keys --with-colons mihnikolaenko12@yandex.ru | grep '^pub:' | head -1 | cut -d: -f5)
          gpg --armor --export "$KEY_ID" > public-key.asc
          gpg --export "$KEY_ID" > openpgpkey_${KEY_ID:0:40}.asc
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV

      - name: Upload to keys.openpgp.org
        run: gpg --keyserver hkps://keys.openpgp.org --send-keys "${{ env.KEY_ID }}"

      - name: Prepare WKD directory
        run: |
          mkdir -p .well-known/openpgpkey/hu
          cp openpgpkey_${{ env.KEY_ID }}.asc .well-known/openpgpkey/hu/

      - name: Upload WKD to GitHub Pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .well-known/openpgpkey/hu
          destination_dir: .well-known/openpgpkey/hu
          keep_files: true
          enable_jekyll: false
          exclude_assets: '**/*'

      - name: Verify WKD
        run: |
          curl -s "https://${{ github.repository_owner }}.github.io/.well-known/openpgpkey/hu/${{ env.KEY_ID }}.asc" | gpg --dearmor | gpg --list-packets
