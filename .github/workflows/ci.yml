name: CI/CD Pipeline
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/dependabot.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "configs/**"
      - "scripts/**"
      - "models/**"
      - "deployments/**"
      - ".dockerignore"
      - "db/migrations/**"
      - "datasets/**"
      - "*.py"
      - "web/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/dependabot.yml"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "configs/**"
      - "scripts/**"
      - "models/**"
      - "deployments/**"
      - ".dockerignore"
      - "db/migrations/**"
      - "datasets/**"
      - "*.py"
      - "web/**"
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight
    - cron: "0 9 1 * *" # Monthly dependency update
    - cron: "0 9 1 1,4,7,10 *" # Quarterly vulncheck
    - cron: "34 9 * * 3" # CodeQL weekly
    - cron: "16 11 * * 3" # OSV weekly
    - cron: "25 13 * * 1" # Semgrep weekly
    - cron: "0 0 * * 0" # Fuzz tests weekly
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Select execution mode"
        required: false
        type: choice
        options: [full, maintenance, recreate-cluster]
      maintenance_type:
        description: "For maintenance mode: update|audit|vulncheck"
        required: false
        type: choice
        options: [update, audit, vulncheck]
        default: "update"
  release:
    types: [created]
  issues:
    types: [opened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  REGISTRY: ghcr.io
  FITPULSE_DOMAIN: "fittpulse.duckdns.org"

jobs:
  # ============================================================================
  # PHASE 1: INITIALIZATION & DETECTION
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    if: github.event_name != 'release' && github.event_name != 'issues'
    outputs:
      frontend: "true"
      go: "true"
      ci: "true"
      ml: "true"
      docker: "true"
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - '!web/node_modules/**'
              - '!web/dist/**'
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            ci:
              - '.github/workflows/**'
              - '.github/dependabot.yml'
              - 'scripts/**'
              - 'configs/**'
            ml:
              - 'cmd/ml_generator/**'
              - 'cmd/classifier/**'
              - 'models/**'
              - 'datasets/**'
              - '*.py'
            docker:
              - 'Dockerfile*'
              - '**/Dockerfile*'
              - 'docker/**'
              - '.dockerignore'

  validate-workflow:
    name: Validate Workflow Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate workflow syntax
        env:
          # Authenticates the GitHub API fallback used for the actionlint asset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/ci-helpers.sh validate_workflow

  issue-automation:
    name: Issue Automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    if: github.event_name == 'issues'
    steps:
      - name: Add triage label
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage']
            });
      - name: Add component labels
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const body = issue.body || '';
            const labels = [];
            if (body.toLowerCase().includes('fitbit') || body.includes('withings')) labels.push('device-integration');
            if (body.toLowerCase().includes('oauth') || body.includes('auth')) labels.push('authentication');
            if (body.toLowerCase().includes('webhook')) labels.push('webhook');
            if (body.toLowerCase().includes('smtp') || body.includes('email')) labels.push('email-service');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
      - name: Assign based on component
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const body = issue.body || '';
            const title = issue.title.toLowerCase();
            const assignments = {
              'gateway': ['@MAMUER'], 'user service': ['@MAMUER'], 'biometric': ['@MAMUER'],
              'training': ['@MAMUER'], 'device': ['@MAMUER'], 'ml ': ['@MAMUER'],
              'frontend': ['@MAMUER'], 'k8s': ['@MAMUER'], 'docker': ['@MAMUER'], 'ci/cd': ['@MAMUER'],
            };
            for (const [keyword, assignees] of Object.entries(assignments)) {
              if (body.toLowerCase().includes(keyword) || title.includes(keyword)) {
                for (const assignee of assignees) {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    assignees: [assignee.replace('@', '')]
                  });
                }
                break;
              }
            }
      - name: Welcome new contributors
        if: github.event.action == 'opened'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const author = issue.user.login;
            const isFirst = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              per_page: 1
            }).then(res => res.data.length === 1);
            if (isFirst) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 Привет, @${author}! Спасибо за первое сообщение об ошибке/идею.\nМы проверим ваш репорт в ближайшее время.`
              });
            }
      - name: Security issue handling
        if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'labeled')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const labels = issue.labels.map(l => l.name.toLowerCase());
            const isSecurity = labels.includes('security') || labels.includes('vulnerability') ||
                                issue.title.toLowerCase().includes('security') || issue.title.toLowerCase().includes('vulnerability');
            if (isSecurity) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['security']
              });
            }
      - name: Notify Telegram on critical
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          ISSUE_HTML_URL: "${{ github.event.issue.html_url }}"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/ci/ci-helpers.sh send_telegram

  # ============================================================================
  # PHASE 2: PARALLEL LINTING & STATIC ANALYSIS
  # ============================================================================
  frontend:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: [detect-changes]
    if: ${{ always() && needs.detect-changes.outputs.frontend == 'true' }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Run frontend tests
        run: npm run test
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web

  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes]
    if: ${{ always() && needs.detect-changes.outputs.docker == 'true' }}
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Hadolint on all Dockerfiles
        run: bash scripts/ci/ci-helpers.sh run_hadolint

  go-check:
    name: Go Check (Lint + Vet + Format)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [validate-workflow, detect-changes] # УБРАНА зависимость от dockerfile-lint для параллельности
    timeout-minutes: 20
    if: needs.detect-changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golangci-lint
        run: bash scripts/ci/ci-helpers.sh install_golangci_lint
      - name: Tidy Go modules
        run: make tidy
      - name: Format Go code
        run: make fmt
      - name: Run go vet
        run: make vet
      - name: Update Go imports
        run: make imports
      - name: Run golangci-lint
        run: make lint

  super-linter:
    name: Super Linter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    needs: [validate-workflow]
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854
        env:
          GO_VERSION: 1.27.2
          REGISTRY: ghcr.io
          FITPULSE_DOMAIN: fittpulse.duckdns.org
          PYTHON_BLACK_VERSION: "26.5.1"
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COMMIT_STATUS_ENABLED: false
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: true
          SAVE_SUPER_LINTER_SUMMARY: true
          FILTER_REGEX_EXCLUDE: '(\.github/workflows/.*|.*\.ya?ml$|vendor/.*|bin/.*)'
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_MYPY: true
          VALIDATE_YAML: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_JSON: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JUPYTER: "false"
          PYTHON_MYPY_ARGS: "--config-file .github/linters/pyproject.toml"

  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [validate-workflow]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check conventional commits on main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/ci-helpers.sh check_commits

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}

  kubescape:
    name: Kubescape K8s Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-workflow]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Kubescape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci/security.sh install_kubescape
          kubescape version
      - name: Run Kubescape scan
        run: bash scripts/ci/security.sh run_kubescape
      - name: Upload Kubescape results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        if: always() && hashFiles('sarif-results/kubescape-results.sarif') != ''
        with:
          sarif_file: sarif-results/kubescape-results.sarif
          category: kubescape

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Semgrep
        run: "pip install --prefer-binary --only-binary :all: 'semgrep==1.183.0'"
      - name: Run Semgrep scan
        run: bash scripts/ci/security.sh run_semgrep
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results/semgrep-results.sarif
          category: semgrep

  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run OSV Scanner (Go dependencies)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: -r ./ --config .osv-scanner.toml
      - name: Run OSV Scanner (Python requirements)
        run: bash scripts/ci/security.sh run_osv_python_requirements

  checkov:
    name: Checkov IaC Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-workflow]
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Checkov scan
        run: bash scripts/ci/security.sh run_checkov
      - name: Upload Checkov SARIF
        if: always() && hashFiles('sarif-results/checkov-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results/checkov-results.sarif
          category: checkov

  # ============================================================================
  # PHASE 3: PARALLEL TESTING
  # ============================================================================
  test:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [go-check, detect-changes]
    timeout-minutes: 30
    if: needs.detect-changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          { POSTGRES_PASSWORD: test, POSTGRES_INITDB_ARGS: "--locale=C.UTF-8" }
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Run integration tests
        run: go test -tags integration ./...
      - name: Check coverage threshold
        env:
          COVERAGE_THRESHOLD: "60"
        run: bash scripts/ci/coverage-check.sh

  smoke-test:
    name: Smoke Test (testcontainers-go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [test]
    timeout-minutes: 20
    if: always() && needs.test.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run testcontainers smoke test
        run: bash scripts/ci/test.sh run_smoke_tests

  contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [go-check, detect-changes] # УБРАНА зависимость от test для параллельного запуска
    timeout-minutes: 10
    if: needs.detect-changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build classifier
        run: go build -o /tmp/classifier ./cmd/classifier
      - name: Start classifier
        run: /tmp/classifier &
      - name: Wait for classifier HTTP service
        run: |
          for _ in $(seq 1 30); do
            if curl -s http://localhost:8001/health >/dev/null 2>&1; then
              echo "Classifier HTTP service is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::Classifier did not become ready - its contract test will skip"
      - name: Run contract tests
        run: go test -tags=contract ./internal/contract/...
      - name: Tear down classifier
        if: always()
        run: pkill -f /tmp/classifier || true

  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate-workflow, detect-changes]
    if: ${{ always() && needs.detect-changes.outputs.go == 'true' }}
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run fuzz tests
        run: bash scripts/ci/test.sh run_fuzz_tests

  # ============================================================================
  # PHASE 4: PARALLEL SECURITY SCANS (Разделено для максимального ускорения)
  # ============================================================================
  scan-gosec:
    name: Security Scan (Gosec)
    runs-on: ubuntu-latest
    needs: [validate-workflow, detect-changes]
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true'
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gosec
        run: bash scripts/ci/security.sh install_gosec
      - name: Run gosec SAST scanner
        run: bash scripts/ci/security.sh run_gosec
      - name: Upload gosec results
        if: always() && hashFiles('sarif-results/gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results/gosec.sarif
          category: gosec
          token: ${{ secrets.GITHUB_TOKEN }}

  scan-govulncheck:
    name: Security Scan (Govulncheck)
    runs-on: ubuntu-latest
    needs: [validate-workflow, detect-changes]
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: bash scripts/ci/security.sh install_govulncheck
      - name: Run govulncheck
        run: bash scripts/ci/security.sh run_govulncheck

  scan-trivy-fs:
    name: Security Scan (Trivy FS)
    runs-on: ubuntu-latest
    needs: [validate-workflow, detect-changes]
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # node-canvas is only an *optional* peer dependency of jsdom and is not used
      # by any source file or test, so no Cairo/Pango system libraries are needed.
      # Installing them here made the job hang for ~20 min whenever the Ubuntu
      # mirrors were unreachable (apt has no DNS fallback), so the step was removed.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies for Trivy
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web
      - name: Install Python dependencies for Trivy
        run: bash scripts/ci/ci-helpers.sh install_python_deps
      - name: Create SARIF results directory
        run: mkdir -p sarif-results
      - name: Run Trivy filesystem scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.69.3
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          scan-type: "fs"
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: "true"
          exit-code: "1"
          skip-dirs: "configs/k8s/overlays/production"
          scan-ref: "."
          ignore-unfixed: false
          vuln-type: "os,library"
          format: "sarif"
          output: "sarif-results/trivy-fs.sarif"
          cache-dir: "/home/runner/work/FitPulse/FitPulse/.cache/trivy"
          list-all-pkgs: false
          cache: true
          hide-progress: true
        env:
          TRIVY_SKIP_VERSION_CHECK: true
      - name: Upload Trivy results
        if: always() && hashFiles('sarif-results/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results/trivy-fs.sarif
          category: trivy-fs
          token: ${{ secrets.GITHUB_TOKEN }}

  scan-secrets:
    name: Security Scan (Secrets)
    runs-on: ubuntu-latest
    needs: [validate-workflow, detect-changes]
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install secret scanning tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh install_secret_tools
      - name: Run Gitleaks secret scan
        run: bash scripts/ci/security.sh run_gitleaks
      - name: Upload Gitleaks results
        if: always() && hashFiles('sarif-results/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results/gitleaks.sarif
          category: gitleaks
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run TruffleHog secret scan
        run: bash scripts/ci/security.sh run_trufflehog

  scan-sbom:
    name: Security Scan (SBOM)
    runs-on: ubuntu-latest
    needs: [validate-workflow, detect-changes]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install SBOM tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh install_syft
      - name: Generate SBOM with syft
        run: bash scripts/ci/security.sh generate_sbom
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom/
          retention-days: 7

  security-gate:
    name: Security Gate (Enforce Thresholds)
    runs-on: ubuntu-latest
    needs:
      [scan-gosec, scan-govulncheck, scan-trivy-fs, scan-secrets, scan-sbom]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Security Gate — enforce quality thresholds
        run: bash scripts/ci/security.sh security_gate

  # ============================================================================
  # PHASE 5: ADVANCED ANALYSIS
  # ============================================================================
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: [validate-workflow, detect-changes]
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    if: ${{ always() && (needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.ci == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - run: git config --global init.defaultBranch main
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        if: ${{ matrix.language == 'actions' || needs.detect-changes.outputs.go == 'true' }}
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        if: ${{ matrix.language == 'actions' || needs.detect-changes.outputs.go == 'true' }}
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:${{matrix.language}}"
          output: sarif-results
          upload: failure-only
      - name: Show CodeQL diagnostics
        if: always()
        run: bash scripts/ci/ci-helpers.sh show_codeql_diagnostics
      - name: Upload SARIF
        if: always() && hashFiles('sarif-results/**') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: sarif-results
          category: codeql-${{ matrix.language }}
          wait-for-processing: true

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go-check, super-linter, test] # Оптимизированы зависимости: убран security-scan, добавлен test для coverage
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      # node-canvas is only an *optional* peer dependency of jsdom and is not used
      # by any source file or test, so no Cairo/Pango system libraries are needed.
      # Installing them here made the job hang for ~20 min whenever the Ubuntu
      # mirrors were unreachable (apt has no DNS fallback), so the step was removed.
      - name: Install frontend dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" install_dependencies
        working-directory: web
      - name: Run tests and collect coverage
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ci-helpers.sh" run_coverage
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=mamuer
            -Dsonar.projectKey=fitness-platform
            -Dsonar.sources=cmd,internal,api,web/src
            -Dsonar.tests=cmd,internal,web/src
            -Dsonar.test.inclusions=**/*_test.go,**/*_test.py,**/*.test.jsx,**/*.test.js
            -Dsonar.exclusions=api/gen/**,web/dist/**,web/node_modules/**,mocks/**,**/*_test.go,**/*.test.jsx,**/*.test.js,**/swagger.yaml,**/openapi.yaml,**/*.proto,**/*.pb.go
            -Dsonar.go.coverage.reportPaths=bin/coverage.out
            -Dsonar.python.coverage.reportPaths=bin/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=bin/lcov.info
            -Dsonar.qualitygate.wait=true

  # ============================================================================
  # PHASE 6: BUILD & PROVISION
  # ============================================================================
  binary_build:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [detect-changes, go-check, test, conventional-commits]
    timeout-minutes: 30
    if: needs.detect-changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build Go services (parallel)
        run: bash scripts/ci/build-push.sh build_go_binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binaries
          path: bin/
          retention-days: 1

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    # binary_build is intentionally NOT a dependency: its "binaries" artifact is
    # never downloaded by this job (the Dockerfiles compile Go from source), so
    # waiting for it only added ~2 min of serial time before the longest job.
    needs: [scan-trivy-fs, detect-changes]
    # Go/ML/crs/backup/oncall/open-wearables builds are sequential; a cold
    # BuildKit cache can exceed 60m. Give the job headroom so the Open Wearables
    # frontend is not cancelled mid-build.
    timeout-minutes: 90
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      packages: write
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and push Go services
        run: bash scripts/ci/build-push.sh build_go_services
      - name: Build and push ML images (if models exist)
        run: bash scripts/ci/build-push.sh build_ml_images
      - name: Build and push CRS updater image
        run: bash scripts/ci/build-push.sh build_crs_updater
      - name: Build and push backup tools image
        run: bash scripts/ci/build-push.sh build_backup_tools
      - name: Build and push on-call bot image
        run: bash scripts/ci/build-push.sh build_oncall_bot
      - name: Build and push Open Wearables images
        run: bash scripts/ci/build-push.sh build_open_wearables
      - name: Scan gateway image with Trivy
        id: trivy-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          image-ref: "${{ env.REGISTRY }}/mamuer/project/gateway:${{ steps.sha.outputs.short_sha }}"
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          scanners: "vuln,secret"
        env:
          TRIVY_SKIP_VERSION_CHECK: true
      - name: Upload Trivy image results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: trivy-image.sarif
          category: trivy-docker
      - name: Install cosign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh install_cosign
      - name: Sign Docker images with cosign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ steps.sha.outputs.short_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh sign_images

  provision-k8s-vps:
    name: Provision k3s Cluster on VPS
    runs-on: ubuntu-latest
    needs: [detect-changes]
    timeout-minutes: 120
    if: >-
      always() &&
      (needs.detect-changes.outputs.ci == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]')))
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - name: Configure swap on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_swap
      - name: Configure Elasticsearch vm.max_map_count
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_elasticsearch_sysctl
      - name: Check disk space on VPS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh check_disk_space
      - name: Clean up old k3s
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'recreate-cluster'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh cleanup_old_k3s
      - name: Fix DNS resolv.conf permanently
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh fix_dns
      - name: Ensure local-path provisioner directory exists
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh ensure_local_path_dir
      - name: Prepare k3s config on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh prepare_k3s_config
      - name: Restart k3s if config changed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh restart_k3s_if_needed
      - name: Install k3s on VPS
        env:
          SSH_RETRY_TIMEOUT: 600
          SSH_RETRY_MAX_ATTEMPTS: 5
          SSH_RETRY_DELAY_SECONDS: 15
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh install_k3s
      - name: Preload k3s airgap images (bypasses all containerd network pulls)
        env:
          # Used only by the API-asset fallback if the direct release URL
          # is unavailable; also raises the GitHub API rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh preload_airgap_images
      - name: Preload BusyBox helper image for local-path provisioner
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh preload_busybox_image
      - name: Configure host-level disk encryption for k3s storage (fscrypt/dm-crypt)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh configure_disk_encryption
      - name: Cleanup disk space on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh cleanup_disk
      - name: Clean stale local-path smoke resources
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh cleanup_stale_smoke_resources
      - name: Start and verify k3s
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh start_k3s
      - name: Fix local-path-provisioner RBAC and ensure WaitForFirstConsumer binding mode
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh fix_local_path_rbac
      - name: Wait for critical system pods to be Ready
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/vps-provision.sh wait_for_critical_pods
      - name: Ensure k3s certificates include domain and external IP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh ensure_k3s_certs
      - name: Generate kubeconfig with external domain
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh generate_kubeconfig
      - name: Download kubeconfig artifact
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh download_kubeconfig
      - name: Install cert-manager and configure Let's Encrypt
        env:
          KUBECONFIG: ./k3s-config.yaml
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh install_cert_manager
      - name: Setup ML infrastructure directories
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_ml_dirs
      - name: Deploy MLflow service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_mlflow
      - name: Setup Postgres automated backups
        env:
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh setup_postgres_backups
      - name: Deploy health check script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_health_script
      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kubeconfig
          path: ./k3s-config.yaml
          retention-days: 1

  # ============================================================================
  # PHASE 7: DEPLOYMENT
  # ============================================================================
  deploy-vps:
    name: Deploy Full Stack to VPS
    runs-on: ubuntu-latest
    # binary_build dropped from the gate: deploy only pulls the "kubeconfig"
    # artifact, so Build Binaries runs in parallel instead of blocking the deploy.
    needs: [detect-changes, docker, provision-k8s-vps, test, smoke-test]
    timeout-minutes: 60
    environment:
      name: production
    outputs:
      reachable: ${{ steps.connectivity.outputs.reachable }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Wait for k3s API to be fully ready
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh wait_for_k3s_api
      - name: Check cluster connectivity
        id: connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh check_connectivity
      - name: Create image pull secret for GHCR
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/deploy-production.sh create_image_pull_secret
      - name: Get short SHA
        if: steps.connectivity.outputs.reachable == 'true'
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Ensure service account exists
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh ensure_service_account
      - name: Create production secrets
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          JWT_PRIVATE_KEY_PEM: ${{ secrets.JWT_PRIVATE_KEY_PEM }}
          JWT_PUBLIC_KEY_PEM: ${{ secrets.JWT_PUBLIC_KEY_PEM }}
          OPEN_WEARABLES_WEBHOOK_SECRET: ${{ secrets.OPEN_WEARABLES_WEBHOOK_SECRET }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
          EXTERNAL_SECRETS_DB_PASSWORD: ${{ secrets.EXTERNAL_SECRETS_DB_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          ELASTICSEARCH_PASSWORD: ${{ secrets.ELASTICSEARCH_PASSWORD }}
          ELASTICSEARCH_PLATFORM_PASSWORD: ${{ secrets.ELASTICSEARCH_PLATFORM_PASSWORD }}
          ELASTICSEARCH_AUDITOR_PASSWORD: ${{ secrets.ELASTICSEARCH_AUDITOR_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/ci/deploy-production.sh create_secrets
      - name: Update image tags to SHA
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh update_image_tags
      - name: Pre-pull infrastructure images (docker.io) on runner and import to VPS
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          IMAGES=(
            "docker.io/library/rabbitmq:4.3-management-alpine"
            "docker.io/valkey/valkey:9-alpine"
            "docker.io/library/postgres:18-alpine"
            "registry.k8s.io/ingress-nginx/controller:v1.11.3"
            "docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z"
            "docker.io/grafana/grafana:11.2.0"
          )
          # Ask the VPS once which images it already has: re-uploading ~500 MB of
          # tarballs over a slow link is what made this step run for 20+ minutes.
          present=$(./scripts/ssh-retry.sh ssh "${VPS_USER}@${VPS_HOST}" "sudo k3s ctr -n k8s.io images ls -q" || true)
          for img in "${IMAGES[@]}"; do
            if grep -qxF "$img" <<<"$present"; then
              echo "-> $img already present on VPS, skipping"
              continue
            fi
            echo "-> Pulling $img on runner..."
            docker pull "$img" || { echo "Failed to pull $img, skipping"; continue; }
            safe_name=$(echo "$img" | tr '/:' '_')
            docker save "$img" -o "/tmp/${safe_name}.tar" || { echo "Failed to save $img, skipping"; continue; }
            echo "-> Uploading $img to VPS..."
            ./scripts/ssh-retry.sh scp "/tmp/${safe_name}.tar" "${VPS_USER}@${VPS_HOST}:/tmp/${safe_name}.tar" || { echo "Failed to upload $img, skipping"; continue; }
            echo "-> Importing $img into k3s containerd..."
            ./scripts/ssh-retry.sh ssh "${VPS_USER}@${VPS_HOST}" "sudo k3s ctr -n k8s.io images import /tmp/${safe_name}.tar && sudo rm -f /tmp/${safe_name}.tar" || { echo "Failed to import $img, skipping"; continue; }
            echo "Imported $img"
          done
      - name: Pre-pull application images on VPS
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh pre_pull_images
      - name: Pre-pull public images on VPS (ELK/monitoring)
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh pre_pull_public_images
      - name: Import fluent-bit image via runner
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: bash scripts/ci/deploy-production.sh import_fluent_bit
      - name: Ensure local-path-provisioner is running and StorageClass is ready
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh setup_local_path_provisioner
      - name: Install/upgrade ingress-nginx (replaces Traefik)
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh install_ingress_nginx
      - name: Cleanup Traefik from kube-system (optional)
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/k8s-setup.sh cleanup_traefik
      - name: Apply production overlay with Kustomize
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh apply_manifests
      - name: Restart ELK/monitoring workloads
        if: steps.connectivity.outputs.reachable == 'true'
        run: |
          kubectl -n elk rollout restart statefulset/elasticsearch || true
          kubectl -n elk rollout restart deployment/logstash || true
          kubectl -n elk rollout restart deployment/kibana || true
          kubectl -n monitoring rollout restart deployment/oncall-bot || true
          kubectl -n monitoring rollout restart deployment/opentelemetry-collector || true
          kubectl -n elk rollout restart daemonset/fluent-bit || true
      - name: Wait for RabbitMQ to be ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh wait_for_rabbitmq
      - name: Verify Postgres StatefulSet
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh verify_postgres
      - name: Wait for Postgres PVC to be created and bound
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_pvc
      - name: Wait for Postgres to be ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_postgres
      - name: Run database migrations
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh run_migrations
      - name: Wait for postgres-service to be fully ready
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/verify.sh wait_for_service
      - name: Run seed-admin job
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: bash scripts/ci/deploy-production.sh run_seed_admin
      - name: Restart application deployments
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh restart_app_deployments
      - name: Deploy Open Wearables
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/deploy-production.sh deploy_open_wearables
      - name: Verify production deployment
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh verify_deployment
      - name: Verify ingress TLS certificate
        run: bash scripts/ci/deploy-production.sh verify_tls
      - name: Check service logs and readiness
        if: steps.connectivity.outputs.reachable == 'true'
        run: bash scripts/ci/deploy-production.sh check_logs
      - name: Debug pod status after deploy
        if: always() && steps.connectivity.outputs.reachable == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/deploy-production.sh debug_pod_status

  # ============================================================================
  # PHASE 8: PARALLEL POST-DEPLOYMENT TESTS
  # ============================================================================
  test-e2e:
    name: Test Deployment (E2E API)
    runs-on: ubuntu-latest
    needs: [deploy-vps]
    timeout-minutes: 30
    if: always() && needs.deploy-vps.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kubeconfig
          path: ./kubeconfig
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Prepare target URL
        id: target
        run: bash scripts/ci/ci-helpers.sh prepare_target_url
      - name: Wait for production API health
        env:
          BASE_URL: ${{ steps.target.outputs.target }}
        run: |
          ready=false
          for attempt in {1..6}; do
            response=""
            if response=$(curl -ksS --connect-timeout 5 --max-time 10 \
              -w $'\nHTTP_STATUS:%{http_code}' "${BASE_URL%/}/health" 2>&1); then
              curl_status=0
            else
              curl_status=$?
            fi
            http_status=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p' | tail -1)
            response_body=$(printf '%s\n' "$response" | sed '/^HTTP_STATUS:/d')
            if [[ "$curl_status" -eq 0 && "$http_status" == "200" ]]; then
              echo "Production API health check passed (HTTP 200)"
              ready=true
              break
            fi
            echo "Health attempt $attempt/6 failed (curl=$curl_status, HTTP=${http_status:-unknown}): ${response_body:0:300}"
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Production API did not become healthy at ${BASE_URL%/}/health"
            kubectl get pods -n fitness-platform-production -o wide || true
            kubectl get ingress,svc,endpoints -n fitness-platform-production -o wide || true
            kubectl get events -n fitness-platform-production --sort-by=.lastTimestamp | tail -50 || true
            exit 1
          fi
      - name: Run UAT tests
        env:
          BASE_URL: ${{ steps.target.outputs.target }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          python scripts/api-test.py --base-url "$BASE_URL" --insecure --confirm-email
      - name: Collect auth diagnostics after UAT failure
        if: failure()
        shell: bash
        run: |
          namespace=fitness-platform-production
          kubectl get pods -n "$namespace" -l 'app in (gateway,user-service)' -o wide || true

          print_auth_events() {
            local pod="$1"
            shift
            local logs
            if ! logs=$(kubectl logs -n "$namespace" "$pod" --all-containers=true --since=15m --tail=200 "$@" 2>/dev/null); then
              return 0
            fi
            printf '%s\n' "$logs" | jq -Rrc '
              try fromjson catch empty
              | select((.message // "") | test("^(Register|Login)"))
              | {
                  timestamp,
                  level,
                  message,
                  http_code,
                  grpc_code: (try (.error | capture("code = (?<code>[^ ]+)").code) catch null)
                }
            '
          }

          for app in gateway user-service; do
            while IFS= read -r pod; do
              [[ -n "$pod" ]] || continue
              echo "Auth events from $pod (current container):"
              print_auth_events "$pod"
              echo "Auth events from $pod (previous container, if any):"
              print_auth_events "$pod" --previous
            done < <(kubectl get pods -n "$namespace" -l "app=$app" -o name)
          done

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-vps]
    timeout-minutes: 15
    if: always() && needs.deploy-vps.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Resolve VPS hostname
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Install frontend dependencies
        run: cd web && npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: cd web && ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          BASE_URL: "https://fittpulse.duckdns.org"
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        # Only chromium is installed in this job, but playwright.config.js declares
        # chromium/firefox/webkit projects: running all of them triples the workload
        # (264 tests) and blew the original 20 min limit. Pin the project.
        # Use the lockfile-pinned local binary instead of npx (no on-demand install).
        # The config pins CI to 1 worker; 4 workers on the 4-vCPU runner cuts the
        # wall time ~4x (each test gets its own isolated browser context).
        run: cd web && npm run test:e2e -- --project=chromium --workers=4
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  ml-e2e:
    name: ML E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-vps]
    timeout-minutes: 20
    if: always() && needs.deploy-vps.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Download kubeconfig artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kubeconfig
          path: .
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Configure kubectl
        run: bash scripts/ci/ci-helpers.sh configure_kubectl
      - name: Wait for ML services
        run: |
          kubectl -n fitness-platform-production rollout status deployment/classifier --timeout=120s
          kubectl -n fitness-platform-production rollout status deployment/ml-generator --timeout=300s
      - name: Run ML E2E tests
        run: |
          kubectl -n fitness-platform-production port-forward svc/classifier 18001:8001 &
          CLASSIFIER_PID=$!
          kubectl -n fitness-platform-production port-forward svc/ml-generator 18002:8002 &
          GAN_PID=$!
          trap 'kill $CLASSIFIER_PID $GAN_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 10); do
            curl -fsS http://127.0.0.1:18001/health >/dev/null 2>&1 && break
            sleep 1
          done
          python scripts/ml-e2e.py --classifier-url http://127.0.0.1:18001 --gan-url http://127.0.0.1:18002

  health-check:
    name: Server Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-vps]
    if: always() && needs.deploy-vps.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Deploy health check script
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh deploy_health_script
      - name: Run immediate health check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: bash scripts/ci/ci-helpers.sh run_immediate_health_check

  csp-headers-check:
    name: CSP Headers Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-vps]
    if: always() && needs.deploy-vps.result == 'success'
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Resolve VPS hostname and add to /etc/hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: bash scripts/ci/ci-helpers.sh resolve_vps_hostname
      - name: Check CSP and security headers
        env:
          CSP_DOMAIN: "https://${{ env.FITPULSE_DOMAIN }}"
        run: bash scripts/ci/verify.sh check_csp

  # ============================================================================
  # PHASE 9: SECURITY POST-DEPLOY & RELEASE
  # ============================================================================
  kube-bench:
    name: Kube-Bench CIS Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [provision-k8s-vps]
    if: always() && needs.provision-k8s-vps.result == 'success'
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Run kube-bench on k3s node via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" 'bash -s' << 'EOF'
          set -euo pipefail
          mkdir -p ~/security-results

           echo "Installing/updating kube-bench binary and config..."
           curl -sL https://github.com/aquasecurity/kube-bench/releases/download/v0.8.0/kube-bench_0.8.0_linux_amd64.tar.gz -o /tmp/kube-bench.tar.gz
           tar -xzf /tmp/kube-bench.tar.gz -C /tmp
           sudo mv /tmp/kube-bench /usr/local/bin/kube-bench

           sudo rm -rf /etc/kubebench
           sudo mkdir -p /etc/kubebench
           sudo cp -r /tmp/cfg/* /etc/kubebench/

           rm -f /tmp/kube-bench.tar.gz
           echo "✅ kube-bench installed successfully"


          echo "Running kube-bench scan..."
          # Убрали "|| true", чтобы пайплайн честно падал, если сканирование не удалось
          sudo kube-bench run --config-dir /tmp/cfg --targets node --json > ~/security-results/kube-bench-results.json
          EOF

          mkdir -p security-results
          # Скачиваем результат. Если файл пустой или команда выше упала, этот шаг тоже упадет (что правильно)
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}:~/security-results/kube-bench-results.json" security-results/

  kube-hunter:
    name: Kube-Hunter Penetration Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [provision-k8s-vps]
    if: always() && needs.provision-k8s-vps.result == 'success'
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Make retry script executable
        run: chmod +x scripts/ssh-retry.sh
      - name: 🌐 Подключение к сети Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add VPS to known_hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: bash scripts/ci/ci-helpers.sh add_vps_to_known_hosts
      - name: Run kube-hunter (passive scan)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}" 'bash -s' << 'EOF'
          set -euo pipefail
          mkdir -p ~/security-results
          if ! command -v kube-hunter >/dev/null 2>&1 && ! python3 -m kube_hunter --help >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip
            python3 -m pip install --break-system-packages --only-binary :all: kube-hunter==0.6.8
          fi
          if python3 -m kube_hunter --help >/dev/null 2>&1; then
            python3 -m kube_hunter --remote 127.0.0.1 --report json > ~/security-results/kube-hunter-results.json || true
          else
            kube-hunter --remote 127.0.0.1 --report json > ~/security-results/kube-hunter-results.json || true
          fi
          EOF
          mkdir -p security-results
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new "${VPS_USER}@${VPS_HOST}:~/security-results/kube-hunter-results.json" security-results/ 2>/dev/null || true

  cosign-verify:
    name: Cosign Verify Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker, validate-workflow]
    if: github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install cosign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/security.sh install_cosign
      - name: Download cosign public key
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: bash scripts/ci/security.sh download_cosign_public_key
      - name: Verify Docker image signatures
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/security.sh verify_cosign
      - name: Cleanup
        if: always()
        run: rm -rf /tmp/cosign-keys

  slsa-provenance:
    name: SLSA Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'release' && github.event.action == 'created'
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build artifacts
        run: bash scripts/ci/build-push.sh build_artifacts
      - name: Generate subject for provenance
        id: hash
        run: bash scripts/ci/ci-helpers.sh generate_provenance

  slsa-publish:
    name: SLSA Publish
    needs: [slsa-provenance]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: "${{ needs.slsa-provenance.outputs.hashes }}"
      upload-assets: true

  # ============================================================================
  # PHASE 10: NOTIFICATION & CLEANUP
  # ============================================================================
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      [
        detect-changes,
        issue-automation,
        frontend,
        validate-workflow,
        dockerfile-lint,
        super-linter,
        codeql,
        dependency-review,
        kubescape,
        semgrep,
        osv-scanner,
        fuzz-tests,
        scan-gosec,
        scan-govulncheck,
        scan-trivy-fs,
        scan-secrets,
        scan-sbom,
        security-gate,
        sonarcloud,
        go-check,
        test,
        contract,
        binary_build,
        docker,
        slsa-provenance,
        provision-k8s-vps,
        deploy-vps,
        test-e2e,
        playwright-e2e,
        ml-e2e,
        health-check,
        csp-headers-check,
        smoke-test,
        conventional-commits,
        kube-bench,
        kube-hunter,
        cosign-verify,
      ]
    steps:
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build Telegram message
        id: msg
        env:
          JOBS: ${{ toJson(needs) }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import json, os
          needs = json.loads(os.environ['JOBS'])
          repo = os.environ['REPO']
          ref = os.environ['REF']
          sha = os.environ['SHA']
          run_id = os.environ['RUN_ID']
          def emoji(r):
              return {'success':'✅','failure':'❌'}.get(r, '⏭️')
          def section(title, items):
              lines = [f'<b>{title}</b>']
              for key, name in items:
                  r = needs.get(key, {}).get('result', 'skipped')
                  lines.append(f'{emoji(r)} {name}')
              return '\n'.join(lines)
          checks = [
              ('validate-workflow','Validate Workflow'),
              ('dockerfile-lint','Dockerfile Lint'),
              ('super-linter','Super Linter'),
              ('frontend','Frontend'),
              ('go-check','Make Check'),
              ('conventional-commits','Conventional Commits'),
          ]
          security = [
              ('codeql','CodeQL'),
              ('kubescape','Kubescape'),
              ('scan-gosec','Gosec'),
              ('scan-trivy-fs','Trivy FS'),
              ('scan-secrets','Secrets'),
              ('security-gate','Security Gate'),
              ('sonarcloud','SonarCloud'),
              ('kube-bench','Kube-Bench'),
              ('kube-hunter','Kube-Hunter'),
              ('checkov','Checkov'),
              ('cosign-verify','Cosign Verify'),
          ]
          deploy = [
              ('binary_build','Build Binaries'),
              ('docker','Docker Build & Push'),
              ('provision-k8s-vps','Provision K8s on VPS'),
              ('deploy-vps','Deploy Full Stack to VPS'),
              ('test-e2e','Test E2E API'),
              ('playwright-e2e','Playwright E2E'),
              ('ml-e2e','ML E2E'),
              ('health-check','Health Check'),
              ('csp-headers-check','CSP Headers Check'),
              ('smoke-test','Smoke Test'),
          ]
          any_fail = any(
              v.get('result') == 'failure'
              for v in needs.values()
          ) or any(
              needs.get(k, {}).get('result') == 'skipped'
              for items in [checks, security, deploy]
              for k, _ in items
          )
          status = '❌ CI/CD ОШИБКА' if any_fail else '✅ CI/CD УСПЕШНО'
          msg = (
              f'<b>{status}</b>\n'
              f'<code>{repo}</code> @ <code>{ref}</code>\n'
              f'Commit: <a href="https://github.com/{repo}/commit/{sha}">{sha}</a>\n'
              f'<a href="https://github.com/{repo}/actions/runs/{run_id}">Открыть запуск</a>\n'
              f'{section("Проверки:", checks)}\n'
              f'{section("Безопасность:", security)}\n'
              f'{section("Деплой и тесты:", deploy)}\n'
              '🌐 Сайт: https://fittpulse.duckdns.org\n'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'status={status}\n')
              f.write('message<<EOF\n')
              f.write(msg)
              f.write('EOF\n')
          PYEOF
      - name: Send to Telegram
        if: always()
        continue-on-error: true
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: ${{ steps.msg.outputs.message }}

  dependabot-auto-merge:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge for Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "$PR_URL" ||
            echo "::warning::Auto-merge is not enabled for this repository (enablePullRequestAutoMerge); skipping"
      - name: Auto-approve minor/patch updates
        if: contains(github.event.pull_request.title, 'minor') || contains(github.event.pull_request.title, 'patch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"
