version: 2
# Чеклист для поддержания безопасности
# Раз в месяц: go get -u ./... && go mod tidy
# Раз в квартал: govulncheck ./... -show verbose
# При добавлении новых зависимостей: проверять через osv-scanner
# Документация: автоматические проверки версий запускаются через .github/workflows/docs-check.yml
# Debian base images: отслеживаются через ecosystem "docker" (python:3.14-slim и др.)
#
# ⚠️  Ограничения dependabot:
# - Не отслеживает версии Ubuntu/ОС в markdown-документации (требуется docs-check.yml)
# - Не отслеживает версии Go-инструментов, устанавливаемых через `go install` (protoc-gen-go, trufflehog и др.)
#   Версии этих инструментов зафиксированы в документации и проверяются docs-check.yml
# - Не проверяет консистентность версий между docs и code (требуется docs-check.yml)
# - Для версий Ubuntu используйте docs-check.yml + ручное обновление при смене сервера

registries:
  ghcr:
    type: docker-registry
    url: https://ghcr.io
    username: ${{ github.actor }}
    password: ${{ secrets.GHCR_TOKEN }}

updates:
  # ═══════════════════════════════════════════════════════════════
  # 1. GO МОДУЛИ (основной backend)
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(go)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
      - "automated"
    assignees:
      - "MAMUER"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
    allow:
      - dependency-type: "direct"

  # ═══════════════════════════════════════════════════════════════
  # 2. GITHUB ACTIONS (CI/CD)
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
      - "automated"
    assignees:
      - "MAMUER"
    groups:
      actions-updates:
        patterns:
          - "*"

  # ═══════════════════════════════════════════════════════════════
  # 3. DOCKER — Go-сервисы
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "docker"
    directory: "/cmd/gateway"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(docker/gateway)", include: "scope" }
    labels: ["dependencies", "docker", "gateway"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/user-service"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(docker/user-service)", include: "scope" }
    labels: ["dependencies", "docker", "user-service"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/biometric-service"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      { prefix: "deps(docker/biometric-service)", include: "scope" }
    labels: ["dependencies", "docker", "biometric-service"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/training-service"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      { prefix: "deps(docker/training-service)", include: "scope" }
    labels: ["dependencies", "docker", "training-service"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/device-aggregator"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      { prefix: "deps(docker/device-aggregator)", include: "scope" }
    labels: ["dependencies", "docker", "device-aggregator"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/device-aggregator"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      { prefix: "deps(docker/device-aggregator)", include: "scope" }
    labels: ["dependencies", "docker", "device-aggregator"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  - package-ecosystem: "docker"
    directory: "/cmd/classifier"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(docker/classifier)", include: "scope" }
    labels: ["dependencies", "docker", "classifier"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  # ═══════════════════════════════════════════════════════════════
  # 4. PYTHON (pip) — ML-сервисы
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "pip"
    directory: "/cmd/ml_generator"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(pip/ml-generator)", include: "scope" }
    labels: ["dependencies", "python", "ml-generator"]
    assignees: ["MAMUER"]
    groups:
      ml-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic"
          - "pandas"
          - "matplotlib"
          - "valkey"
          - "pika"
          - "joblib"
          - "prometheus-client"
        update-types:
          - "minor"
          - "patch"

  # ═══════════════════════════════════════════════════════════════
  # 5. DOCKER — ML-сервисы (Python-образы)
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "docker"
    directory: "/cmd/ml_generator"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(docker/ml-generator)", include: "scope" }
    labels: ["dependencies", "docker", "ml-generator"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  # ═══════════════════════════════════════════════════════════════
  # 6. KUBERNETES MANIFESTS — базовые deployment'ы + base + overlays
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "docker"
    directory: "/configs/k8s/base"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(k8s/base)", include: "scope" }
    labels: ["dependencies", "docker", "kubernetes"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]
    ignore:
      - dependency-name: "alpine"
      - dependency-name: "busybox"
      - dependency-name: "postgres"
      - dependency-name: "valkey/valkey"
      - dependency-name: "rabbitmq"
      - dependency-name: "grafana/grafana"
      - dependency-name: "prom/prometheus"
      - dependency-name: "prom/alertmanager"
      - dependency-name: "fluent/fluent-bit"
      - dependency-name: "prom/node-exporter"
      - dependency-name: "rancher/local-path-provisioner"
      - dependency-name: "rancher/mirrored-pause"
      - dependency-name: "rancher/mirrored-coredns-coredns"
      - dependency-name: "registry.k8s.io/ingress-nginx/controller"

  # ═══════════════════════════════════════════════════════════════
  # 7. KUBERNETES MANIFESTS — ingress-nginx
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "docker"
    directory: "/configs/k8s/base/ingress-nginx"
    schedule:
      {
        interval: "monthly",
        day: "monday",
        time: "09:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(k8s/ingress-nginx)", include: "scope" }
    labels: ["dependencies", "docker", "kubernetes", "ingress-nginx"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  # ═══════════════════════════════════════════════════════════════
  # 8. KUBERNETES MANIFESTS — overlays/production
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "docker"
    directory: "/configs/k8s/overlays/production"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(k8s/overlays)", include: "scope" }
    labels: ["dependencies", "docker", "kubernetes"]
    assignees: ["MAMUER"]
    registries: ["ghcr"]

  # ═══════════════════════════════════════════════════════════════
  # 8. NPM — Frontend (React + Vite)
  # ═══════════════════════════════════════════════════════════════
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      {
        interval: "weekly",
        day: "monday",
        time: "08:00",
        timezone: "Europe/Moscow",
      }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(npm/frontend)", include: "scope" }
    labels: ["dependencies", "npm", "frontend"]
    assignees: ["MAMUER"]
    groups:
      frontend-deps:
        patterns:
          - "react*"
          - "@vitejs/*"
          - "vite"
          - "chart.js"
          - "react-chartjs-2"
          - "react-router-dom"
          - "@biomejs/*"
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        patterns:
          - "*"
        update-types:
          - "major"
