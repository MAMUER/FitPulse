name: "Go Setup"
description: "Set up Go with cache"
inputs:
  go-version:
    description: "Go version"
    required: false
    default: "1.27.4"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
